name: C6 v23 Workflow Builder v3

on:
  push:
    branches: [codex/c6-v23-workflow-builder-20260908]
    paths:
      - .github/scripts/build_c6_w23.py
      - .github/workflows/c6-v23-workflow-builder-v3.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f9da08afebf22b3dc03a1fb3a0ec351a79adf42c
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: candidate/requirements-lock.txt
      - run: python -m pip install --require-hashes -r candidate/requirements-lock.txt
      - name: Build and validate exact W23 workflow
        run: |
          python .github/scripts/build_c6_w23.py candidate/.github/workflows/c6-bound-economic.yml
          git -C candidate diff --check
          test "$(git -C candidate diff --name-only)" = '.github/workflows/c6-bound-economic.yml'
      - name: Commit exact W23 object
        run: |
          set -euo pipefail
          git -C candidate add .github/workflows/c6-bound-economic.yml
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate commit -m 'C6 W23: recover and attest frozen Base22 shards'
          git -C candidate rev-parse HEAD | tee w23-sha.txt
          git -C candidate rev-parse HEAD^{tree} | tee w23-tree.txt
          git -C candidate diff --name-only HEAD^ HEAD | tee w23-paths.txt
          git -C candidate push origin HEAD:refs/heads/codex/c6-v23-workflow-anchor || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-w23-builder-v3-${{ github.run_id }}
          path: |
            w23-sha.txt
            w23-tree.txt
            w23-paths.txt
          if-no-files-found: ignore
          retention-days: 30
