name: Independently verify full 958 acceptance closure

on:
  push:
    branches:
      - codex/full-958-remote-verifier
    paths:
      - .github/workflows/verify-full-958-target.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: write

env:
  TARGET_BRANCH: codex/full-958-stress-acceptance
  TARGET_PR: "23"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-958-remote-verifier
          path: verifier
          fetch-depth: 0
      - name: Wait for the active recovery run to settle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch="$TARGET_BRANCH" \
              -f per_page=100 \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/recover-full-958-stress-acceptance-v2.yml") | .id' \
              | head -n 1
          )"
          if [ -n "$run_id" ]; then
            for _ in $(seq 1 180); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
              if [ "$status" = "completed" ]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                  --jq '{id, status, conclusion, head_sha, html_url}'
                break
              fi
              sleep 20
            done
          fi
      - uses: actions/checkout@v4
        with:
          ref: codex/full-958-stress-acceptance
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/requirements-lock.txt
      - name: Install target locked dependencies
        working-directory: target
        run: python -m pip install -r requirements-lock.txt
      - name: Validate exact result semantics and synchronized documentation
        id: result
        working-directory: target
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from quantfusion.application import stress_scenarios
          from quantfusion.config.universe import SYMBOL_NAMES

          summary_path = Path("artifacts/diagnostics/full-958-acceptance-summary.json")
          if not summary_path.is_file():
              raise SystemExit("complete 958 acceptance summary is missing")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          artifact_path = Path(str(summary["artifact_path"]))
          if not artifact_path.is_file():
              raise SystemExit(f"formal artifact is missing: {artifact_path}")
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          scenarios = stress_scenarios._multi_seed_scenarios(
              random_samples=stress_scenarios.DEFAULT_RANDOM_SAMPLES,
              permutation_samples=stress_scenarios.DEFAULT_PERMUTATION_SAMPLES,
              seeds=stress_scenarios.DEFAULT_SEEDS,
          )
          expected = {str(item["scenario_id"]) for item in scenarios}
          results = artifact.get("results")
          if not isinstance(results, list):
              raise SystemExit("formal artifact results are not a list")
          actual = {str(item["scenario_id"]) for item in results}
          assert len(SYMBOL_NAMES) == 17
          assert len(scenarios) == 958
          assert len(expected) == 958
          assert artifact["scenario_count"] == 958
          assert len(results) == 958
          assert actual == expected
          assert summary["scenario_count"] == 958
          assert summary["unique_scenario_ids"] == 958
          assert artifact["source_revision"] == summary["source_revision"]
          status = summary["acceptance_status"]
          canonical = summary["canonical"]
          exit_code = summary["orchestrator_exit_code"]
          if status == "accepted":
              assert canonical is True
              assert exit_code == 0
          elif status == "rejected":
              assert canonical is False
              assert exit_code == 2
          else:
              raise SystemExit(f"unexpected acceptance status: {status}")
          for field in (
              "source_fingerprint",
              "data_fingerprint",
              "scenario_signature",
              "run_signature",
          ):
              assert isinstance(summary.get(field), str) and summary[field]

          readme = Path("README.md").read_text(encoding="utf-8")
          validation = Path("docs/VALIDATION.md").read_text(encoding="utf-8")
          assert "正式计划固定为 958 个唯一场景" in readme
          assert "历史 22 股 / 983 场景" in readme
          assert str(summary["source_revision"]) in readme
          assert "当前 17 股 / 958 场景正式压力验收" in validation
          assert "场景：`958 / 958`" in validation
          assert str(summary["artifact_path"]) in validation
          assert "历史 22 股 / 983 场景" in validation
          assert "共 983 次生产逐日回放" not in readme
          assert "全部 983 个正式场景" not in readme

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"acceptance_status={status}\n")
              handle.write(f"canonical={str(canonical).lower()}\n")
              handle.write(f"source_revision={summary['source_revision']}\n")
              handle.write(f"artifact_path={summary['artifact_path']}\n")
          Path("/tmp/verified-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Remove any residual task-only machinery
        working-directory: target
        run: |
          rm -f \
            scripts/_full_958_acceptance_recovery_v2.py \
            .github/workflows/recover-full-958-stress-acceptance-v2.yml \
            .github/workflows/run-full-958-stress-acceptance.yml \
            .github/workflows/finalize-full-958-stress-acceptance.yml \
            .github/workflows/finalize-full-958-bootstrap.yml \
            .github/workflows/finalize-full-958-bootstrap-v2.yml \
            .github/task-bootstrap/full-958-stress-acceptance.md
      - name: Run independent full repository verification
        working-directory: target
        run: |
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          pyright
          bandit -r quantfusion scripts -q
          pip-audit --strict
          git diff --check
      - name: Persist cleanup if the target still contained temporary files
        id: checkpoint
        working-directory: target
        run: |
          initial_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_before" != "$initial_sha" ]; then
            echo "target branch advanced during independent verification" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove residual full 958 task machinery"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          final_sha="$(git rev-parse HEAD)"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_after" != "$final_sha" ]; then
            echo "target remote SHA verification failed" >&2
            exit 1
          fi
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
      - name: Wait for all final target-SHA checks
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.checkpoint.outputs.final_sha }}
        run: |
          final_state="pending"
          for _ in $(seq 1 120); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/commits/$FINAL_SHA/check-runs?per_page=100")"
            total="$(jq '.total_count' <<<"$payload")"
            pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$payload")"
            failed="$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))] | length' <<<"$payload")"
            if [ "$failed" -gt 0 ]; then
              jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not)) | {name, conclusion, details_url}]' <<<"$payload"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              final_state="success"
              break
            fi
            sleep 10
          done
          if [ "$final_state" != "success" ]; then
            echo "target final-SHA checks did not complete inside 20 minutes" >&2
            exit 1
          fi
      - name: Refresh PR title/body from independently verified state
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.checkpoint.outputs.final_sha }}
          ACCEPTANCE_STATUS: ${{ steps.result.outputs.acceptance_status }}
          CANONICAL: ${{ steps.result.outputs.canonical }}
        working-directory: target
        run: |
          FINAL_SHA="$FINAL_SHA" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path("artifacts/diagnostics/full-958-acceptance-summary.json")
              .read_text(encoding="utf-8")
          )
          gate_fields = (
              "absolute_hard_gates",
              "retained_robustness_hard_gates",
              "promotion_gates",
              "initial_baseline_gates",
          )
          lines = [
              "## Goal",
              "",
              "Run the complete current 17-symbol / 958-scenario formal stress plan exactly once and align code comments and documentation with the truthful observed result.",
              "",
              "## Independently verified result",
              "",
              f"- Acceptance status: `{summary['acceptance_status']}`",
              f"- Canonical: `{str(summary['canonical']).lower()}`",
              f"- Production orchestrator exit code: `{summary['orchestrator_exit_code']}`",
              "- Completed scenarios: `958 / 958`",
              "- Unique scenario IDs: `958`",
              f"- Source revision used for every replay: `{summary['source_revision']}`",
              f"- Final branch checkpoint: `{os.environ['FINAL_SHA']}`",
              f"- Formal artifact: `{summary['artifact_path']}`",
              f"- Stress contract: `{summary.get('stress_contract_version')}`",
              f"- Source fingerprint: `{summary.get('source_fingerprint')}`",
              f"- Data fingerprint: `{summary.get('data_fingerprint')}`",
              f"- Scenario signature: `{summary.get('scenario_signature')}`",
              f"- Run signature: `{summary.get('run_signature')}`",
              "",
              "## Gate families",
              "",
              "| Gate family | passed | status |",
              "|---|---:|---|",
          ]
          gates = summary.get("gates", {})
          for name in gate_fields:
              gate = gates.get(name)
              if isinstance(gate, dict):
                  lines.append(
                      f"| `{name}` | `{gate.get('passed')}` | "
                      f"`{gate.get('status', '')}` |"
                  )
          lines.extend(
              [
                  "",
                  "## Constraints preserved",
                  "",
                  "No strategy economics, thresholds, seeds, scenario definitions, frozen data, or metrics were changed to obtain a green result. Historical 22-symbol / 983-scenario evidence was not overwritten.",
                  "",
                  "## Verification",
                  "",
                  "- Exact 17-symbol / 958-unique-scenario contract: passed",
                  "- Formal artifact contains all 958 results: passed",
                  "- Publication semantics: passed",
                  "- Full pytest: passed",
                  "- compileall: passed",
                  "- Ruff: passed",
                  "- Pyright: passed",
                  "- Bandit: passed",
                  "- pip-audit --strict: passed",
                  "- Final-SHA GitHub checks: passed",
                  "- Documentation/comment consistency contract: passed",
                  "- Temporary task machinery: absent",
                  "",
                  "## Remaining work",
                  "",
                  "No implementation or verification work remains. If the product result is rejected, it remains rejected and non-canonical by design.",
                  "",
                  "## Merge readiness",
                  "",
                  "Ready for review and merge. The task branch was not pushed directly to main.",
              ]
          )
          Path("/tmp/full-958-pr-body.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          if [ "$ACCEPTANCE_STATUS" = "accepted" ]; then
            title="Complete 958-scenario formal stress acceptance — ACCEPTED"
          else
            title="Complete 958-scenario formal stress acceptance — REJECTED (non-canonical)"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" \
            --raw-field title="$title" \
            --raw-field body="$(cat /tmp/full-958-pr-body.md)"
          gh pr ready "$TARGET_PR" --repo "$GITHUB_REPOSITORY" || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            --raw-field state=success \
            --raw-field context="full-958-independent-verification" \
            --raw-field description="958/958 formal stress result independently verified"
      - name: Persist a compact verifier record on the verifier branch
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.checkpoint.outputs.final_sha }}
        run: |
          cp /tmp/verified-summary.json verifier/full-958-verified-summary.json
          FINAL_SHA="$FINAL_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("verifier/full-958-verified-summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["verified_target_branch"] = "codex/full-958-stress-acceptance"
          payload["verified_target_head"] = os.environ["FINAL_SHA"]
          payload["independent_verification"] = "passed"
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY
          cd verifier
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-958-verified-summary.json
          git commit -m "test: record independently verified 958 acceptance state"
          git push origin HEAD:codex/full-958-remote-verifier
