name: C6 v35 AB5 Frozen Source Validation

on:
  push:
    branches:
      - codex/c6-v30-selection-provenance-build

permissions:
  contents: read

concurrency:
  group: c6-v35-ab5-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: builder
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2b00bb0faeda0e4bbe90b88d4d9f74ff25feae36
          path: p
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4b8ffebc298f02838b0bb5a695442ce7a69e40ef
          path: ib
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 30ec06b2fb19feea7c5dc060154b17d43e1bda52
          path: is
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact runtime and frozen refs
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = 3.12.14
          test "$(git -C p rev-parse HEAD)" = 2b00bb0faeda0e4bbe90b88d4d9f74ff25feae36
          test "$(git -C ib rev-parse HEAD)" = 4b8ffebc298f02838b0bb5a695442ce7a69e40ef
          test "$(git -C is rev-parse HEAD)" = 30ec06b2fb19feea7c5dc060154b17d43e1bda52
          test "$(git -C p rev-parse HEAD^)" = 3b4b9c2554b2ac54d065173d3889040a30bc6e89
          test "$(git -C ib rev-parse HEAD^)" = 2b00bb0faeda0e4bbe90b88d4d9f74ff25feae36
          test "$(git -C is rev-parse HEAD^)" = 4b8ffebc298f02838b0bb5a695442ce7a69e40ef
          test "$(git -C ib rev-parse HEAD^{tree})" = 9c248d6a10ef6ac15d954b36c5aae22c41424d0d
          test "$(git -C is rev-parse HEAD^{tree})" = eadff658551c72d00f6aec47a451cf046242d258
      - name: Install unchanged locked dependencies
        run: python -m pip install --require-hashes -r ib/requirements-lock.txt
      - name: Validate preregistration and exact implementation boundaries
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("ib").resolve()))
          from quantfusion.application.c6_contract import strict_json_load, validate_preregistration
          prereg = strict_json_load("p/artifacts/diagnostics/c6-preregistration.json")
          validate_preregistration(prereg, repository="p")
          assert prereg["experiment_id"] == "c6-causal-risk-closure-17x958-v35"
          assert prereg["authority"]["recovery_continuation"]["account_budget_revision_v35"]["locked_diagnostic"]["run_id"] == 34410163617
          PY
          test "$(git -C p diff --name-status --no-renames HEAD^ HEAD)" = "$(printf 'A\tartifacts/diagnostics/c6-preregistration.json')"
          test -z "$(git -C ib rev-list --merges --first-parent 2b00bb0faeda0e4bbe90b88d4d9f74ff25feae36..HEAD)"
          test -z "$(git -C is rev-list --merges --first-parent 4b8ffebc298f02838b0bb5a695442ce7a69e40ef..HEAD)"
          python - <<'PY'
          import json, subprocess

          prereg = json.load(open("p/artifacts/diagnostics/c6-preregistration.json"))
          pairs = {
              "I_B": ("2b00bb0faeda0e4bbe90b88d4d9f74ff25feae36", "ib"),
              "I_S": ("4b8ffebc298f02838b0bb5a695442ce7a69e40ef", "is"),
          }
          for alias, (base_revision, implementation) in pairs.items():
              raw = subprocess.check_output(
                  ["git", "-C", implementation, "diff", "--raw", "-z", "--no-renames", base_revision, "HEAD"]
              ).split(b"\0")
              paths = []
              for offset in range(0, len(raw) - 1, 2):
                  metadata = raw[offset].split()
                  path = raw[offset + 1].decode()
                  assert len(metadata) == 5 and metadata[-1] in {b"A", b"M"}
                  assert metadata[0] in {b":000000", b":100644"} and metadata[1] == b"100644"
                  paths.append(path)
              allowed = set(prereg["implementation_freeze"][f"{alias}_allowed_paths"])
              assert set(paths) <= allowed
              added = deleted = 0
              rows = subprocess.check_output(
                  ["git", "-C", implementation, "diff", "--numstat", "-z", "--no-renames", base_revision, "HEAD"]
              ).split(b"\0")
              for row in rows:
                  if not row:
                      continue
                  plus, minus, _ = row.split(b"\t", 2)
                  added += int(plus)
                  deleted += int(minus)
              budget = prereg["implementation_freeze"][f"{alias}_diff_budget"]
              assert len(set(paths)) <= budget["maximum_changed_paths"]
              assert added <= budget["maximum_added_lines"]
              assert deleted <= budget["maximum_deleted_lines"]
          PY
      - name: Run frozen Base engineering suite
        working-directory: ib
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open("artifacts/diagnostics/c6-preregistration.json"))
          subprocess.run(p["implementation_freeze"]["I_B_pytest_exact_argv"], check=True)
          for argv in p["implementation_freeze"]["engineering_suite_common_exact_argv"]:
              subprocess.run(argv, check=True)
          PY
      - name: Run frozen conditional-S engineering suite
        working-directory: is
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open("artifacts/diagnostics/c6-preregistration.json"))
          subprocess.run(p["implementation_freeze"]["I_S_pytest_exact_argv"], check=True)
          for argv in p["implementation_freeze"]["engineering_suite_common_exact_argv"]:
              subprocess.run(argv, check=True)
          PY
      - name: Publish validation receipt
        if: success()
        run: |
          mkdir -p export
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          def out(cwd,*args):
              return subprocess.check_output(("git","-C",cwd,*args),text=True).strip()
          receipt={
            "kind":"C6_V35_AB5_FROZEN_SOURCE_VALIDATION",
            "canonical":False,
            "accepted":False,
            "economic_dispatches":0,
            "P":"2b00bb0faeda0e4bbe90b88d4d9f74ff25feae36",
            "I_B":"4b8ffebc298f02838b0bb5a695442ce7a69e40ef",
            "I_B_tree":"9c248d6a10ef6ac15d954b36c5aae22c41424d0d",
            "I_S":"30ec06b2fb19feea7c5dc060154b17d43e1bda52",
            "I_S_tree":"eadff658551c72d00f6aec47a451cf046242d258",
            "python":"3.12.14",
            "runtime_manifest":"sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970",
            "preregistration_sha256":hashlib.sha256(pathlib.Path("p/artifacts/diagnostics/c6-preregistration.json").read_bytes()).hexdigest(),
            "all_declared_engineering_checks_passed":True,
          }
          pathlib.Path("export/receipt.json").write_text(json.dumps(receipt,sort_keys=True,separators=(",",":"))+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-v35-ab5-source-validation-${{ github.run_id }}
          path: export/*
          if-no-files-found: warn
          retention-days: 90
