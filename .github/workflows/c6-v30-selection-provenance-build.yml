name: C6 v34 AB5 Frozen Source Validation

on:
  push:
    branches:
      - codex/c6-v30-selection-provenance-build

permissions:
  contents: read

concurrency:
  group: c6-v34-ab5-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: builder
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c2d7521c5d27311638614e12819698fd68368ca8
          path: p
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7d284ef1908f7f442ce13dd5b227acb4957567aa
          path: ib
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2b97a9883e2d94402394f278b63c47183a0cbf07
          path: is
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact runtime and frozen refs
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = 3.12.14
          test "$(git -C p rev-parse HEAD)" = c2d7521c5d27311638614e12819698fd68368ca8
          test "$(git -C ib rev-parse HEAD)" = 7d284ef1908f7f442ce13dd5b227acb4957567aa
          test "$(git -C is rev-parse HEAD)" = 2b97a9883e2d94402394f278b63c47183a0cbf07
          test "$(git -C p rev-parse HEAD^)" = 3b4b9c2554b2ac54d065173d3889040a30bc6e89
          test "$(git -C ib rev-parse HEAD^)" = c2d7521c5d27311638614e12819698fd68368ca8
          test "$(git -C is rev-parse HEAD^)" = 7d284ef1908f7f442ce13dd5b227acb4957567aa
          test "$(git -C ib rev-parse HEAD^{tree})" = 6b1934ca0a91a25c89bf0b589d86b0f0c92621bb
          test "$(git -C is rev-parse HEAD^{tree})" = 580f3b31f92808ff666412add63d70e5814f3691
      - name: Install unchanged locked dependencies
        run: python -m pip install --require-hashes -r ib/requirements-lock.txt
      - name: Validate preregistration and exact implementation boundaries
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("ib").resolve()))
          from quantfusion.application.c6_contract import strict_json_load, validate_preregistration
          prereg = strict_json_load("p/artifacts/diagnostics/c6-preregistration.json")
          validate_preregistration(prereg, repository="p")
          assert prereg["experiment_id"] == "c6-causal-risk-closure-17x958-v34"
          assert prereg["authority"]["recovery_continuation"]["account_budget_revision_v34"]["locked_diagnostic"]["run_id"] == 34410163617
          PY
          test "$(git -C p diff --name-status --no-renames HEAD^ HEAD)" = "$(printf 'A\tartifacts/diagnostics/c6-preregistration.json')"
          test -z "$(git -C ib rev-list --merges --first-parent c2d7521c5d27311638614e12819698fd68368ca8..HEAD)"
          test -z "$(git -C is rev-list --merges --first-parent 7d284ef1908f7f442ce13dd5b227acb4957567aa..HEAD)"
      - name: Run frozen Base engineering suite
        working-directory: ib
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open("artifacts/diagnostics/c6-preregistration.json"))
          subprocess.run(p["implementation_freeze"]["I_B_pytest_exact_argv"], check=True)
          for argv in p["implementation_freeze"]["engineering_suite_common_exact_argv"]:
              subprocess.run(argv, check=True)
          PY
      - name: Run frozen conditional-S engineering suite
        working-directory: is
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open("artifacts/diagnostics/c6-preregistration.json"))
          subprocess.run(p["implementation_freeze"]["I_S_pytest_exact_argv"], check=True)
          for argv in p["implementation_freeze"]["engineering_suite_common_exact_argv"]:
              subprocess.run(argv, check=True)
          PY
      - name: Publish validation receipt
        if: success()
        run: |
          mkdir -p export
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          def out(cwd,*args):
              return subprocess.check_output(("git","-C",cwd,*args),text=True).strip()
          receipt={
            "kind":"C6_V34_AB5_FROZEN_SOURCE_VALIDATION",
            "canonical":False,
            "accepted":False,
            "economic_dispatches":0,
            "P":"c2d7521c5d27311638614e12819698fd68368ca8",
            "I_B":"7d284ef1908f7f442ce13dd5b227acb4957567aa",
            "I_B_tree":"6b1934ca0a91a25c89bf0b589d86b0f0c92621bb",
            "I_S":"2b97a9883e2d94402394f278b63c47183a0cbf07",
            "I_S_tree":"580f3b31f92808ff666412add63d70e5814f3691",
            "python":"3.12.14",
            "runtime_manifest":"sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970",
            "preregistration_sha256":hashlib.sha256(pathlib.Path("p/artifacts/diagnostics/c6-preregistration.json").read_bytes()).hexdigest(),
            "all_declared_engineering_checks_passed":True,
          }
          pathlib.Path("export/receipt.json").write_text(json.dumps(receipt,sort_keys=True,separators=(",",":"))+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-v34-ab5-source-validation-${{ github.run_id }}
          path: export/*
          if-no-files-found: warn
          retention-days: 90
