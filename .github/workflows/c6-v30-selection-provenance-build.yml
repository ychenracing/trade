name: C6 v40 AB5 Frozen Source and R Validation

on:
  push:
    branches:
      - codex/c6-v30-selection-provenance-build

permissions:
  contents: read

concurrency:
  group: c6-v40-ab5-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: builder
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 26f3f63c654f9d9b2034e84501f1534ef9ca850c
          path: p
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 914e8cbca90689a9b4bf22ad5c5ad62f6d49fd86
          path: ib
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: af2f146940c12fa5449751d4e2106f24b048ff77
          path: is
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c8977da721ecdc1daa822acdea14212c988ecf1f
          path: r
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact runtime and frozen refs
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = 3.12.14
          test "$(git -C p rev-parse HEAD)" = 26f3f63c654f9d9b2034e84501f1534ef9ca850c
          test "$(git -C ib rev-parse HEAD)" = 914e8cbca90689a9b4bf22ad5c5ad62f6d49fd86
          test "$(git -C is rev-parse HEAD)" = af2f146940c12fa5449751d4e2106f24b048ff77
          test "$(git -C p rev-parse HEAD^)" = 1f8385f7a0421dcb1d666d1c27984ead8b6c5c9d
          test "$(git -C ib rev-parse HEAD^)" = 26f3f63c654f9d9b2034e84501f1534ef9ca850c
          test "$(git -C is rev-parse HEAD^)" = 914e8cbca90689a9b4bf22ad5c5ad62f6d49fd86
          test "$(git -C ib rev-parse HEAD^{tree})" = 4f9cc0b8c6c1deb82bbcfd821bb97631fb63ea8c
          test "$(git -C is rev-parse HEAD^{tree})" = 763f673c92ddcf8c75f70d2fc95d942f6322127d
          test "$(git -C r rev-parse HEAD)" = c8977da721ecdc1daa822acdea14212c988ecf1f
          test "$(git -C r rev-parse HEAD^)" = 26f3f63c654f9d9b2034e84501f1534ef9ca850c
          test "$(git -C r rev-parse HEAD^{tree})" = 2e12d9aa27a6bb391665d4681807003d624fd8e8
          git -C r fetch --no-tags origin codex/c6-base-v40 codex/c6-s-v40
      - name: Install unchanged locked dependencies
        run: python -m pip install --require-hashes -r ib/requirements-lock.txt
      - name: Validate preregistration and exact implementation boundaries
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("ib").resolve()))
          from quantfusion.application.c6_contract import strict_json_load, validate_preregistration, load_run_bindings, validate_implementation_git_proofs
          prereg = strict_json_load("p/artifacts/diagnostics/c6-preregistration.json")
          validate_preregistration(prereg, repository="p")
          bindings = load_run_bindings("r/artifacts/diagnostics/c6-run-bindings.json")
          assert bindings["P"]["commit"] == "26f3f63c654f9d9b2034e84501f1534ef9ca850c"
          assert [item["candidate_id"] for item in bindings["binding_records"]] == [
              "C6-Base+AB5", "C6-Base+AB5+S", "C6-Base+AB5+S",
              "C6-Base+AB5", "C6-Base+AB5+S", "C6-Base+AB5", "C6-Base+AB5+S",
          ]
          validate_implementation_git_proofs(
              prereg, bindings, repository=Path("r"),
              bindings_revision="c8977da721ecdc1daa822acdea14212c988ecf1f",
          )
          assert prereg["experiment_id"] == "c6-causal-risk-closure-17x958-v40"
          assert prereg["authority"]["recovery_continuation"]["account_budget_revision_v36"]["locked_diagnostic"]["run_id"] == 34410163617
          PY
          test -z "$(git -C ib rev-list --merges --first-parent 26f3f63c654f9d9b2034e84501f1534ef9ca850c..HEAD)"
          test -z "$(git -C is rev-list --merges --first-parent 914e8cbca90689a9b4bf22ad5c5ad62f6d49fd86..HEAD)"
          python - <<'PY'
          import json, subprocess

          prereg = json.load(open("p/artifacts/diagnostics/c6-preregistration.json"))
          p_raw = subprocess.check_output(
              ["git", "-C", "p", "diff", "--raw", "-z", "--no-renames", "HEAD^", "HEAD"]
          ).split(b"\0")
          p_paths = []
          for offset in range(0, len(p_raw) - 1, 2):
              metadata = p_raw[offset].split()
              path = p_raw[offset + 1].decode()
              assert len(metadata) == 5 and metadata[-1] in {b"A", b"M"}
              assert metadata[0] in {b":000000", b":100644"} and metadata[1] == b"100644"
              p_paths.append(path)
          assert "artifacts/diagnostics/c6-preregistration.json" in p_paths
          assert set(p_paths) <= set(prereg["implementation_freeze"]["P_allowed_paths"])
          pairs = {
              "I_B": ("26f3f63c654f9d9b2034e84501f1534ef9ca850c", "ib"),
              "I_S": ("914e8cbca90689a9b4bf22ad5c5ad62f6d49fd86", "is"),
          }
          for alias, (base_revision, implementation) in pairs.items():
              raw = subprocess.check_output(
                  ["git", "-C", implementation, "diff", "--raw", "-z", "--no-renames", base_revision, "HEAD"]
              ).split(b"\0")
              paths = []
              for offset in range(0, len(raw) - 1, 2):
                  metadata = raw[offset].split()
                  path = raw[offset + 1].decode()
                  assert len(metadata) == 5 and metadata[-1] in {b"A", b"M"}
                  assert metadata[0] in {b":000000", b":100644"} and metadata[1] == b"100644"
                  paths.append(path)
              allowed = set(prereg["implementation_freeze"][f"{alias}_allowed_paths"])
              assert set(paths) <= allowed
              added = deleted = 0
              rows = subprocess.check_output(
                  ["git", "-C", implementation, "diff", "--numstat", "-z", "--no-renames", base_revision, "HEAD"]
              ).split(b"\0")
              for row in rows:
                  if not row:
                      continue
                  plus, minus, _ = row.split(b"\t", 2)
                  added += int(plus)
                  deleted += int(minus)
              budget = prereg["implementation_freeze"][f"{alias}_diff_budget"]
              assert len(set(paths)) <= budget["maximum_changed_paths"]
              assert added <= budget["maximum_added_lines"]
              assert deleted <= budget["maximum_deleted_lines"]
          PY
      - name: Run frozen Base engineering suite
        working-directory: ib
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open("artifacts/diagnostics/c6-preregistration.json"))
          subprocess.run(p["implementation_freeze"]["I_B_pytest_exact_argv"], check=True)
          for argv in p["implementation_freeze"]["engineering_suite_common_exact_argv"]:
              subprocess.run(argv, check=True)
          PY
      - name: Run frozen conditional-S engineering suite
        working-directory: is
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open("artifacts/diagnostics/c6-preregistration.json"))
          subprocess.run(p["implementation_freeze"]["I_S_pytest_exact_argv"], check=True)
          for argv in p["implementation_freeze"]["engineering_suite_common_exact_argv"]:
              subprocess.run(argv, check=True)
          PY
      - name: Publish validation receipt
        if: success()
        run: |
          mkdir -p export
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          def out(cwd,*args):
              return subprocess.check_output(("git","-C",cwd,*args),text=True).strip()
          receipt={
            "kind":"C6_V40_AB5_FROZEN_SOURCE_AND_R_VALIDATION",
            "canonical":False,
            "accepted":False,
            "economic_dispatches":0,
            "P":"26f3f63c654f9d9b2034e84501f1534ef9ca850c",
            "I_B":"914e8cbca90689a9b4bf22ad5c5ad62f6d49fd86",
            "I_B_tree":"4f9cc0b8c6c1deb82bbcfd821bb97631fb63ea8c",
            "I_S":"af2f146940c12fa5449751d4e2106f24b048ff77",
            "I_S_tree":"763f673c92ddcf8c75f70d2fc95d942f6322127d",
            "R":"c8977da721ecdc1daa822acdea14212c988ecf1f",
            "R_tree":"2e12d9aa27a6bb391665d4681807003d624fd8e8",
            "R_sha256":hashlib.sha256(pathlib.Path("r/artifacts/diagnostics/c6-run-bindings.json").read_bytes()).hexdigest(),
            "python":"3.12.14",
            "runtime_manifest":"sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970",
            "preregistration_sha256":hashlib.sha256(pathlib.Path("p/artifacts/diagnostics/c6-preregistration.json").read_bytes()).hexdigest(),
            "all_declared_engineering_checks_passed":True,
          }
          pathlib.Path("export/receipt.json").write_text(json.dumps(receipt,sort_keys=True,separators=(",",":"))+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-v40-ab5-source-validation-${{ github.run_id }}
          path: export/*
          if-no-files-found: warn
          retention-days: 90
