name: C6 v42 Dispatch Ref Rearm

on:
  push:
    branches:
      - codex/c6-v42-seal-receipt

permissions:
  contents: write

concurrency:
  group: c6-v42-s-qualification-dispatch-rearm
  cancel-in-progress: false

jobs:
  rearm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate and atomically recreate the exact dispatch ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          repo = "ychenracing/trade"
          branch = "codex/c6-dispatch/c6-v42-s-qualification/c6.s.qualification/a0"
          target = "653eea8cf8a95763a88b6504c702cdae2f0af204"
          parent = "36d07e82ebac72b5d284ee12a954239e8c591548"
          request_sha256 = "d35d1f58b70105e0b9cfc7ef51e27ef95af4d0f54293a93ca52b443ea1a20ff1"
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  api + path, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(request) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          _, ref = call("GET", f"/git/ref/heads/{branch}")
          assert ref["object"]["type"] == "commit"
          assert ref["object"]["sha"] == target

          _, commit = call("GET", f"/git/commits/{target}")
          assert [item["sha"] for item in commit["parents"]] == [parent]

          _, content = call(
              "GET", f"/contents/.github/c6-dispatch-request.json?ref={target}"
          )
          request_bytes = base64.b64decode(content["content"])
          assert hashlib.sha256(request_bytes).hexdigest() == request_sha256

          status, _ = call("DELETE", f"/git/refs/heads/{branch}")
          assert status == 204
          status, recreated = call(
              "POST", "/git/refs", {"ref": f"refs/heads/{branch}", "sha": target}
          )
          assert status == 201
          assert recreated["object"]["sha"] == target
          print(json.dumps({"branch": branch, "sha": target}, sort_keys=True))
          PY
