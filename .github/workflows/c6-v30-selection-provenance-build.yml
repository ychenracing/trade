name: C6 AB2 Bounded Engineering and Diagnostic
on:
  push:
    branches: [codex/c6-v30-selection-provenance-build]
    paths:
      - .github/scripts/build_c6_v30_selection_provenance.py
      - .github/scripts/ab2_candidate/**
      - .github/workflows/c6-v30-selection-provenance-build.yml
permissions:
  contents: write
concurrency:
  group: c6-v30-selection-provenance-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e0efd3e52b8648c4625716c5311b9e2b680b954
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact runtime and current PR boundary
        run: |
          python -I -S - <<'PY'
          import hashlib,platform,sys,sysconfig
          from pathlib import Path
          assert platform.python_version()=='3.12.14'
          assert platform.machine()=='x86_64' and platform.libc_ver()==('glibc','2.36')
          assert hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest()=='837a48d7afd08447fb43e28b282026fadb59368620072e57e01f66d12977e5ce'
          lib=Path(sysconfig.get_config_var('LIBDIR'))/sysconfig.get_config_var('LDLIBRARY')
          assert hashlib.sha256(lib.read_bytes()).hexdigest()=='57a3c0505572977cba024791b79fb07b787d761438befba3685339c81b5e07e6'
          PY
          test "$(git ls-remote https://github.com/ychenracing/trade.git refs/heads/codex/c6-causal-risk-closure-v11 | cut -f1)" = 4e0efd3e52b8648c4625716c5311b9e2b680b954
      - name: Install unchanged locked dependencies
        run: python -m pip install --require-hashes -r candidate/requirements-lock.txt
      - name: Derive exact preregistered candidate without touching refs
        run: python .github/scripts/build_c6_v30_selection_provenance.py derive
      - name: Run only affected native checks
        working-directory: candidate
        run: |
          git diff --cached --check
          python -m compileall -q quantfusion tests/c6_non_economic/test_account_risk_budget.py
          python -m pytest -q tests/c6_non_economic/test_account_risk_budget.py tests/unit/test_config_profiles.py tests/unit/test_internal_cash_flow_risk_bases.py tests/c6_non_economic/test_c6_retained_winner.py tests/c6_non_economic/test_c6_early_concentration.py tests/contract/test_architecture.py | tee ../ab2-proof/native-tests.txt
          python -m ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quantfusion tests/c6_non_economic/test_account_risk_budget.py
          pyright quantfusion
      - name: Export verified content objects, never update a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_c6_v30_selection_provenance.py publish
      - name: Run registered eight-scenario control comparison only
        run: python .github/scripts/build_c6_v30_selection_provenance.py diagnose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-ab2-bounded-${{ github.run_id }}
          path: ab2-proof/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
