name: Build flow-neutral sleeve HWM fix

on:
  push:
    branches: [codex/flow-neutral-sleeve-hwm]

permissions:
  contents: write

concurrency:
  group: flow-neutral-sleeve-hwm-bootstrap
  cancel-in-progress: false

jobs:
  build-fix:
    if: github.repository == 'ychenracing/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Apply checksum-bound correctness patch
        env:
          PATCH_B64: 
          PATCH_SHA256: 78b26b0996349865a8bb7c773a5a7c3212807e1666557fb16577928cea25e384
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          if hashlib.sha256(patch).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('patch checksum mismatch')
          Path('/tmp/flowfix.patch').write_bytes(patch)
          PY
          test "$(git rev-parse HEAD^)" = "47d9b95645af60dd430eca96afc163726fff8508"
          test "$(git rev-parse HEAD:quantfusion/engine/ensemble_allocation.py)" = "e86f182ddad28e6555d7135985f6810e6115dee3"
          test "$(git rev-parse HEAD:quantfusion/engine/replay.py)" = "116ed730983a5aa1ee5d497853a32805d9577862"
          test "$(git rev-parse HEAD:quantfusion/risk/managers.py)" = "9c52bfdd32f70aef9a4b62810d59c5b1cd2e65dc"
          test "$(git rev-parse HEAD:tests/regression/test_regime_adaptive.py)" = "9f2f796baf00df0c0d50cd4dac343d3a47f40527"
          test ! -e tests/unit/test_internal_cash_flow_risk_bases.py
          git apply --index /tmp/flowfix.patch
          git rm .github/workflows/flow-neutral-sleeve-hwm-bootstrap.yml
      - name: Verify focused correctness surface
        run: |
          python -m compileall -q quantfusion/risk/managers.py quantfusion/engine/ensemble_allocation.py quantfusion/engine/replay.py tests/unit/test_internal_cash_flow_risk_bases.py tests/regression/test_regime_adaptive.py
          python -m ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quantfusion/risk/managers.py quantfusion/engine/ensemble_allocation.py quantfusion/engine/replay.py tests/unit/test_internal_cash_flow_risk_bases.py tests/regression/test_regime_adaptive.py
          python -m pytest -q tests/unit/test_internal_cash_flow_risk_bases.py tests/regression/test_regime_adaptive.py::AdaptiveEngineTests::test_weak_real_execution_matches_frozen_research_point tests/regression/test_regime_adaptive.py::DynamicRouteStateMachineTests tests/contract/test_regime_safety_contracts.py --tb=short
      - name: Publish fix branch
        run: |
          test "$(git status --porcelain | wc -l)" -gt 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(risk): make internal sleeve cash flows drawdown-neutral" -m "Rebase sleeve drawdown/daily-loss capital bases proportionally across non-PnL internal cash transfers. Keep route closing equity consistent so the next-day baseline does not reintroduce the flow. Add deterministic RED/GREEN coverage and refresh only the affected weak-route golden return; MDD and trade counts remain unchanged."
          git push origin HEAD:refs/heads/codex/flow-neutral-sleeve-hwm
