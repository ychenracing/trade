name: Production risk default verification
on:
  push:
    branches: [codex/production-risk-defaults-build]
    paths: [.github/workflows/production-risk-defaults-build.yml]
permissions:
  contents: write
concurrency:
  group: production-risk-defaults-build
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fcedae979b99040f60d457c632ed615c4280b2f8
          fetch-depth: 0
      - name: Correct the one obsolete README paragraph
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/codex/production-risk-defaults | cut -f1)" = fcedae979b99040f60d457c632ed615c4280b2f8
          git switch -c codex/production-risk-defaults
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('README.md');s=p.read_text()
          old='''`C6-Base+AB5` 在连续账户和原生订单队列上增加账户风险预算，必须显式设置
          `account_risk_budget_enabled=True`；普通日扫、真实账户时点建议和未指定该配置的研究命令
          不会自动获得这套连续账户预算。F0/F1/U 正确性修复属于共享生产路径，不等于自动启用 AB5。'''
          new='''`C6-Base+AB5` 在连续账户和原生订单队列上执行账户风险预算，正常回测和日扫默认启用。
          真实账户时点建议默认复用同一预算规划器，使用快照中已声明的账户峰值，不伪造历史账本。
          F0/F1/U 正确性修复与 AB5 预算共同进入默认生产路径；历史关闭预算对照保持明确隔离。'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          assert subprocess.check_output(['git','hash-object','README.md'],text=True).strip()=='44572771f3fefb30952f61f79dcd10f43d10a4e7'
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['README.md']
          PY
      - name: Install unchanged locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify current documentation and default risk controls
        run: |
          python -m pytest -q tests/contract/test_repository_hygiene.py::MarkdownConsistencyTests tests/unit/test_production_risk_defaults.py tests/c6_non_economic/test_account_risk_budget.py
          git diff --check
      - name: Publish verified documentation and record final feature identity
        run: |
          set -euo pipefail
          git add README.md
          git commit -m 'docs: make the default AB5 activation contract consistent'
          git push origin HEAD:refs/heads/codex/production-risk-defaults
          mkdir "$RUNNER_TEMP/default-final"
          git rev-parse HEAD > "$RUNNER_TEMP/default-final/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/default-final/tree.txt"
          git bundle create "$RUNNER_TEMP/default-final/verified.bundle" refs/heads/codex/production-risk-defaults
          git status --short > "$RUNNER_TEMP/default-final/status.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: production-risk-defaults-final-${{ github.run_id }}
          path: ${{ runner.temp }}/default-final/
          retention-days: 90
