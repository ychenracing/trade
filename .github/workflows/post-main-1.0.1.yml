name: Post-main 1.0.1 verification

on:
  push:
    branches: [tmp/research-closure-1.0.1]
    paths:
      - .github/workflows/post-main-1.0.1.yml

permissions:
  contents: write

concurrency:
  group: post-main-1-0-1
  cancel-in-progress: false

env:
  FINAL_SHA: 4eef8ed8bb19ce5883d45cb3a0c41855bc6ef914
  PREVIOUS_RELEASE_SHA: b7be8011d71b477c8ca3942d97830e67d0e0407c

jobs:
  preflight:
    name: Exact-main identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.FINAL_SHA }}
      - name: Verify main and release identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-list -n1 1.0.0)" = "$PREVIOUS_RELEASE_SHA"
          test -z "$(git ls-remote --tags origin refs/tags/1.0.1)"
          python - <<'PY'
          import quantfusion
          from pathlib import Path
          assert quantfusion.__version__ == "1.0.1"
          assert "当前版本：`1.0.1`" in Path("README.md").read_text(encoding="utf-8")
          assert not Path(".github/workflows/actionable-boundary-research.yml").exists()
          assert not Path(".github/workflows/no-waiver-boundary-study.yml").exists()
          assert not Path(".github/workflows/no-waiver-joiner-study.yml").exists()
          assert not Path(".github/workflows/no-waiver-source-snapshot.yml").exists()
          assert not Path(".github/workflows/research-closure-1.0.1.yml").exists()
          assert not Path(".github/workflows/post-main-1.0.1.yml").exists()
          assert not Path("scripts/_apply_research_closure_1_0_1.py").exists()
          assert not Path("scripts/_postprocess_research_closure_1_0_1.py").exists()
          PY

  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-file: requirements-lock-py311.txt
            pytest-args: '-k "not economic_sequences_match_frozen_fingerprints"'
          - python-version: "3.12"
            lock-file: requirements-lock.txt
            pytest-args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.FINAL_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}
      - name: Fetch retained formal artifact source
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          revision = json.loads(Path("artifacts/validation/formal_stress_958_acceptance_summary.json").read_text())["source_revision"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("invalid retained source revision")
          if subprocess.run(["git", "cat-file", "-e", revision + "^{commit}"], capture_output=True).returncode:
              subprocess.run(["git", "fetch", "--no-tags", "origin", revision], check=True)
          PY
      - name: Install locked dependencies
        run: python -m pip install -r ${{ matrix.lock-file }}
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Lint every Python file
        run: ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
      - name: Run complete test suite
        run: python -m pytest -q ${{ matrix.pytest-args }}

  typecheck:
    name: Canonical package typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: pyright quantfusion

  security:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: bandit -r quantfusion scripts -ll
      - run: pip-audit --strict -r requirements-lock.txt

  regression:
    name: Exact backtest regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [preflight, test, typecheck, security]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Verify five frozen universes
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          import math
          from pathlib import Path

          from scripts.backtest_universes import DATA_DIR, NAMES, UNIVERSES
          from quantfusion.engine import BacktestEngine
          from quantfusion.research.fingerprints import economic_sequence_fingerprints
          from tests.regression.test_quant_fusion import regime_route_fingerprint

          baselines = json.loads(
              Path("tests/fixtures/backtest_golden_metrics.json").read_text(encoding="utf-8")
          )
          for name, codes in UNIVERSES.items():
              with contextlib.redirect_stdout(io.StringIO()):
                  result = BacktestEngine(2_000_000).run(
                      {code: NAMES[code] for code in codes},
                      "2025-04-01",
                      "2026-07-20",
                      data_dir=str(DATA_DIR),
                      indicator_state="warm",
                  )
              actual = {
                  "total_return": float(result["total_return"]),
                  "max_drawdown": float(result["max_drawdown"]),
                  "total_trades": int(result["total_trades"]),
                  "sell_trades": int(result["sell_trades"]),
                  "sleeve_fill_count": int(result["sleeve_fill_count"]),
                  "sleeve_sell_fill_count": int(result["sleeve_sell_fill_count"]),
                  "date_symbol_side_count": int(result["date_symbol_side_count"]),
                  "date_symbol_sell_side_count": int(result["date_symbol_sell_side_count"]),
              }
              actual.update(economic_sequence_fingerprints(result))
              actual.pop("regime_state_series_sha256")
              actual["regime_route_sha256"] = regime_route_fingerprint(result)
              expected_item = baselines[str(len(codes))]
              for key, value in actual.items():
                  baseline_value = expected_item[key]
                  if isinstance(value, int):
                      if value != int(baseline_value):
                          raise SystemExit(f"{name} regression on {key}: expected {baseline_value}, got {value}")
                  elif isinstance(value, str):
                      if value != str(baseline_value):
                          raise SystemExit(f"{name} regression on {key}: expected {baseline_value}, got {value}")
                  elif not math.isclose(value, float(baseline_value), rel_tol=1e-9, abs_tol=1e-12):
                      raise SystemExit(f"{name} regression on {key}: expected {baseline_value}, got {value}")
              print(name, actual)
          PY

  release:
    name: Publish 1.0.1
    runs-on: ubuntu-latest
    needs: [regression]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.FINAL_SHA }}
      - name: Verify exact main and publish immutable patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-list -n1 1.0.0)" = "$PREVIOUS_RELEASE_SHA"
          test -z "$(git ls-remote --tags origin refs/tags/1.0.1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a 1.0.1 "$FINAL_SHA" -m 'Quant Fusion 1.0.1'
          git push origin refs/tags/1.0.1
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Quant Fusion 1.0.1

          Maintenance release for research reproducibility and release identity.

          - requires complete source-bound Pool research manifests and per-file SHA-256 verification;
          - records legitimate pre-listing symbols as explicit not-applicable instead of fabricating history;
          - enables independent fixed-index provider fallback only for the research comparison entry point;
          - reports per-member observation coverage separately from the portfolio replay calendar;
          - removes obsolete no-waiver/actionable-boundary research workflows;
          - preserves the production 17-symbol strategy, risk thresholds, transaction costs, frozen goldens, causal execution contract, and canonical economic evidence.

          The existing `1.0.0` tag remains unchanged.
          EOF
          gh release create 1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'Quant Fusion 1.0.1' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
