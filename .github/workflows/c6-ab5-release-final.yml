name: C6 AB5 derived final acceptance
on:
  push:
    branches: [codex/c6-ab5-release-build-20260912]
    paths: [.github/workflows/c6-ab5-release-final.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: c6-ab5-derived-final-1bfa85dbce79
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  derive:
    runs-on: ubuntu-latest
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    timeout-minutes: 30
    env:
      DELIVERY_HEAD: 1bfa85dbce792daf947d44d980a4f6073efb5c51
      ECONOMIC_SOURCE: 56e5743ff8999540f07270ca0ddd0b5c664d8033
      SOURCE_RUN_ID: '34638696991'
      SOURCE_ARTIFACT_ID: '10284452515'
      SOURCE_ARTIFACT_SHA256: 4aa197fe25e627cb8f3877e0c6e3c61ef5fd4067ad2ddcd27ae7ad1f1e23f5a3
      RAW_PAYLOAD_SHA256: 314cd7401948f700e630d4536e567f5e1f88b1b915130d130018691abdb1ab7e
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1bfa85dbce792daf947d44d980a4f6073efb5c51
          fetch-depth: 0
      - name: Authenticate owner authority, PR head and unchanged economic source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$DELIVERY_HEAD"
          python - <<'PY'
          import json, os, subprocess, urllib.request
          base='https://api.github.com/repos/ychenracing/trade/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as response:
                  return json.load(response)
          pr=get('pulls/63')
          assert pr['state']=='open' and not pr['merged'] and pr['head']['sha']==os.environ['DELIVERY_HEAD']
          heartbeat=get('issues/comments/5579901968')['body']
          assert 'C6_AB5_RANDOM_P90_185_EXCEPTION_20260912' in heartbeat
          assert 'P90=185 is acceptable' in heartbeat
          changed=subprocess.check_output([
              'git','diff','--name-only',os.environ['ECONOMIC_SOURCE'],os.environ['DELIVERY_HEAD'],'--','quantfusion'
          ],text=True).splitlines()
          assert set(changed) <= {'quantfusion/application/c6_release_acceptance.py'}, changed
          print(json.dumps({'delivery_head':os.environ['DELIVERY_HEAD'],'economic_source':os.environ['ECONOMIC_SOURCE'],
                            'quantfusion_changes_since_economic_source':changed},sort_keys=True))
          PY
      - name: Download and authenticate the already executed official17 and 958 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab5-derived"
          python - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.error, urllib.request, zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ab5-derived'
          api=f"https://api.github.com/repos/ychenracing/trade/actions/artifacts/{os.environ['SOURCE_ARTIFACT_ID']}/zip"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          req=urllib.request.Request(api,headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=60) as response: raw_zip=response.read()
          except urllib.error.HTTPError as error:
              if error.code!=302: raise
              location=error.headers['Location']; assert location.startswith('https://')
              with urllib.request.urlopen(location,timeout=180) as response: raw_zip=response.read()
          assert hashlib.sha256(raw_zip).hexdigest()==os.environ['SOURCE_ARTIFACT_SHA256']
          with zipfile.ZipFile(io.BytesIO(raw_zip)) as archive:
              raw_name=f"native-validation/candidates/stress-{os.environ['ECONOMIC_SOURCE']}-rejected.json"
              raw_payload=archive.read(raw_name)
              authority=json.loads(archive.read('authority.json'))
              l2_receipt=json.loads(archive.read('l2-receipt.json'))
          assert hashlib.sha256(raw_payload).hexdigest()==os.environ['RAW_PAYLOAD_SHA256']
          assert str(authority['workflow_run_id'])==os.environ['SOURCE_RUN_ID']
          assert authority['source_revision']==os.environ['ECONOMIC_SOURCE']
          assert authority['base_reruns']==authority['L2_reruns']==0 and authority['official_expected']==958
          assert l2_receipt['l2_scenario_count']==77
          (out/'native-rejected.json').write_bytes(raw_payload)
          (out/'source-authority.json').write_text(json.dumps(authority,sort_keys=True,indent=2)+'\n')
          (out/'source-l2-receipt.json').write_text(json.dumps(l2_receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Install exact existing locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Derive source-bound acceptance with zero economic replay
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          from quantfusion.application.c6_contract import canonical_payload_hash
          from quantfusion.application.c6_release_acceptance import (
              ACCEPTANCE_REVISION, release_formal_assessment, validate_published_release_assessment,
          )
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ab5-derived'
          raw_bytes=(out/'native-rejected.json').read_bytes()
          assert hashlib.sha256(raw_bytes).hexdigest()==os.environ['RAW_PAYLOAD_SHA256']
          raw=json.loads(raw_bytes)
          assert raw['source_revision']==os.environ['ECONOMIC_SOURCE']
          assert raw['candidate_id']=='C6-Base+AB5'
          assert raw['acceptance_status']=='rejected' and raw['canonical'] is False
          assert len(raw['results'])==958
          prefix=[row for row in raw['results'] if row['scenario_type']=='prefix']
          assert len(prefix)==17
          old_release=raw['release_acceptance']
          native={key:value for key,value in raw.items() if key not in {
              'release_acceptance','artifact_status','acceptance_status','canonical','baseline_kind',
              'rejection_reasons','original_rejection_reasons'
          }}
          assessment=release_formal_assessment(native)
          assert ACCEPTANCE_REVISION=='C6_AB5_P90_185_EXCEPTION_20260912'
          assert assessment['passed'] is True
          p90=next(row for row in assessment['predicate_results']
                   if row['predicate_id']=='random_p90_date_symbol_side_buckets_at_most_160')
          assert p90['observed_value']==185.0
          assert p90['release_threshold']=={'comparator':'<=','value':185.0,'tolerance':0.0}
          assert p90['exception_applied']=='AB5_KNOWN_RANDOM_P90_185_ENVELOPE'
          assert sum(row['exception_applied'] is not None for row in assessment['predicate_results'])==5
          published={**native,
              'release_acceptance':{
                  'assessment':assessment,
                  'source_binding':old_release['source_binding'],
                  'L2':old_release['L2'],
                  'derivation':{
                      'kind':'c6_ab5_official958_reassessment',
                      'assessment_execution_revision':os.environ['DELIVERY_HEAD'],
                      'economic_source_revision':os.environ['ECONOMIC_SOURCE'],
                      'source_workflow_run_id':int(os.environ['SOURCE_RUN_ID']),
                      'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
                      'source_artifact_sha256':os.environ['SOURCE_ARTIFACT_SHA256'],
                      'source_rejected_payload_sha256':os.environ['RAW_PAYLOAD_SHA256'],
                      'base_reruns':0,'L2_reruns':0,'official_reruns':0,'economic_replays':0,
                  },
              },
              'acceptance_status':'accepted','canonical':True,
              'baseline_kind':'initial_current_contract'}
          validate_published_release_assessment(published)
          body={
              'schema_version':1,'kind':'c6_ab5_derived_formal_acceptance',
              'acceptance_status':'accepted','canonical':True,
              'candidate_id':'C6-Base+AB5','assessment_execution_revision':os.environ['DELIVERY_HEAD'],
              'economic_source_revision':os.environ['ECONOMIC_SOURCE'],
              'source_workflow_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_sha256':os.environ['SOURCE_ARTIFACT_SHA256'],
              'source_rejected_payload_sha256':os.environ['RAW_PAYLOAD_SHA256'],
              'official_scenario_count':958,'prefix_count':17,'L2_scenario_count':77,
              'release_assessment_id':assessment['assessment_id'],
              'accepted_exception':'AB5_KNOWN_RANDOM_P90_185_ENVELOPE',
              'accepted_random_p90_buckets':185.0,
              'base_reruns':0,'L2_reruns':0,'official_reruns':0,'economic_replays':0,
              'published_payload_sha256':canonical_payload_hash(published),
              'prefix_results_sha256':canonical_payload_hash(prefix),
          }
          receipt={**body,'receipt_id':canonical_payload_hash(body)}
          (out/'accepted-universe-derived.json').write_text(json.dumps(published,sort_keys=True,separators=(',',':'))+'\n')
          (out/'final-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve derived acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: c6-ab5-derived-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ab5-derived/
          if-no-files-found: error
          retention-days: 90
