name: C6 Non-economic Performance Validation

on:
  push:
    branches: [codex/c6-performance-batch-20260907]

permissions:
  contents: read

concurrency:
  group: c6-performance-batch-20260907
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ychenracing/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b44486a05432e41f0c187902388249c294fa69c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install existing locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify two-path patch without a write token
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, json, os, subprocess, sys, urllib.request
          from pathlib import Path
          base = "1b44486a05432e41f0c187902388249c294fa69c"
          expected_tree = "9402871847ee24202258a18a634ce225725640bb"
          paths = ["quantfusion/application/c6_bound_run.py", "tests/c6_non_economic/test_c6_recovery_boundaries.py"]
          proof = Path(os.environ["RUNNER_TEMP"]) / "c6-performance-proof"
          proof.mkdir()
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          assert command("git", "rev-parse", "HEAD") == base
          assert command("git", "status", "--porcelain") == ""
          patch = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(patch).hexdigest() == "841c5390e682119ea407dec45e458bc709bf7ac1e8fd7567584e91c26f60fe8a"
          (proof / "performance.patch").write_bytes(patch)
          subprocess.run(["git", "apply", "--check", str(proof / "performance.patch")], check=True)
          subprocess.run(["git", "apply", str(proof / "performance.patch")], check=True)
          assert sorted(command("git", "diff", "--name-only").splitlines()) == sorted(paths)
          subprocess.run([sys.executable, "-m", "compileall", "-q", *paths], check=True)
          subprocess.run(["ruff", "check", "--select=E,F,W", "--ignore=E501,E402,E731,E741", *paths], check=True)
          with (proof / "tests.txt").open("w") as output:
              test = subprocess.run([sys.executable, "-m", "pytest", "-q", "tests/c6_non_economic/test_c6_recovery_boundaries.py", "tests/c6_non_economic/test_c6_bound_run.py", "--tb=short"], stdout=output, stderr=subprocess.STDOUT)
          print((proof / "tests.txt").read_text(), flush=True)
          if test.returncode:
              raise SystemExit(test.returncode)
          subprocess.run(["git", "add", "--", *paths], check=True)
          assert command("git", "write-tree") == expected_tree
          subprocess.run(["git", "archive", "--format=tar.gz", "-o", str(proof / "validated-source.tar.gz"), expected_tree], check=True)
          PYCODE
      - name: Publish immutable Git objects only after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, subprocess, sys, urllib.request
          from pathlib import Path
          base = "1b44486a05432e41f0c187902388249c294fa69c"
          expected_tree = "9402871847ee24202258a18a634ce225725640bb"
          paths = ["quantfusion/application/c6_bound_run.py", "tests/c6_non_economic/test_c6_recovery_boundaries.py"]
          proof = Path(os.environ["RUNNER_TEMP"]) / "c6-performance-proof"
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          assert command("git", "rev-parse", "HEAD") == base
          assert command("git", "write-tree") == expected_tree
          patch = (proof / "performance.patch").read_bytes()
          api = "https://api.github.com/repos/ychenracing/trade/"

          def request(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=body, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          # No ref update, dispatch, cancellation, default-branch write or settings change.
          head = request("git/ref/heads/codex/c6-causal-risk-closure-v11")["object"]["sha"]
          assert head == base, "PR changed during verification; do not publish over newer work"
          entries = []
          for path in paths:
              raw = Path(path).read_bytes()
              oid = request("git/blobs", {"content": base64.b64encode(raw).decode(), "encoding": "base64"})["sha"]
              assert oid == command("git", "hash-object", path)
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": oid})
          tree = request("git/trees", {"base_tree": "4d02c6bc640940df3b08d0b9cdca3fbb10baba67", "tree": entries})["sha"]
          assert tree == expected_tree
          message = "perf(c6): reuse verified checkpoint records and avoid redundant IO\n\nContinue PR63 from 1b44486. Scope: bound runner and its non-economic tests only.\nSchema/formula reuse is local to one restore under one immutable P; every\nrecord hash, wrapper, source/R/workflow identity and prefix check remains.\nNew or modified records are fully validated; failed validation is not cached.\nAvoid a second complete decode for progress IDs and unchanged map saves.\n\nVerified: affected boundary/runner modules on Python 3.12.14, compile and Ruff.\nNo economic replay, frozen-ref move, active-attempt change or deployment.\nCurrent v19 remains on frozen I_B; explicit lawful re-binding/reuse is pending.\n"
          commit = request("git/commits", {"message": message, "tree": tree, "parents": [base]})
          receipt = {"kind": "c6_non_economic_performance_candidate", "base": base, "commit": commit["sha"], "tree": tree, "parent": commit["parents"][0]["sha"], "changed_paths": paths, "patch_sha256": hashlib.sha256(patch).hexdigest(), "python": sys.version, "image_os": os.environ.get("ImageOS"), "image_version": os.environ.get("ImageVersion"), "workflow_run_id": os.environ["GITHUB_RUN_ID"], "workflow_sha": os.environ["GITHUB_SHA"], "tests_exit_code": 0, "branch_updated": False, "economic_runs_started": 0, "v19_deployed": False}
          assert receipt["parent"] == base
          (proof / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c6-performance-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/c6-performance-proof
          if-no-files-found: error
          retention-days: 90
