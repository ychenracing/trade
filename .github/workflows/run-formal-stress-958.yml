name: Run exact 958-scenario formal acceptance

on:
  push:
    branches:
      - codex/formal-stress-958-acceptance
    paths:
      - .github/workflows/run-formal-stress-958.yml

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-stress-958-acceptance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Verify remote bootstrap checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/task-bootstrap/formal-stress-958-acceptance.md
          grep -q "Verified baseline SHA:" .github/task-bootstrap/formal-stress-958-acceptance.md
          git fetch origin main
          echo "branch_head=$(git rev-parse HEAD)"
          echo "main_head=$(git rev-parse origin/main)"

      - name: Align current 17-symbol and 958-scenario contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from pathlib import Path

          from quantfusion.application import stress_scenarios
          from quantfusion.config import daily
          from quantfusion.config.universe import SYMBOL_NAMES

          expected_symbols = (
              "300308", "300502", "300394", "688256", "603986",
              "688072", "688300", "300054", "688361", "002409",
              "688498", "688120", "002384", "688082", "300604",
              "601869", "300408",
          )
          assert tuple(SYMBOL_NAMES) == expected_symbols, tuple(SYMBOL_NAMES)
          assert tuple(daily.SYMBOLS) == expected_symbols, tuple(daily.SYMBOLS)

          scenarios = stress_scenarios._multi_seed_scenarios(
              random_samples=stress_scenarios.DEFAULT_RANDOM_SAMPLES,
              permutation_samples=stress_scenarios.DEFAULT_PERMUTATION_SAMPLES,
              seeds=stress_scenarios.DEFAULT_SEEDS,
          )
          counts = Counter(str(item["scenario_type"]) for item in scenarios)
          expected_counts = {
              "prefix": 17,
              "leave_one_out": 17,
              "add_one": 24,
              "random_subset": 750,
              "permutation": 150,
          }
          assert len(scenarios) == 958, len(scenarios)
          assert counts == expected_counts, counts
          ids = [str(item["scenario_id"]) for item in scenarios]
          assert len(ids) == len(set(ids)) == 958

          replacements = {
              "共 983 次生产逐日回放": "共 958 次生产逐日回放",
              "全部 983 个正式场景": "全部 958 个正式场景",
              "当前完整 983 场景运行已保存为非 canonical 候选": (
                  "历史 22 股完整 983 场景运行已保存为非 canonical 候选"
              ),
              "当前完整983场景运行已保存为非 canonical 候选": (
                  "历史22股完整983场景运行已保存为非 canonical 候选"
              ),
              "当前完整 983 场景": "历史 22 股完整 983 场景",
              "当前983场景": "历史22股983场景",
          }
          for filename in ("README.md", "docs/VALIDATION.md", "docs/ARCHITECTURE.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          blocks = {
              "README.md": """
          <!-- CURRENT_FORMAL_STRESS_PLAN:START -->
          ### 当前 17 股 formal stress 计划

          日扫与 formal stress 共用 `quantfusion.config.universe.SYMBOL_NAMES` 的同一有序 17 股股票池。当前正式计划固定为 958 个生产逐日回放场景：17 个 prefix、17 个 leave-one-out、24 个 add-one、750 个 deterministic random-subset、150 个 permutation。场景顺序、三个固定 seed、冻结行情、费用、滑点、容量、T+1 和撮合语义均属于 provenance；任一变化都会形成新的 scenario/run fingerprint。

          压力合同 v2 对当前完整计划执行全部 absolute hard gates、retained robustness hard gates、promotion/initial-baseline gates。历史 22 股/983 场景 rejected 工件仅作为不可变历史证据，不能代表当前 17 股/958 计划，也不能被覆盖或重新标记为 canonical。
          <!-- CURRENT_FORMAL_STRESS_RESULT:START -->
          完整 958 场景尚未在本次任务中形成最终工件。
          <!-- CURRENT_FORMAL_STRESS_RESULT:END -->
          <!-- CURRENT_FORMAL_STRESS_PLAN:END -->
          """,
              "docs/VALIDATION.md": """
          <!-- CURRENT_FORMAL_STRESS_PLAN:START -->
          ## 当前 17 股 / 958 场景 formal stress

          当前 formal plan 从唯一有序 17 股股票池确定性生成：17 个 prefix、17 个 leave-one-out、24 个 add-one、750 个 random-subset（3 个固定 seed × 5 个规模 × 每规模 50 个）和 150 个 permutation（3 个固定 seed × 50 个），合计 958。完整运行必须具有 958 个唯一 scenario ID、有限指标、`ProductionReplayEngine` / `production_daily_replay` 语义以及相互独立的 source、data、scenario 和 run fingerprints。

          历史 22 股/983 场景工件保持原字节与原哈希，只用于审计历史合同。它不构成当前计划的 incumbent、current candidate 或 canonical 证据。
          <!-- CURRENT_FORMAL_STRESS_RESULT:START -->
          本次完整 958 场景结果待正式运行后写入。
          <!-- CURRENT_FORMAL_STRESS_RESULT:END -->
          <!-- CURRENT_FORMAL_STRESS_PLAN:END -->
          """,
              "docs/ARCHITECTURE.md": """
          <!-- CURRENT_FORMAL_STRESS_PLAN:START -->
          ## Formal stress 的当前边界

          日扫与 formal stress 读取同一个有序 17 股权威映射。场景生成器在该顺序上构造 958 个完整场景；诊断 selector、单场景、family 或 shard 运行永远不是 formal plan，不能发布 canonical 工件。正式发布同时校验计划完整性、scenario ID 唯一性、生产回放语义、provenance、absolute hard gates、retained robustness gates 和 promotion/initial-baseline 状态。

          历史 22 股/983 工件属于不同 scenario/data/run fingerprint，不会自动迁移到当前计划。
          <!-- CURRENT_FORMAL_STRESS_RESULT:START -->
          当前 958 场景的实际发布状态待本次完整运行写入。
          <!-- CURRENT_FORMAL_STRESS_RESULT:END -->
          <!-- CURRENT_FORMAL_STRESS_PLAN:END -->
          """,
          }

          def upsert_block(path: Path, block: str) -> None:
              text = path.read_text(encoding="utf-8")
              start = "<!-- CURRENT_FORMAL_STRESS_PLAN:START -->"
              end = "<!-- CURRENT_FORMAL_STRESS_PLAN:END -->"
              normalized = block.strip() + "\n"
              if start in text or end in text:
                  if text.count(start) != 1 or text.count(end) != 1:
                      raise RuntimeError(f"malformed managed block in {path}")
                  left, rest = text.split(start, 1)
                  _, right = rest.split(end, 1)
                  text = left.rstrip() + "\n\n" + normalized + right.lstrip("\n")
              else:
                  text = text.rstrip() + "\n\n" + normalized
              path.write_text(text, encoding="utf-8")

          for filename, block in blocks.items():
              upsert_block(Path(filename), block)

          test_path = Path("tests/unit/test_current_formal_stress_plan.py")
          test_path.write_text(
              '''"""Current 17-symbol / 958-scenario formal stress contract."""\n\n'
              'from collections import Counter\n\n'
              'from quantfusion.application import stress_scenarios\n'
              'from quantfusion.config import daily\n'
              'from quantfusion.config.universe import SYMBOL_NAMES\n\n\n'
              'EXPECTED_SYMBOLS = (\n'
              '    "300308", "300502", "300394", "688256", "603986",\n'
              '    "688072", "688300", "300054", "688361", "002409",\n'
              '    "688498", "688120", "002384", "688082", "300604",\n'
              '    "601869", "300408",\n'
              ')\n\n\n'
              'def test_daily_and_formal_stress_share_current_ordered_universe() -> None:\n'
              '    assert tuple(SYMBOL_NAMES) == EXPECTED_SYMBOLS\n'
              '    assert tuple(daily.SYMBOLS) == EXPECTED_SYMBOLS\n\n\n'
              'def test_current_formal_plan_has_exact_958_family_counts() -> None:\n'
              '    scenarios = stress_scenarios._multi_seed_scenarios(\n'
              '        random_samples=stress_scenarios.DEFAULT_RANDOM_SAMPLES,\n'
              '        permutation_samples=stress_scenarios.DEFAULT_PERMUTATION_SAMPLES,\n'
              '        seeds=stress_scenarios.DEFAULT_SEEDS,\n'
              '    )\n'
              '    assert len(scenarios) == 958\n'
              '    assert len({item["scenario_id"] for item in scenarios}) == 958\n'
              '    assert Counter(item["scenario_type"] for item in scenarios) == {\n'
              '        "prefix": 17,\n'
              '        "leave_one_out": 17,\n'
              '        "add_one": 24,\n'
              '        "random_subset": 750,\n'
              '        "permutation": 150,\n'
              '    }\n',
              encoding="utf-8",
          )
          PY

      - name: Verify and commit stable pre-run source
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/unit/test_current_formal_stress_plan.py \
            tests/unit/test_stress_sampling_capacity.py \
            tests/unit/test_stress_scenarios.py
          python -m compileall -q quantfusion tests/unit/test_current_formal_stress_plan.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quantfusion tests/unit/test_current_formal_stress_plan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/VALIDATION.md docs/ARCHITECTURE.md \
            tests/unit/test_current_formal_stress_plan.py
          if ! git diff --cached --quiet; then
            git commit -m "docs: align current formal stress plan to 958 scenarios"
            git push origin HEAD:codex/formal-stress-958-acceptance
          fi
          git rev-parse HEAD > /tmp/formal_source_sha
          echo "formal_source_sha=$(cat /tmp/formal_source_sha)"

      - name: Snapshot immutable prior candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/validation/candidates")
          payload = {
              str(path): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.glob("*.json"))
          } if root.is_dir() else {}
          Path("/tmp/prior_candidate_hashes.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Run exact complete 958-scenario formal plan once
        id: stress
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/formal_source_sha)"
          checkpoint="${RUNNER_TEMP}/formal-stress-958-${source_sha}.json"
          log="${RUNNER_TEMP}/formal-stress-958.log"
          set +e
          python -m quantfusion.application.stress \
            --workers 4 \
            --checkpoint "$checkpoint" \
            --checkpoint-every 10 \
            --source-revision "$source_sha" \
            >"$log" 2>&1
          status=$?
          set -e
          tail -n 250 "$log"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            echo "Unexpected formal stress exit status: $status" >&2
            exit "$status"
          fi
          echo "formal_exit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate evidence and synchronize result documentation
        shell: bash
        env:
          FORMAL_EXIT_STATUS: ${{ steps.stress.outputs.formal_exit_status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from datetime import datetime, timezone
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          source_sha = Path("/tmp/formal_source_sha").read_text(encoding="utf-8").strip()
          prior = json.loads(
              Path("/tmp/prior_candidate_hashes.json").read_text(encoding="utf-8")
          )
          for filename, digest in prior.items():
              path = Path(filename)
              if not path.is_file():
                  raise RuntimeError(f"prior candidate disappeared: {filename}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise RuntimeError(f"prior candidate changed: {filename}")

          candidates: list[tuple[Path, dict]] = []
          root = Path("artifacts/validation/candidates")
          for path in sorted(root.glob("*.json")):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if (
                  payload.get("source_revision") == source_sha
                  and payload.get("scenario_count") == 958
                  and isinstance(payload.get("results"), list)
              ):
                  candidates.append((path, payload))
          if len(candidates) != 1:
              raise RuntimeError(
                  f"expected exactly one current 958 candidate, found {len(candidates)}"
              )
          candidate_path, payload = candidates[0]
          results = payload["results"]
          ids = [str(item["scenario_id"]) for item in results]
          if len(results) != 958 or len(set(ids)) != 958:
              raise RuntimeError("formal evidence is not exact 958/958 unique completion")
          counts = Counter(str(item["scenario_type"]) for item in results)
          expected_counts = Counter(
              prefix=17,
              leave_one_out=17,
              add_one=24,
              random_subset=750,
              permutation=150,
          )
          if counts != expected_counts:
              raise RuntimeError(f"unexpected family counts: {counts}")
          for item in results:
              if item.get("deployment_policy") != "production_daily_replay":
                  raise RuntimeError(
                      f"non-production replay result: {item.get('scenario_id')}"
                  )
              for key in ("total_return", "max_drawdown", "sharpe", "calmar"):
                  value = item.get(key)
                  if not isinstance(value, (int, float)) or not math.isfinite(float(value)):
                      raise RuntimeError(
                          f"non-finite {key} in {item.get('scenario_id')}: {value!r}"
                      )
          for key in (
              "source_fingerprint",
              "data_fingerprint",
              "scenario_signature",
              "run_signature",
          ):
              if not isinstance(payload.get(key), str) or len(payload[key]) < 32:
                  raise RuntimeError(f"missing/invalid provenance field: {key}")

          candidate_sha = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          worst = min(results, key=lambda item: float(item["max_drawdown"]))
          random_results = [
              item for item in results if item["scenario_type"] == "random_subset"
          ]
          random_worst = min(
              random_results, key=lambda item: float(item["max_drawdown"])
          )
          add_one = [item for item in results if item["scenario_type"] == "add_one"]
          add_one_worst_drawdown = min(
              add_one, key=lambda item: float(item["max_drawdown"])
          )
          prefix17 = next(
              item
              for item in results
              if item["scenario_type"] == "prefix" and item["symbol_count"] == 17
          )
          hard = payload.get("absolute_hard_gates", {})
          retained = payload.get("retained_robustness_hard_gates", {})
          promotion = payload.get("promotion_gates", {})
          initial = payload.get("initial_baseline_gates", {})
          acceptance_status = str(payload.get("acceptance_status", "unknown"))
          canonical = bool(payload.get("canonical", False))
          artifact_status = str(payload.get("artifact_status", "unknown"))

          summary = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "formal_exit_status": int(os.environ["FORMAL_EXIT_STATUS"]),
              "source_revision": source_sha,
              "candidate_path": str(candidate_path),
              "candidate_sha256": candidate_sha,
              "scenario_count": 958,
              "unique_scenario_ids": 958,
              "family_counts": dict(sorted(counts.items())),
              "artifact_status": artifact_status,
              "acceptance_status": acceptance_status,
              "canonical": canonical,
              "absolute_hard_gates": hard,
              "retained_robustness_hard_gates": retained,
              "promotion_gates": promotion,
              "initial_baseline_gates": initial,
              "provenance": {
                  key: payload[key]
                  for key in (
                      "source_fingerprint",
                      "data_fingerprint",
                      "scenario_signature",
                      "run_signature",
                  )
              },
              "worst_all": {
                  "scenario_id": worst["scenario_id"],
                  "max_drawdown": float(worst["max_drawdown"]),
                  "total_return": float(worst["total_return"]),
              },
              "worst_random_subset": {
                  "scenario_id": random_worst["scenario_id"],
                  "max_drawdown": float(random_worst["max_drawdown"]),
                  "total_return": float(random_worst["total_return"]),
              },
              "worst_add_one_drawdown": {
                  "scenario_id": add_one_worst_drawdown["scenario_id"],
                  "max_drawdown": float(add_one_worst_drawdown["max_drawdown"]),
                  "total_return": float(add_one_worst_drawdown["total_return"]),
              },
              "prefix_17": {
                  key: prefix17[key]
                  for key in (
                      "scenario_id",
                      "total_return",
                      "max_drawdown",
                      "sharpe",
                      "calmar",
                      "total_trades",
                  )
              },
              "historical_candidate_hashes_verified_unchanged": prior,
          }
          summary_path = Path(
              "artifacts/validation/formal_stress_958_acceptance_summary.json"
          )
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_path.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          hard_passed = hard.get("passed")
          retained_passed = retained.get("passed")
          result_block = f"""<!-- CURRENT_FORMAL_STRESS_RESULT:START -->
          完整计划已运行：`958/958`，唯一 scenario ID：`958`。工件状态为 `{artifact_status}`，acceptance 为 `{acceptance_status}`，canonical 为 `{str(canonical).lower()}`；absolute hard gates passed=`{hard_passed}`，retained robustness gates passed=`{retained_passed}`。全场景最差最大回撤为 `{float(worst['max_drawdown']):.6%}`（`{worst['scenario_id']}`），17 股完整 prefix 的总收益为 `{float(prefix17['total_return']):.6%}`、最大回撤为 `{float(prefix17['max_drawdown']):.6%}`。当前候选：`{candidate_path}`，SHA-256：`{candidate_sha}`；source revision：`{source_sha}`。详细 gates 与 provenance 见 `artifacts/validation/formal_stress_958_acceptance_summary.json`。
          <!-- CURRENT_FORMAL_STRESS_RESULT:END -->"""

          for filename in ("README.md", "docs/VALIDATION.md", "docs/ARCHITECTURE.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              start = "<!-- CURRENT_FORMAL_STRESS_RESULT:START -->"
              end = "<!-- CURRENT_FORMAL_STRESS_RESULT:END -->"
              if text.count(start) != 1 or text.count(end) != 1:
                  raise RuntimeError(f"missing/malformed result block in {filename}")
              left, rest = text.split(start, 1)
              _, right = rest.split(end, 1)
              path.write_text(
                  left + result_block + right,
                  encoding="utf-8",
              )

          current_stale_patterns = (
              "共 983 次生产逐日回放",
              "全部 983 个正式场景",
              "当前完整 983 场景",
              "当前983场景",
          )
          for filename in ("README.md", "docs/VALIDATION.md", "docs/ARCHITECTURE.md"):
              text = Path(filename).read_text(encoding="utf-8")
              stale = [pattern for pattern in current_stale_patterns if pattern in text]
              if stale:
                  raise RuntimeError(f"stale current-plan wording in {filename}: {stale}")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Run complete engineering verification
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/formal_source_sha)"
          if ! git diff --quiet "$source_sha" -- '*.py'; then
            echo "Python source changed after the provenance source revision" >&2
            git diff -- "$source_sha" -- '*.py'
            exit 1
          fi
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          pyright quantfusion
          bandit -r quantfusion scripts -ll
          pip-audit --strict -r requirements-lock.txt
          git diff --check

      - name: Commit complete 958 evidence and remove bootstrap infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/run-formal-stress-958.yml \
            .github/workflows/bootstrap-formal-stress-958.yml \
            .github/task-bootstrap/formal-stress-958-acceptance.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: record exact 958-scenario formal acceptance"
          git push origin HEAD:codex/formal-stress-958-acceptance
