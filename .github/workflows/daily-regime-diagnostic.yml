name: Daily regime snapshot diagnostic

on:
  push:
    branches: [fix/daily-scan-regime-snapshot-20260913]
    paths:
      - .github/workflows/daily-regime-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf99003c95e02de3407a342ec174795c3b356f9e
          fetch-depth: 0
      - name: Export exact source for offline native verification
        run: |
          mkdir -p .audit-export
          git bundle create .audit-export/trade.bundle HEAD
          git rev-parse HEAD > .audit-export/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-audit-source-bf99003
          path: .audit-export/
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify existing snapshot fix and affected boundaries
        run: python -m pytest -q tests/integration tests/unit/test_unified_universe.py tests/unit/test_default_account_budget.py tests/contract/test_fail_closed_boundaries.py
