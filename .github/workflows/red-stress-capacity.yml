name: Stress sampling capacity RED contract

on:
  push:
    branches:
      - codex/unify-17-symbol-universe
    paths:
      - .github/workflows/red-stress-capacity.yml

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-17-symbol-universe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q tests/unit/test_stress_sampling_capacity.py
