name: Apply research runtime boundary

on:
  push:
    branches: [agent/architecture-consistency-refactor]
    paths:
      - .github/workflows/apply-research-runtime-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-consistency-refactor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed runtime-boundary migration
        run: python .github/scripts/apply_research_runtime_boundary.py
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify architecture and research boundaries
        run: |
          python -m compileall -q quantfusion tests
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quantfusion tests
          pyright quantfusion
          python -m pytest -q \
            tests/contract/test_architecture_consistency_refactor.py \
            tests/c6_non_economic/test_c6_formal_ab5.py \
            tests/c6_non_economic/test_c6_diagnostics.py \
            tests/c6_non_economic/test_c6_retained_winner.py \
            tests/c6_non_economic/test_c6_fixed_reference_admission.py \
            tests/c6_non_economic/test_account_risk_budget.py \
            tests/unit/test_default_account_budget.py
      - name: Remove migration helpers
        run: rm .github/scripts/apply_research_runtime_boundary.py .github/workflows/apply-research-runtime-boundary.yml
      - name: Save runtime boundary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: isolate research runtime policy'
          git push origin HEAD:agent/architecture-consistency-refactor
