name: Release audit
on:
  push:
    branches: [maintenance/current-release]
    paths: [.github/workflows/release-audit.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize reviewed source
        run: |
          python - <<'PY'
          import ast, hashlib, json, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected_tree = '07fc46c158027d8b5342ea1a92e0c665d46d7a89'
          last = Path('.github/release-edits-4.json')
          assert hashlib.sha256(last.read_bytes()).hexdigest() == 'cd902a1abff87d70409e04da2e660589379c6b1d83ccce1244a44772839636c0'
          for batch in range(1, 5):
              payload = json.loads(Path(f'.github/release-edits-{batch}.json').read_text())
              for relative, spec in payload.items():
                  path = Path(relative)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not relative.startswith(('data/', 'artifacts/', 'tests/fixtures/'))
                  if spec.get('delete'):
                      path.unlink()
                  elif 'content' in spec:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(spec['content'], encoding='utf-8')
                  else:
                      text = path.read_text(encoding='utf-8')
                      assert hashlib.sha256(text.encode()).hexdigest() == spec['sha256'], relative
                      end = len(text)
                      for start, stop, value in reversed(spec['edits']):
                          assert 0 <= start <= stop <= end, relative
                          text = text[:start] + value + text[stop:]
                          end = start
                      path.write_text(text, encoding='utf-8')
          for path in Path('.github').glob('release-edits-*.json'):
              path.unlink()
          Path('.github/release_payload.1').unlink()
          Path('.github/workflows/release-audit.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          actual_tree = git('write-tree')
          assert actual_tree == expected_tree, (actual_tree, expected_tree)
          assert not git('diff', '--cached', '--name-only', '--', 'data', 'artifacts', 'tests/fixtures', 'requirements*', '.github/workflows/ci.yml', '.github/workflows/c6-bound-economic.yml')
          for path in Path('quantfusion').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'))
          subprocess.run(['git', '-c', 'user.name=ychenracing', '-c', 'user.email=ychenracing@users.noreply.github.com', 'commit', '-m', 'chore: establish current 1.0.0 source and documentation'], check=True)
          Path('/tmp/release-source.json').write_text(json.dumps({'commit':git('rev-parse','HEAD'),'tree':actual_tree,'base':'1ec3c8ef28ace8ed7d88d4e9503fcc66fa299e71','version':'1.0.0'},indent=2)+'\n')
          print(Path('/tmp/release-source.json').read_text())
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/maintenance/current-release'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-receipt
          path: /tmp/release-source.json
          retention-days: 30
