name: Release audit
on:
  push:
    branches: [maintenance/current-release]
    paths: [.github/workflows/release-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain immutable verification sources
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          revs = {json.loads(Path('artifacts/validation/formal_stress_958_acceptance_summary.json').read_text())['source_revision'], '3b4b9c2554b2ac54d065173d3889040a30bc6e89'}
          for revision in revs:
              assert re.fullmatch('[0-9a-f]{40}',revision)
              subprocess.run(['git','fetch','--no-tags','origin',revision], check=True)
              subprocess.run(['git','update-ref','refs/heads/retained/'+revision,revision],check=True)
          subprocess.run(['git','bundle','create','/tmp/trade.git.bundle','--all'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-objects
          path: /tmp/trade.git.bundle
          retention-days: 3
