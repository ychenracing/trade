name: Targeted input validation

on:
  push:
    branches: [codex/targeted-input-diagnostics]

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Exact-source affected validation
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/unit/test_trading_sessions.py tests/integration/test_trading_day_coverage.py
          python -m pytest -q tests/unit/test_decision_diagnostics.py
