name: Targeted source export

on:
  push:
    branches: [codex/targeted-decision-inputs]
    paths: [.github/workflows/targeted-source-export.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing locked validation environment
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Export tracked source and Python installation without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/targeted-export"
          git bundle create "$RUNNER_TEMP/targeted-export/trade.bundle" --all
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tarfile
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'targeted-export'
          with tarfile.open(out / 'python312.tar.gz', 'w:gz') as archive:
              archive.add(sys.base_prefix, arcname='python312')
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          receipt = {
              'source_revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'python': sys.version,
              'requirements_sha256': hashlib.sha256(Path('requirements-lock.txt').read_bytes()).hexdigest(),
              'files_sha256': files,
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-source-and-runtime
          path: ${{ runner.temp }}/targeted-export
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
