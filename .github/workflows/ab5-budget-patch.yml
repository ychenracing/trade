name: Apply AB5 budget patch

on:
  push:
    branches:
      - agent/ab5-recovery-cleanup-20260917
    paths:
      - .github/workflows/ab5-budget-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ab5-recovery-cleanup-20260917
          fetch-depth: 0
      - name: Apply narrow account-budget patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('quantfusion/risk/account_budget.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "    crowded_shock_reduced_book_ids: set[tuple[int, str, str]] | None = None,\n) -> tuple[dict[str, Any], list[RiskAction]]:\n",
                  "    crowded_shock_reduced_book_ids: set[tuple[int, str, str]] | None = None,\n    gross_cap_ceiling: float | None = None,\n) -> tuple[dict[str, Any], list[RiskAction]]:\n",
              ),
              (
                  "    receipt['gross_cap'] = min(\n        receipt['ordinary_gross_cap'],\n        receipt['remaining_loss_budget']\n        / systemic_stress_fraction,\n    )\n    cap = receipt[\"gross_cap\"]\n",
                  "    receipt['gross_cap'] = min(\n        receipt['ordinary_gross_cap'],\n        receipt['remaining_loss_budget']\n        / systemic_stress_fraction,\n    )\n    if gross_cap_ceiling is not None:\n        ceiling = require_finite(\n            'AB5 recovery gross cap ceiling', gross_cap_ceiling, min_value=0.\n        )\n        receipt['canonical_gross_cap'] = receipt['gross_cap']\n        receipt['recovery_gross_cap_ceiling'] = ceiling\n        receipt['gross_cap'] = min(receipt['gross_cap'], ceiling)\n    cap = receipt[\"gross_cap\"]\n",
              ),
              (
                  "    *, shock_floor: float = 0., preserve_strategy_valid_holdings: bool = False,\n    risk_alert_active: bool | None = None,\n    portfolio_evidence_buy_symbols: set[str] | None = None,\n) -> None:\n",
                  "    *, shock_floor: float = 0., preserve_strategy_valid_holdings: bool = False,\n    risk_alert_active: bool | None = None,\n    portfolio_evidence_buy_symbols: set[str] | None = None,\n    gross_cap_ceiling: float | None = None,\n) -> None:\n",
              ),
              (
                  "        crowded_shock_reduced_book_ids=crowded_shock_reduced_book_ids,\n    )\n",
                  "        crowded_shock_reduced_book_ids=crowded_shock_reduced_book_ids,\n        gross_cap_ceiling=gross_cap_ceiling,\n    )\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch anchor count {count}, expected 1: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m compileall -q quantfusion/risk/account_budget.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quantfusion/risk/account_budget.py
          git commit -m "feat: retain AB5 gross budget during recovery"
          git push origin HEAD:agent/ab5-recovery-cleanup-20260917
