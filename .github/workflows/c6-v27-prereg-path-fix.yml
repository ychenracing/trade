name: C6 v27 preregistration path fix

on:
  push:
    branches:
      - codex/c6-v27-prereg-path-fix-20260908

permissions:
  contents: write

concurrency:
  group: c6-v27-prereg-path-fix
  cancel-in-progress: false

jobs:
  targeted-fix:
    if: github.event.head_commit.message != 'fix(c6): type preregistration path in recovered L1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/c6-v27-prereg-path-fix-20260908
          fetch-depth: 0
      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
          check-latest: false
      - name: Install frozen dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Apply minimal path typing fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('quantfusion/application/c6_diagnostics.py')
          text = source.read_text(encoding='utf-8')
          old = '    parser.add_argument("--preregistration", required=True)\n'
          new = '    parser.add_argument("--preregistration", required=True, type=Path)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one parser target, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py')
          text = test.read_text(encoding='utf-8')
          import_old = 'from __future__ import annotations\n\nfrom quantfusion.application.c6_diagnostics import build_parser\n'
          import_new = 'from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom quantfusion.application.c6_diagnostics import build_parser\n'
          if text.count(import_old) != 1:
              raise SystemExit('unexpected recovery CLI import block')
          text = text.replace(import_old, import_new)
          anchor = '    assert args.source_revision == "b" * 40\n'
          if text.count(anchor) != 1:
              raise SystemExit('unexpected recovery CLI assertion block')
          text = text.replace(anchor, '    assert args.preregistration == Path("p.json")\n' + anchor)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Verify minimal diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'quantfusion/application/c6_diagnostics.py\ntests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py'
          git diff -- quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
      - name: Run affected non-economic regressions
        run: |
          python -m ruff check quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
          python -m pytest -q \
            tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py \
            tests/c6_non_economic/test_c6_parallel_l1_attestation.py \
            tests/c6_non_economic/test_c6_parallel_l1_single_pass.py
      - name: Commit exact fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
          test "$(git diff --cached --name-only | sort)" = $'quantfusion/application/c6_diagnostics.py\ntests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py'
          git commit -m 'fix(c6): type preregistration path in recovered L1'
          git push origin HEAD:codex/c6-v27-prereg-path-fix-20260908
