name: C6 AB5 direct release engineering
on:
  push:
    branches: [codex/c6-ab5-release-build-20260912]
    paths: [.github/workflows/c6-ab5-release-build.yml]
permissions:
  contents: write
concurrency:
  group: c6-ab5-direct-release-engineering
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 07d1294958667224073314d905b87194a0ee5ba7
      EXPECTED_MAIN: 0250163dbe1b234e96339f9059f9a2074f19cb06
      EXPECTED_TREE: f6f121a545276f2e156cccd56ef9c01eda5d1b0c
      TARGET_BRANCH: codex/c6-causal-risk-closure-v11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07d1294958667224073314d905b87194a0ee5ba7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install existing locked engineering dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Restore exact reviewed source blobs and minimal native wiring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c6-release-export"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          def blob(oid):
              req = urllib.request.Request('https://api.github.com/repos/ychenracing/trade/git/blobs/' + oid, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              raw = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == oid
              return raw
          for path, oid in {
              'quantfusion/application/c6_release_publication.py': '54aaf2851e2d002e5923d918bfd184feec28e698',
              'tests/c6_non_economic/test_c6_release_publication.py': '28a372cbcaad1e1dc6fc46f59cba7bc1324d3a01',
              'docs/C6_AB5_PUBLICATION.md': 'f6bd11c78da1275f9491789df0c298694283b84a',
          }.items():
              assert not Path(path).exists()
              Path(path).write_bytes(blob(oid))
          wiring = blob('1e55ef2230d04dc60060379ad350158462195f15')
          assert hashlib.sha256(wiring).hexdigest() == '1642bafe4beb3b812e00da9ef65d1f5bfb9796138e7c93a84a8fe47a1bd924d3'
          subprocess.run(['git', 'apply', '--check', '-'], input=wiring, check=True)
          subprocess.run(['git', 'apply', '-'], input=wiring, check=True)
          PY
          git add quantfusion/application/c6_release_publication.py quantfusion/application/stress.py quantfusion/application/stress_artifacts.py tests/c6_non_economic/test_c6_release_publication.py docs/C6_AB5_PUBLICATION.md
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          python -m compileall -q quantfusion/application/c6_release_publication.py quantfusion/application/stress.py quantfusion/application/stress_artifacts.py tests/c6_non_economic/test_c6_release_publication.py
          python -m pytest -q tests/c6_non_economic/test_c6_release_publication.py tests/c6_non_economic/test_c6_release_acceptance.py tests/c6_non_economic/test_c6_bound_run.py tests/unit/test_stress_scenarios.py tests/contract/test_architecture.py 2>&1 | tee "$RUNNER_TEMP/c6-release-export/publication-tests.txt"
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quantfusion/application/c6_release_publication.py quantfusion/application/stress.py quantfusion/application/stress_artifacts.py tests/c6_non_economic/test_c6_release_publication.py 2>&1 | tee "$RUNNER_TEMP/c6-release-export/lint.txt"
          pyright quantfusion/application/c6_release_publication.py quantfusion/application/stress.py quantfusion/application/stress_artifacts.py 2>&1 | tee "$RUNNER_TEMP/c6-release-export/typecheck.txt"
      - name: Verify actual clean source admission and publish original PR63
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request('https://api.github.com/repos/ychenracing/trade/pulls/63', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=60) as response:
              pr = json.load(response)
          assert pr['state'] == 'open' and not pr['merged'] and pr['head']['sha'] == os.environ['EXPECTED_HEAD']
          PY
          git config user.name ychenracing
          git config user.email ychenracing@163.com
          git commit -m 'feat(stress): bind AB5 owner acceptance to native formal publication'
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from quantfusion.application import c6_release_publication as release, stress_artifacts, stress_scenarios
          from quantfusion.config.paths import MARKET_DATA_DIR, REGIME_DATA_DIR
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          plan = stress_scenarios._multi_seed_scenarios(random_samples=50, permutation_samples=50, seeds=(20260807,20260817,20260827))
          provenance = stress_artifacts._build_provenance(plan, MARKET_DATA_DIR, REGIME_DATA_DIR, source_revision=sha, candidate_id='C6-Base+AB5')
          proof = release.verify_execution_identity(provenance)
          (Path(os.environ['RUNNER_TEMP']) / 'c6-release-export' / 'source-admission.json').write_text(json.dumps(proof,sort_keys=True,indent=2) + '\n')
          PY
          git push origin HEAD:refs/heads/$TARGET_BRANCH
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$(git rev-parse HEAD)"
          git branch c6-export-publication HEAD
          git bundle create "$RUNNER_TEMP/c6-release-export/integrated.bundle" c6-export-publication
          git show -s --format='%H %T %P' HEAD > "$RUNNER_TEMP/c6-release-export/head.txt"
          git diff "$EXPECTED_HEAD" HEAD --stat > "$RUNNER_TEMP/c6-release-export/diff-stat.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'c6-release-export'
          receipt = {'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'source_revision': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), 'previous_head': os.environ['EXPECTED_HEAD'], 'main_revision': os.environ['EXPECTED_MAIN'], 'published': True, 'economic_dispatches': 0, 'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}}
          (out / 'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2) + '\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c6-ab5-publication-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/c6-release-export/
          if-no-files-found: error
          retention-days: 30
