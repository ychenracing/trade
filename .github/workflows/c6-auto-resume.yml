name: C6 Automatic Checkpoint Resume

on:
  workflow_dispatch:
    inputs:
      predecessor_run_id:
        description: Exact bound run to authenticate after it finishes
        required: true
        type: string
  workflow_run:
    workflows: [C6 Bound Economic Run]
    types: [completed]
    branches: [codex/c6-v13-workflow-anchor]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [codex/c6-auto-resume-preflight]

permissions:
  contents: read

concurrency:
  group: c6-auto-resume-v13
  cancel-in-progress: false

jobs:
  synthetic:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -I -S .github/scripts/test_c6_auto_resume.py
  resume:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checkpoint and dispatch its successor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -S .github/scripts/c6_auto_resume.py
