name: Refresh flow-neutral risk fingerprints

on:
  push:
    branches: [codex/flow-neutral-sleeve-hwm]

permissions:
  contents: write

concurrency:
  group: flow-neutral-fingerprint-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ychenracing/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Recompute only flow-sensitive risk-event fingerprints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from quantfusion.research.fingerprints import economic_sequence_fingerprints
          from tests.regression.test_quant_fusion import (
              UNIVERSES,
              regime_route_fingerprint,
              run_quiet,
          )

          path = Path('tests/fixtures/backtest_golden_metrics.json')
          baselines = json.loads(path.read_text(encoding='utf-8'))
          allowed = {'risk_events_sha256'}
          changes = {}

          for name, codes in UNIVERSES.items():
              key = str(len(codes))
              expected = baselines[key]
              result = run_quiet(codes)
              actual = {
                  metric: int(result[metric])
                  for metric in (
                      'total_trades',
                      'sell_trades',
                      'sleeve_fill_count',
                      'sleeve_sell_fill_count',
                      'date_symbol_side_count',
                      'date_symbol_sell_side_count',
                  )
              }
              actual.update(economic_sequence_fingerprints(result))
              actual.pop('regime_state_series_sha256')
              actual['regime_route_sha256'] = regime_route_fingerprint(result)

              unexpected = {
                  metric: (expected.get(metric), value)
                  for metric, value in actual.items()
                  if metric not in allowed and expected.get(metric) != value
              }
              if unexpected:
                  raise SystemExit(
                      f'unexpected non-risk fingerprint drift for {name}: {unexpected}'
                  )

              old = expected['risk_events_sha256']
              new = actual['risk_events_sha256']
              if old != new:
                  expected['risk_events_sha256'] = new
                  changes[key] = {'old': old, 'new': new}

          if not changes:
              raise SystemExit('expected flow-neutral risk fingerprint changes were absent')
          print(json.dumps(changes, indent=2, sort_keys=True))
          path.write_text(json.dumps(baselines, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Publish fixture update and remove bootstrap workflow
        env:
          BRANCH: codex/flow-neutral-sleeve-hwm
        run: |
          rm .github/workflows/flow-neutral-fingerprint-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/backtest_golden_metrics.json .github/workflows/flow-neutral-fingerprint-refresh.yml
          git diff --cached --check
          git commit -m 'test: refresh flow-neutral risk fingerprints'
          git push origin HEAD:"$BRANCH"
