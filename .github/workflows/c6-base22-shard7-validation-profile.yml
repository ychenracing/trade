name: C6 Base22 Shard7 Validation Profile

on:
  push:
    branches: [codex/c6-base22-shard7-validation-profile-20260908]
    paths:
      - .github/workflows/c6-base22-shard7-validation-profile.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: c6-base22-shard7-validation-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: addb5c8ebf98ac43e08676cbc6ffe81a2627d9d7
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ea6dfa36b9796df7e4078d6f8d88b539a54072e3
          path: bindings
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: source/requirements-lock.txt
      - name: Verify immutable source and bindings
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 'addb5c8ebf98ac43e08676cbc6ffe81a2627d9d7'
          test "$(git -C bindings rev-parse HEAD)" = 'ea6dfa36b9796df7e4078d6f8d88b539a54072e3'
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.12.14'
      - name: Install frozen dependencies
        run: python -m pip install --require-hashes -r source/requirements-lock.txt
      - name: Download exact Base22 shard 7 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c6-l1-shard-34128460919-7
          path: shard/artifact-7
          github-token: ${{ github.token }}
          run-id: 34128460919
          repository: ychenracing/trade
      - name: Profile real shard parsing and semantic validation
        working-directory: source
        env:
          BINDINGS_FILE: ${{ github.workspace }}/bindings/artifacts/diagnostics/c6-run-bindings.json
          SHARD_FILE: ${{ github.workspace }}/shard/artifact-7/shard.json.gz
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from quantfusion.application.c6_bound_run import validate_checkpoint_item
          from quantfusion.application.c6_contract import canonical_payload_hash, load_preregistration, load_run_bindings
          from quantfusion.application.c6_parallel_l1 import core_l1_tasks, partition_item_ids
          from quantfusion.io.c6_stream import FileArray, load_object

          prereg = load_preregistration(Path('artifacts/diagnostics/c6-preregistration.json'), repository=Path.cwd())
          bindings = load_run_bindings(Path(os.environ['BINDINGS_FILE']))
          binding = next(row for row in bindings['binding_records'] if row['record_id'] == 'c6.base.l1')
          ids, _ = core_l1_tasks(prereg, binding)
          expected = partition_item_ids(ids, 7, 12, chunk_size=int(binding['runtime']['checkpoint_every']))
          path = Path(os.environ['SHARD_FILE'])

          t0 = time.perf_counter()
          payload = load_object(path, array_fields=frozenset({'records'}))
          t_load = time.perf_counter() - t0
          records = payload['records']
          assert isinstance(records, FileArray)

          t0 = time.perf_counter()
          observed = [item.get('item_id') for item in records if isinstance(item, dict)]
          assert observed == expected
          t_identity = time.perf_counter() - t0

          t0 = time.perf_counter()
          count = 0
          for item in records:
              assert isinstance(item, dict)
              assert set(item) == {'item_id', 'item_kind', 'result_schema', 'result_sha256', 'result'}
              assert item['item_kind'] == 'evaluation'
              assert item['result_schema'] == 'evaluation_record'
              assert isinstance(item['result'], dict)
              assert item['result_sha256'] == canonical_payload_hash(item['result'])
              count += 1
          assert count == len(expected)
          t_hash = time.perf_counter() - t0

          t0 = time.perf_counter()
          count = 0
          for item in records:
              validate_checkpoint_item(item, prereg)
              count += 1
          assert count == len(expected)
          t_semantic = time.perf_counter() - t0

          print(json.dumps({
              'source_revision': binding['source_revision'],
              'run_bindings_revision': 'ea6dfa36b9796df7e4078d6f8d88b539a54072e3',
              'source_run_id': 34128460919,
              'shard_index': 7,
              'record_count': len(expected),
              'load_seconds': t_load,
              'identity_second_pass_seconds': t_identity,
              'hash_schema_third_pass_seconds': t_hash,
              'semantic_fourth_pass_seconds': t_semantic,
              'measured_total_seconds': t_load + t_identity + t_hash + t_semantic,
          }, sort_keys=True))
          PY
