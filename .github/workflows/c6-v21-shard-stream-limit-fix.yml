name: C6 v21 Shard Stream Limit Fix

on:
  push:
    branches: [codex/c6-v21-shard-stream-limit-fix-20260907]
    paths:
      - quantfusion/application/c6_parallel_l1.py
      - tests/c6_non_economic/test_c6_parallel_l1.py
      - .github/workflows/c6-v21-shard-stream-limit-fix.yml

permissions:
  contents: read

concurrency:
  group: c6-v21-shard-stream-limit-fix
  cancel-in-progress: false

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify frozen-style interpreter
        run: test "$(python -c 'import platform; print(platform.python_version())')" = '3.12.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run affected parallel aggregate chain
        run: |
          python -m pytest -q \
            tests/c6_non_economic/test_c6_parallel_l1.py \
            tests/c6_non_economic/test_c6_diagnostics.py \
            tests/c6_non_economic/test_c6_bound_run.py
