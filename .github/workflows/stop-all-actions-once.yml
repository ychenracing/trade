name: Stop all active trade Actions once

on:
  push:
    branches:
      - codex/stop-all-actions-20260903
    paths:
      - .github/workflows/stop-all-actions-once.yml

permissions:
  actions: write
  contents: write

jobs:
  stop-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stop-all-actions-20260903
          fetch-depth: 0

      - name: Cancel every other active workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import time

          repository = os.environ["REPOSITORY"]
          self_run_id = int(os.environ["SELF_RUN_ID"])
          statuses = ("queued", "in_progress", "waiting", "requested", "pending")

          def active_runs() -> dict[int, dict[str, object]]:
              found: dict[int, dict[str, object]] = {}
              for status in statuses:
                  page = 1
                  while True:
                      command = [
                          "gh",
                          "api",
                          f"/repos/{repository}/actions/runs?status={status}&per_page=100&page={page}",
                      ]
                      completed = subprocess.run(
                          command,
                          check=True,
                          text=True,
                          capture_output=True,
                      )
                      payload = json.loads(completed.stdout)
                      runs = payload.get("workflow_runs", [])
                      for run in runs:
                          run_id = int(run["id"])
                          if run_id != self_run_id:
                              found[run_id] = run
                      if len(runs) < 100:
                          break
                      page += 1
              return found

          initial = active_runs()
          print(
              json.dumps(
                  {
                      "self_run_id": self_run_id,
                      "active_before": [
                          {
                              "id": run_id,
                              "name": run.get("name"),
                              "status": run.get("status"),
                              "head_branch": run.get("head_branch"),
                          }
                          for run_id, run in sorted(initial.items())
                      ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )

          for run_id in sorted(initial):
              completed = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "POST",
                      f"/repos/{repository}/actions/runs/{run_id}/cancel",
                  ],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              print(
                  f"cancel run {run_id}: returncode={completed.returncode} "
                  f"stderr={completed.stderr.strip()!r}"
              )

          remaining: dict[int, dict[str, object]] = {}
          for _ in range(15):
              remaining = active_runs()
              if not remaining:
                  break
              for run_id in sorted(remaining):
                  subprocess.run(
                      [
                          "gh",
                          "api",
                          "--method",
                          "POST",
                          f"/repos/{repository}/actions/runs/{run_id}/cancel",
                      ],
                      check=False,
                      text=True,
                      capture_output=True,
                  )
              time.sleep(2)

          if remaining:
              raise SystemExit(
                  "active runs remain after cancellation attempts: "
                  + json.dumps(
                      {
                          run_id: {
                              "name": run.get("name"),
                              "status": run.get("status"),
                              "head_branch": run.get("head_branch"),
                          }
                          for run_id, run in sorted(remaining.items())
                      },
                      ensure_ascii=False,
                  )
              )

          print("All other queued/in-progress/waiting/requested/pending runs are stopped.")
          PY

      - name: Remove the one-shot stopper from its branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stop-all-actions-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot Action stopper"
          git push origin HEAD:codex/stop-all-actions-20260903
