name: Apply production reliability refactor

on:
  push:
    branches: [agent/production-reliability-refactor]
    paths:
      - .github/scripts/apply_production_reliability_refactor.py
      - .github/workflows/apply-production-reliability-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source rewrite
        run: python .github/scripts/apply_production_reliability_refactor.py
      - name: Verify source shape
        run: |
          python -m compileall -q quantfusion
          git diff --check
      - name: Save implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quantfusion/engine/replay.py quantfusion/engine/ensemble_allocation.py
          git diff --cached --quiet && exit 1
          git commit -m 'refactor: integrate production reliability boundaries'
          git push origin HEAD:agent/production-reliability-refactor
