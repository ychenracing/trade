name: C6 Bound Economic Run

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Frozen I_B or I_S 40-character commit SHA
        required: true
        type: string
      run_bindings_revision:
        description: Frozen evidence-only R commit SHA
        required: true
        type: string
      workflow_revision:
        description: Frozen commit containing this exact workflow definition
        required: true
        type: string
      binding_id:
        description: Exact logical binding ID frozen by R
        required: true
        type: string
      logical_run_id:
        description: Unique R-bound logical run identity
        required: true
        type: string
      attempt_id:
        description: R-authorized attempt identity
        required: true
        type: string
      fencing_token:
        description: R-authorized exclusive lease token
        required: true
        type: string
      resume_from:
        description: Optional R-authorized sealed checkpoint identity
        required: false
        default: ""
        type: string
      runner_image_os:
        description: Frozen GitHub runner ImageOS value
        required: true
        type: string
      runner_image_version:
        description: Frozen GitHub runner ImageVersion value
        required: true
        type: string
      python_version:
        description: Frozen Python patch version
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: c6-bound-${{ inputs.logical_run_id }}
  cancel-in-progress: false

jobs:
  run:
    name: Execute frozen binding
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Validate immutable inputs
        env:
          C6_SOURCE_REVISION: ${{ inputs.source_revision }}
          C6_RUN_BINDINGS_REVISION: ${{ inputs.run_bindings_revision }}
          C6_WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          C6_BINDING_ID: ${{ inputs.binding_id }}
          C6_LOGICAL_RUN_ID: ${{ inputs.logical_run_id }}
          C6_ATTEMPT_ID: ${{ inputs.attempt_id }}
          C6_FENCING_TOKEN: ${{ inputs.fencing_token }}
          C6_RESUME_FROM: ${{ inputs.resume_from }}
          C6_RUNNER_IMAGE_OS: ${{ inputs.runner_image_os }}
          C6_RUNNER_IMAGE_VERSION: ${{ inputs.runner_image_version }}
          C6_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          [[ "$C6_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$C6_RUN_BINDINGS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$C6_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$C6_BINDING_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$C6_LOGICAL_RUN_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$C6_ATTEMPT_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$C6_FENCING_TOKEN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{15,255}$ ]]
          [[ -z "$C6_RESUME_FROM" || "$C6_RESUME_FROM" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$ ]]
          [[ "$C6_RUNNER_IMAGE_OS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$C6_RUNNER_IMAGE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$C6_PYTHON_VERSION" =~ ^3\.12\.[0-9]+$ ]]
          test "$GITHUB_SHA" = "$C6_WORKFLOW_REVISION"
          test "${ImageOS:-}" = "$C6_RUNNER_IMAGE_OS"
          test "${ImageVersion:-}" = "$C6_RUNNER_IMAGE_VERSION"
      - name: Check out frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
      - name: Check out frozen bindings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.run_bindings_revision }}
          path: bindings
          persist-credentials: false
      - name: Verify checked-out identities
        env:
          C6_SOURCE_REVISION: ${{ inputs.source_revision }}
          C6_RUN_BINDINGS_REVISION: ${{ inputs.run_bindings_revision }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$C6_SOURCE_REVISION"
          test "$(git -C bindings rev-parse HEAD)" = "$C6_RUN_BINDINGS_REVISION"
          test -z "$(git -C source status --porcelain -uall)"
          test -z "$(git -C bindings status --porcelain -uall)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: source/requirements-lock.txt
      - name: Verify frozen interpreter
        env:
          C6_PYTHON_VERSION: ${{ inputs.python_version }}
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "$C6_PYTHON_VERSION"
      - name: Install frozen dependencies
        run: python -m pip install -r source/requirements-lock.txt
      - name: Execute exact run binding
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C6_SOURCE_REVISION: ${{ inputs.source_revision }}
          C6_RUN_BINDINGS_REVISION: ${{ inputs.run_bindings_revision }}
          C6_WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          C6_BINDING_ID: ${{ inputs.binding_id }}
          C6_LOGICAL_RUN_ID: ${{ inputs.logical_run_id }}
          C6_ATTEMPT_ID: ${{ inputs.attempt_id }}
          C6_FENCING_TOKEN: ${{ inputs.fencing_token }}
          C6_RESUME_FROM: ${{ inputs.resume_from }}
          C6_RUNNER_IMAGE_OS: ${{ inputs.runner_image_os }}
          C6_RUNNER_IMAGE_VERSION: ${{ inputs.runner_image_version }}
          C6_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          python -m quantfusion.application.c6_bound_run \
            --bindings-file "$GITHUB_WORKSPACE/bindings/artifacts/diagnostics/c6-run-bindings.json" \
            --binding-id "$C6_BINDING_ID" \
            --logical-run-id "$C6_LOGICAL_RUN_ID" \
            --attempt-id "$C6_ATTEMPT_ID" \
            --fencing-token "$C6_FENCING_TOKEN" \
            --resume-from "$C6_RESUME_FROM" \
            --source-revision "$C6_SOURCE_REVISION" \
            --run-bindings-revision "$C6_RUN_BINDINGS_REVISION" \
            --workflow-revision "$C6_WORKFLOW_REVISION" \
            --runner-image-os "$C6_RUNNER_IMAGE_OS" \
            --runner-image-version "$C6_RUNNER_IMAGE_VERSION" \
            --python-version "$C6_PYTHON_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --require-durable-lease
      - name: Upload sealed run export
        if: ${{ always() && hashFiles('source/artifacts/checkpoints/c6/sealed-export/manifest.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c6-bound-${{ inputs.logical_run_id }}-${{ inputs.attempt_id }}
          path: source/artifacts/checkpoints/c6/sealed-export/
          if-no-files-found: error
          retention-days: 90
