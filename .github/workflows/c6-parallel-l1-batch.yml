name: C6 Parallel L1 Validation

on:
  push:
    branches: [codex/c6-parallel-l1-batch-20260907]
    paths: [.github/workflows/c6-parallel-l1-batch.yml]

permissions:
  contents: write

concurrency:
  group: c6-parallel-l1-batch-20260907
  cancel-in-progress: false

env:
  BASE_SHA: 281d67551e853c9f024a469e6a5f04e434730c1b
  TARGET_BRANCH: codex/c6-causal-risk-closure-v11

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Check exact target head and install locked dependencies
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          python -m pip install --require-hashes -r requirements-lock.txt
      - name: Write RED tests
        run: |
          cat > tests/c6_non_economic/test_c6_parallel_l1.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import pytest

          from quantfusion.application.c6_contract import canonical_payload_hash
          from quantfusion.application.c6_parallel_l1 import (
              fresh_pool_map,
              merge_shard_payloads,
              partition_item_ids,
              shard_payload,
          )
          from quantfusion.io.c6_stream import write_json


          def _square(value: int) -> dict[str, int]:
              return {"square": value * value}


          def _record(item_id: str, value: int) -> dict[str, object]:
              result = {"value": value}
              return {
                  "item_id": item_id,
                  "item_kind": "evaluation",
                  "result_schema": "evaluation_record",
                  "result_sha256": canonical_payload_hash(result),
                  "result": result,
              }


          def test_partition_is_exact_balanced_and_order_preserving():
              ids = [f"evaluation/item-{index:03d}" for index in range(37)]
              shards = [partition_item_ids(ids, index, 12) for index in range(12)]
              assert sorted(item for shard in shards for item in shard) == sorted(ids)
              assert len({item for shard in shards for item in shard}) == len(ids)
              assert max(map(len, shards)) - min(map(len, shards)) <= 1
              for index, shard in enumerate(shards):
                  assert shard == [item for ordinal, item in enumerate(ids) if ordinal % 12 == index]


          @pytest.mark.parametrize("workers", [1, 2])
          def test_fresh_pool_map_preserves_order_across_chunks(workers):
              tasks = list(range(13))
              assert fresh_pool_map(_square, tasks, workers=workers, chunk_size=4) == [
                  _square(item) for item in tasks
              ]


          def _write_shards(root: Path, ids: list[str], *, shard_count: int = 3) -> None:
              for index in range(shard_count):
                  selected = partition_item_ids(ids, index, shard_count)
                  payload = shard_payload(
                      source_revision="a" * 40,
                      record_id="c6.base.l1",
                      shard_index=index,
                      shard_count=shard_count,
                      core_item_ids=ids,
                      records=[_record(item, ids.index(item)) for item in selected],
                  )
                  path = root / f"artifact-{index}" / "shard.json.gz"
                  path.parent.mkdir(parents=True)
                  write_json(path, payload)


          def test_merge_reassembles_exact_manifest_order(tmp_path):
              ids = [f"evaluation/item-{index:03d}" for index in range(17)]
              _write_shards(tmp_path, ids)
              results = merge_shard_payloads(
                  tmp_path,
                  expected_item_ids=ids,
                  source_revision="a" * 40,
                  record_id="c6.base.l1",
                  shard_count=3,
              )
              assert results == [{"value": index} for index in range(len(ids))]


          @pytest.mark.parametrize("mutation", ["missing", "wrong-shard", "bad-hash"])
          def test_merge_fails_closed_on_incomplete_or_corrupt_shards(tmp_path, mutation):
              ids = [f"evaluation/item-{index:03d}" for index in range(9)]
              _write_shards(tmp_path, ids)
              if mutation == "missing":
                  (tmp_path / "artifact-2" / "shard.json.gz").unlink()
              else:
                  from quantfusion.io.c6_stream import load_object
                  path = tmp_path / "artifact-1" / "shard.json.gz"
                  payload = load_object(path)
                  if mutation == "wrong-shard":
                      payload["records"][0]["item_id"] = ids[0]
                  else:
                      payload["records"][0]["result"]["value"] = 999
                  write_json(path, payload, replace=True)
              with pytest.raises(ValueError):
                  merge_shard_payloads(
                      tmp_path,
                      expected_item_ids=ids,
                      source_revision="a" * 40,
                      record_id="c6.base.l1",
                      shard_count=3,
                  )
          PY
          set +e
          python -m pytest -q tests/c6_non_economic/test_c6_parallel_l1.py >/tmp/red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'c6_parallel_l1' /tmp/red.log
      - name: Implement minimal parallel L1 plumbing
        run: |
          cat > quantfusion/application/c6_parallel_l1.py <<'PY'
          """Deterministic parallel precomputation for frozen C6 L1 evaluations.

          Shards only compute independent core evaluation records.  The trusted
          aggregate process revalidates every record and reconstructs the exact
          frozen order before predicates, W0-W5, controls, or no-drift checks.
          """

          from __future__ import annotations

          import argparse
          import hashlib
          from concurrent.futures import ProcessPoolExecutor
          from pathlib import Path
          from typing import Any, Callable, Mapping, Sequence

          from quantfusion.application.c6_contract import (
              canonical_payload_hash,
              load_preregistration,
              load_run_bindings,
              select_binding,
          )
          from quantfusion.io.c6_stream import load_object, write_json

          _SHARD_KEYS = {
              "schema_version", "kind", "source_revision", "record_id",
              "shard_index", "shard_count", "core_item_count",
              "core_item_sha256", "records",
          }
          _RECORD_KEYS = {"item_id", "item_kind", "result_schema", "result_sha256", "result"}


          def _manifest_hash(ids: Sequence[str]) -> str:
              return hashlib.sha256("".join(f"{item}\n" for item in ids).encode()).hexdigest()


          def partition_item_ids(item_ids: Sequence[str], shard_index: int, shard_count: int) -> list[str]:
              if shard_count < 1 or shard_index < 0 or shard_index >= shard_count:
                  raise ValueError("invalid L1 shard index/count")
              ids = list(item_ids)
              if not ids or len(set(ids)) != len(ids):
                  raise ValueError("parallel L1 manifest must be nonempty and unique")
              return [item for ordinal, item in enumerate(ids) if ordinal % shard_count == shard_index]


          def fresh_pool_map(
              worker: Callable[[Any], Any], tasks: Sequence[Any], *, workers: int, chunk_size: int
          ) -> list[Any]:
              """Preserve the existing fresh-pool-per-chunk process lifetime."""
              if workers < 1 or chunk_size < 1:
                  raise ValueError("workers and chunk_size must be positive")
              results: list[Any] = []
              for offset in range(0, len(tasks), chunk_size):
                  batch = list(tasks[offset:offset + chunk_size])
                  if workers == 1:
                      results.extend(map(worker, batch))
                  else:
                      with ProcessPoolExecutor(max_workers=workers) as executor:
                          results.extend(executor.map(worker, batch))
              return results


          def core_l1_tasks(
              prereg: Mapping[str, Any], binding: Mapping[str, Any]
          ) -> tuple[list[str], list[tuple[str, Mapping[str, Any], str]]]:
              from quantfusion.application import stress_scenarios
              from quantfusion.application.c6_diagnostics import validate_manifest_identity

              manifests = prereg["scenario_manifests"]
              scenario_ids = Path(manifests["L1_ECONOMIC_SCENARIO_IDS"]["path"]).read_text().splitlines()
              validate_manifest_identity(scenario_ids, manifests["L1_ECONOMIC_SCENARIO_IDS"])
              plan = stress_scenarios._multi_seed_scenarios(
                  random_samples=50,
                  permutation_samples=50,
                  seeds=(20260807, 20260817, 20260827),
              )
              by_id = {item["scenario_id"]: item for item in plan}
              base = binding["candidate_id"] == "C6-Base"
              variants = (
                  manifests["L1_BASE_EVALUATION_MANIFEST"]["core_variant_order"]
                  if base else ["C6-Base+S"]
              )
              tasks = [(variant, by_id[scenario], "DEFAULT") for variant in variants for scenario in scenario_ids]
              ids = [f"evaluation/{variant}::{scenario['scenario_id']}" for variant, scenario, _ in tasks]
              return ids, tasks


          def shard_payload(
              *, source_revision: str, record_id: str, shard_index: int, shard_count: int,
              core_item_ids: Sequence[str], records: Sequence[Mapping[str, Any]],
          ) -> dict[str, Any]:
              ids = list(core_item_ids)
              return {
                  "schema_version": 1,
                  "kind": "c6_l1_parallel_shard",
                  "source_revision": source_revision,
                  "record_id": record_id,
                  "shard_index": shard_index,
                  "shard_count": shard_count,
                  "core_item_count": len(ids),
                  "core_item_sha256": _manifest_hash(ids),
                  "records": list(records),
              }


          def merge_shard_payloads(
              root: Path,
              *,
              expected_item_ids: Sequence[str],
              source_revision: str,
              record_id: str,
              shard_count: int,
              prereg: Mapping[str, Any] | None = None,
          ) -> list[dict[str, Any]]:
              from quantfusion.application.c6_bound_run import validate_checkpoint_item

              ids = list(expected_item_ids)
              expected_hash = _manifest_hash(ids)
              paths = sorted(root.rglob("shard.json.gz"))
              if len(paths) != shard_count:
                  raise ValueError("parallel L1 shard set is incomplete")
              by_id: dict[str, dict[str, Any]] = {}
              seen_shards: set[int] = set()
              for path in paths:
                  payload = load_object(path)
                  if not isinstance(payload, dict) or set(payload) != _SHARD_KEYS:
                      raise ValueError("parallel L1 shard schema is invalid")
                  index = payload["shard_index"]
                  if (
                      payload["schema_version"] != 1
                      or payload["kind"] != "c6_l1_parallel_shard"
                      or payload["source_revision"] != source_revision
                      or payload["record_id"] != record_id
                      or type(index) is not int
                      or index in seen_shards
                      or payload["shard_count"] != shard_count
                      or payload["core_item_count"] != len(ids)
                      or payload["core_item_sha256"] != expected_hash
                  ):
                      raise ValueError("parallel L1 shard identity is invalid")
                  expected_shard = partition_item_ids(ids, index, shard_count)
                  records = payload["records"]
                  if not isinstance(records, list) or [item.get("item_id") for item in records if isinstance(item, dict)] != expected_shard:
                      raise ValueError("parallel L1 shard does not contain its exact partition")
                  for item in records:
                      if (
                          not isinstance(item, dict)
                          or set(item) != _RECORD_KEYS
                          or item["item_kind"] != "evaluation"
                          or item["result_schema"] != "evaluation_record"
                          or not isinstance(item["result"], dict)
                          or item["result_sha256"] != canonical_payload_hash(item["result"])
                          or item["item_id"] in by_id
                      ):
                          raise ValueError("parallel L1 record hash/schema is invalid")
                      if prereg is not None:
                          validate_checkpoint_item(item, prereg)
                      by_id[item["item_id"]] = item["result"]
                  seen_shards.add(index)
              if seen_shards != set(range(shard_count)) or set(by_id) != set(ids):
                  raise ValueError("parallel L1 shard union is incomplete")
              return [by_id[item] for item in ids]


          def load_parallel_evaluations(
              root: Path, *, prereg: Mapping[str, Any], binding: Mapping[str, Any],
              source_revision: str, shard_count: int,
          ) -> list[dict[str, Any]]:
              ids, _ = core_l1_tasks(prereg, binding)
              return merge_shard_payloads(
                  root,
                  expected_item_ids=ids,
                  source_revision=source_revision,
                  record_id=str(binding["record_id"]),
                  shard_count=shard_count,
                  prereg=prereg,
              )


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--preregistration", required=True, type=Path)
              parser.add_argument("--bindings-file", required=True, type=Path)
              parser.add_argument("--binding-record-id", required=True)
              parser.add_argument("--source-revision", required=True)
              parser.add_argument("--shard-index", required=True, type=int)
              parser.add_argument("--shard-count", required=True, type=int)
              parser.add_argument("--workers", required=True, type=int)
              parser.add_argument("--output", required=True, type=Path)
              return parser


          def main() -> int:
              args = build_parser().parse_args()
              if len(args.source_revision) != 40 or any(c not in "0123456789abcdef" for c in args.source_revision):
                  raise ValueError("source_revision must be a lowercase Git SHA")
              prereg = load_preregistration(args.preregistration, repository=Path.cwd())
              bindings = load_run_bindings(args.bindings_file)
              binding = next(item for item in bindings["binding_records"] if item["record_id"] == args.binding_record_id)
              selected = select_binding(bindings, binding["workflow_binding_id"], candidate_id=binding["candidate_id"])
              if selected is not binding or binding["stage"] != "L1" or binding["source_revision"] != args.source_revision:
                  raise ValueError("parallel CLI identity does not select one exact L1 binding")
              ids, tasks = core_l1_tasks(prereg, binding)
              shard_ids = partition_item_ids(ids, args.shard_index, args.shard_count)
              by_id = dict(zip(ids, tasks, strict=True))
              shard_tasks = [by_id[item] for item in shard_ids]
              from quantfusion.application.c6_diagnostics import _l1_evaluate
              results = fresh_pool_map(
                  _l1_evaluate,
                  shard_tasks,
                  workers=args.workers,
                  chunk_size=int(binding["runtime"]["checkpoint_every"]),
              )
              from quantfusion.application.c6_bound_run import validate_checkpoint_item
              records = []
              for item_id, result in zip(shard_ids, results, strict=True):
                  item = {
                      "item_id": item_id,
                      "item_kind": "evaluation",
                      "result_schema": "evaluation_record",
                      "result_sha256": canonical_payload_hash(result),
                      "result": result,
                  }
                  validate_checkpoint_item(item, prereg)
                  records.append(item)
              write_json(
                  args.output,
                  shard_payload(
                      source_revision=args.source_revision,
                      record_id=args.binding_record_id,
                      shard_index=args.shard_index,
                      shard_count=args.shard_count,
                      core_item_ids=ids,
                      records=records,
                  ),
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('quantfusion/application/c6_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old = '''    tasks = [(variant, by_id[scenario], "DEFAULT") for variant in variants for scenario in scenario_ids]\n    checkpoint = DiagnosticCheckpoint.from_environment(execution_item_ids(binding, prereg), chunk_size=binding["runtime"]["checkpoint_every"])\n    evaluations = checkpoint.map(_l1_evaluate, tasks, [f"evaluation/{variant}::{scenario['scenario_id']}" for variant, scenario, _ in tasks])\n    if base:\n        interventions = [(variant, by_id["add-one-13-601869"], "DEFAULT") for variant in manifests["L1_BASE_EVALUATION_MANIFEST"]["causal_intervention_order"]]\n        # Six interdependent intervention rows are finalized and committed together.\n        if checkpoint.chunk_size < len(interventions):\n            raise ValueError("checkpoint chunk must hold all causal interventions")\n        checkpoint.map(_l1_evaluate, interventions, [f"evaluation/{variant}::{scenario['scenario_id']}" for variant, scenario, _ in interventions], finalize=_attach_interventions)\n    evaluations = checkpoint.items[:checkpoint.cursor].project("result")\n'''
          new = '''    tasks = [(variant, by_id[scenario], "DEFAULT") for variant in variants for scenario in scenario_ids]\n    checkpoint = None\n    if args.parallel_evaluations is not None:\n        from quantfusion.application.c6_parallel_l1 import load_parallel_evaluations\n        evaluations = load_parallel_evaluations(\n            Path(args.parallel_evaluations), prereg=prereg, binding=binding,\n            source_revision=args.source_revision, shard_count=args.parallel_shard_count,\n        )\n    else:\n        checkpoint = DiagnosticCheckpoint.from_environment(\n            execution_item_ids(binding, prereg),\n            chunk_size=binding["runtime"]["checkpoint_every"],\n        )\n        evaluations = checkpoint.map(\n            _l1_evaluate, tasks,\n            [f"evaluation/{variant}::{scenario['scenario_id']}" for variant, scenario, _ in tasks],\n        )\n    if base:\n        interventions = [(variant, by_id["add-one-13-601869"], "DEFAULT") for variant in manifests["L1_BASE_EVALUATION_MANIFEST"]["causal_intervention_order"]]\n        # Six interdependent intervention rows are finalized and committed together.\n        if int(binding["runtime"]["checkpoint_every"]) < len(interventions):\n            raise ValueError("checkpoint chunk must hold all causal interventions")\n        if checkpoint is None:\n            from quantfusion.application.c6_parallel_l1 import fresh_pool_map\n            intervention_results = fresh_pool_map(\n                _l1_evaluate, interventions, workers=4,\n                chunk_size=int(binding["runtime"]["checkpoint_every"]),\n            )\n            _attach_interventions(intervention_results)\n            evaluations = [*evaluations, *intervention_results]\n        else:\n            checkpoint.map(\n                _l1_evaluate, interventions,\n                [f"evaluation/{variant}::{scenario['scenario_id']}" for variant, scenario, _ in interventions],\n                finalize=_attach_interventions,\n            )\n    if checkpoint is not None:\n        evaluations = checkpoint.items[:checkpoint.cursor].project("result")\n'''
          if old not in text:
              raise SystemExit('core L1 patch anchor not found')
          text = text.replace(old, new, 1)

          old2 = '''    controls = list(checkpoint.map(_identity, control_rows, [f"control/{item}" for item in manifests[control_name]["ids"]], workers=1))\n    drift_tasks = [(chosen, by_id[item]) for item in manifests["L1_INSTRUMENTATION_NO_DRIFT_SCENARIO_IDS"]["ids"]]\n    pairs = list(checkpoint.map(_no_drift_pair, drift_tasks, [f"no-drift/{item}" for item in manifests["L1_INSTRUMENTATION_NO_DRIFT_SCENARIO_IDS"]["ids"]]))\n'''
          new2 = '''    drift_tasks = [(chosen, by_id[item]) for item in manifests["L1_INSTRUMENTATION_NO_DRIFT_SCENARIO_IDS"]["ids"]]\n    if checkpoint is None:\n        from quantfusion.application.c6_parallel_l1 import fresh_pool_map\n        controls = list(control_rows)\n        pairs = fresh_pool_map(\n            _no_drift_pair, drift_tasks, workers=4,\n            chunk_size=int(binding["runtime"]["checkpoint_every"]),\n        )\n    else:\n        controls = list(checkpoint.map(\n            _identity, control_rows,\n            [f"control/{item}" for item in manifests[control_name]["ids"]], workers=1,\n        ))\n        pairs = list(checkpoint.map(\n            _no_drift_pair, drift_tasks,\n            [f"no-drift/{item}" for item in manifests["L1_INSTRUMENTATION_NO_DRIFT_SCENARIO_IDS"]["ids"]],\n        ))\n'''
          if old2 not in text:
              raise SystemExit('tail patch anchor not found')
          text = text.replace(old2, new2, 1)

          old3 = '''    parser.add_argument("--base-producer-artifact-sha256")\n    parser.add_argument("--output", required=True)\n'''
          new3 = '''    parser.add_argument("--base-producer-artifact-sha256")\n    parser.add_argument("--parallel-evaluations")\n    parser.add_argument("--parallel-shard-count", type=int)\n    parser.add_argument("--output", required=True)\n'''
          if old3 not in text:
              raise SystemExit('parser patch anchor not found')
          text = text.replace(old3, new3, 1)

          old4 = '''    if args.binding_record_id.endswith(".l2"):\n        payload = _produce_l2(args)\n    else:\n        payload = _produce_l1(args)\n'''
          new4 = '''    parallel = args.parallel_evaluations is not None or args.parallel_shard_count is not None\n    if parallel and (args.parallel_evaluations is None or args.parallel_shard_count is None\n                     or args.parallel_shard_count < 2):\n        raise ValueError("parallel L1 requires a directory and shard_count >= 2")\n    if args.binding_record_id.endswith(".l2"):\n        if parallel:\n            raise ValueError("parallel evaluation inputs are L1-only")\n        payload = _produce_l2(args)\n    else:\n        payload = _produce_l1(args)\n'''
          if old4 not in text:
              raise SystemExit('main patch anchor not found')
          path.write_text(text.replace(old4, new4, 1), encoding='utf-8')
          PY
      - name: Verify GREEN and affected boundaries
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/c6_non_economic/test_c6_parallel_l1.py \
            tests/c6_non_economic/test_c6_recovery_boundaries.py \
            tests/c6_non_economic/test_c6_bound_run.py --tb=short
          python -m compileall -q quantfusion/application/c6_parallel_l1.py quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quantfusion/application/c6_parallel_l1.py quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1.py
      - name: Publish coherent commit to existing PR63 branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git add quantfusion/application/c6_parallel_l1.py quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1.py
          test "$(git diff --cached --name-only | sort)" = $'quantfusion/application/c6_diagnostics.py\nquantfusion/application/c6_parallel_l1.py\ntests/c6_non_economic/test_c6_parallel_l1.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(c6): add deterministic parallel L1 evaluation shards' -m 'Preserve the exact 3875-item Base contract and fresh process-pool-per-10-item semantics. Parallel jobs may precompute only independent core evaluations; the trusted aggregate consumer revalidates every hash/schema/formula, rejects missing/duplicate/misassigned shards, restores exact manifest order, and still performs W0-W5, controls, no-drift and predicates at the single aggregate boundary. No economic formula, scenario, threshold, candidate, selection rule or frozen v19 identity changes.'
          git push origin HEAD:$TARGET_BRANCH
