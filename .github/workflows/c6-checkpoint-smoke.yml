name: C6 checkpoint transport smoke

on:
  push:
    branches: [codex/c6-checkpoint-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Produce a real sealed synthetic checkpoint
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path
          runpy.run_path("tests/c6_non_economic/test_c6_bound_run.py")["_cloud_checkpoint_smoke"]("checkpoint", Path("smoke"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c6-synthetic-checkpoint
          path: smoke/export/
          if-no-files-found: error
          retention-days: 7
  resume:
    needs: checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - uses: actions/download-artifact@v4
        with:
          name: c6-synthetic-checkpoint
          path: smoke/
      - name: Validate transferred bytes and resume without recomputation
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path
          runpy.run_path("tests/c6_non_economic/test_c6_bound_run.py")["_cloud_checkpoint_smoke"]("resume", Path("smoke"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c6-synthetic-resume-proof
          path: smoke/verified.json
          if-no-files-found: error
          retention-days: 7
