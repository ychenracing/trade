name: C6 v21 Workflow Anchor Build

on:
  push:
    branches: [codex/c6-v21-workflow-anchor-build]
    paths:
      - .github/workflows/c6-v21-anchor-build.yml
      - .github/scripts/build_c6_v21_anchor.py

permissions:
  contents: write

concurrency:
  group: c6-v21-workflow-anchor-build
  cancel-in-progress: false

env:
  BASE_SHA: 3b4b9c2554b2ac54d065173d3889040a30bc6e89
  TARGET_BRANCH: codex/c6-v21-workflow-anchor

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify immutable build inputs
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$(git rev-parse "$TARGET_BRANCH^{tree}" 2>/dev/null || git rev-parse "$BASE_SHA^{tree}")"
      - name: Install existing locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Build and validate exact anchor files
        run: |
          set -euo pipefail
          python .github/scripts/build_c6_v21_anchor.py
          test -s /tmp/c6-bound-economic.yml
          test -s /tmp/c6-dispatch.yml
      - name: Publish two-file immutable anchor candidate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          cp /tmp/c6-bound-economic.yml .github/workflows/c6-bound-economic.yml
          cp /tmp/c6-dispatch.yml .github/workflows/c6-dispatch.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/c6-bound-economic.yml\n.github/workflows/c6-dispatch.yml'
          git add .github/workflows/c6-bound-economic.yml .github/workflows/c6-dispatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(c6): parallelize immutable L1 core evaluation' -m 'v21 workflow anchor only. Precompute L1 core evaluations across 12 isolated runners while preserving each original 10-item process chunk. Aggregate inside the same workflow run, then execute W0-W5, controls, no-drift, predicates and sealed export centrally. L1 is single-attempt/no-checkpoint; qualification/L2/L4 remain unchanged. Dispatch envelope is rebound only to the exact v21 anchor.'
          git push origin HEAD:$TARGET_BRANCH
