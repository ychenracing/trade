name: Publish 1.0.0
on:
  push:
    branches: [maintenance/publish-1.0.0]
    paths: [.github/workflows/publish-release.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: publish-trade-1.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ychenracing/trade' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7be8011d71b477c8ca3942d97830e67d0e0407c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import ast
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          REPO = "ychenracing/trade"
          MAIN = "b7be8011d71b477c8ca3942d97830e67d0e0407c"
          BASE = "1ec3c8ef28ace8ed7d88d4e9503fcc66fa299e71"
          CANDIDATE = "b1a54574e32a4552bfd128fac5f67a5eeab88c5c"
          TESTED = "ff2da8a3a2b33d94c70f331ca768dc1cefae0e21"
          TREE = "7ab528a8afd9f28b66529eeb39444d94a7261c00"
          TAG = "1.0.0"
          CI_RUN = 34765060985

          def api(path, data=None, missing=False):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
                  method="GET" if data is None else "POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise

          def git(*args):
              return subprocess.check_output(["git", *args])

          def tree(revision):
              return git("rev-parse", revision + "^{tree}").decode().strip()

          def paths(revision):
              return git("ls-tree", "-r", "--name-only", revision).decode().splitlines()

          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/maintenance/publish-1.0.0"
          assert git("rev-parse", "HEAD").decode().strip() == MAIN
          assert api("git/ref/heads/main")["object"]["sha"] == MAIN
          tested_commit = api("git/commits/" + TESTED)
          assert tree(MAIN) == tree(CANDIDATE) == tested_commit["tree"]["sha"] == TREE
          assert [p["sha"] for p in tested_commit["parents"]] == [BASE, CANDIDATE]
          pull = api("pulls/100")
          assert pull["merged"] and pull["merge_commit_sha"] == MAIN
          assert pull["head"]["sha"] == CANDIDATE
          run = api("actions/runs/" + str(CI_RUN))
          assert run["head_sha"] == CANDIDATE and run["event"] == "pull_request"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          jobs = api("actions/runs/" + str(CI_RUN) + "/jobs?per_page=100")["jobs"]
          assert len(jobs) == 5 and all(j["conclusion"] == "success" for j in jobs)

          before, after = set(paths(BASE)), set(paths(MAIN))
          protected = lambda p: p.startswith(("data/", "artifacts/", "tests/fixtures/", ".github/workflows/")) or p.startswith("requirements")
          protected_paths = sorted(p for p in before | after if protected(p))
          for path in protected_paths:
              assert path in before and path in after, path
              assert git("show", BASE + ":" + path) == git("show", MAIN + ":" + path), path

          class Normalize(ast.NodeTransformer):
              def visit_Constant(self, node):
                  replacements = {"AI 板块 ": "科技板块 ", "Daily AI-sector signal scan": "Daily technology-sector signal scan"}
                  if self.path == "quantfusion/application/daily_scan.py" and isinstance(node.value, str):
                      node.value = replacements.get(node.value, node.value)
                  return node
              def generic_visit(self, node):
                  super().generic_visit(node)
                  if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.body and isinstance(node.body[0], ast.Expr) and isinstance(node.body[0].value, ast.Constant) and isinstance(node.body[0].value.value, str):
                          node.body.pop(0)
                  if isinstance(node, ast.Module) and self.path == "quantfusion/__init__.py":
                      expected = ast.dump(ast.parse('__version__ = "1.0.0"').body[0])
                      node.body = [n for n in node.body if ast.dump(n) != expected]
                  return node

          def normalized(revision, path):
              visitor = Normalize()
              visitor.path = path
              return ast.dump(visitor.visit(ast.parse(git("show", revision + ":" + path))), include_attributes=False)

          runtime = lambda p: p.startswith(("quantfusion/", "scripts/")) and p.endswith(".py")
          assert {p for p in before if runtime(p)} == {p for p in after if runtime(p)}
          for path in sorted(p for p in after if runtime(p)):
              assert normalized(BASE, path) == normalized(MAIN, path), "Runtime change: " + path

          brands = re.compile(r"chatgpt|codex|\bglm\b|openai|deepseek|qwen|gemini|claude|\bAI\b", re.I)
          current_text = [p for p in after if runtime(p) or p.endswith(".md")]
          for path in current_text:
              assert not brands.search(Path(path).read_text(encoding="utf-8")), "Branding: " + path
          for path in ("docs/C6_AB5_RELEASE.md", "docs/C6_AB5_RELEASE_AUDIT.md", "docs/C6_RECOVERY_CONTRACT.md"):
              assert path not in after
          assert hashlib.sha256(git("cat-file", "blob", "634571eb1e944f17bc05d75267c718de7597ac31")).hexdigest() == "ee1b3402e9faa8264d1884eae6d0b4598add8d89b08a692e429def42901247a0"
          assert '__version__ = "1.0.0"' in Path("quantfusion/__init__.py").read_text()
          subprocess.run(["git", "diff", "--check", BASE, MAIN], check=True)

          notes = Path("docs/RELEASE.md").read_text(encoding="utf-8")
          assert notes.startswith("# Quant Fusion 1.0.0")
          notes += "\n\n## 源码与验证\n\n"
          notes += f"发行提交：`{MAIN}`；源码树：`{TREE}`。\n\n"
          notes += f"完整工程验证见 [CI]({run['html_url']})：Python 3.12 为 1038 tests 与 293 subtests 通过，Python 3.11 按既有 CI 范围通过，编译、Ruff、类型、安全、依赖审计和五池精确回归通过。CI 对应 PR 测试合并提交 `{TESTED}`，发行提交与其源码树完全一致；此次发行另行复核源码、冻结输入及文档身份，不冒称重新执行了正式 958 场景。\n\n"
          notes += f"[使用说明](https://github.com/{REPO}/blob/{TAG}/README.md) · [验证范围与风险](https://github.com/{REPO}/blob/{TAG}/docs/VALIDATION.md)\n"

          ref = api("git/ref/tags/" + TAG, missing=True)
          if ref is not None:
              target = ref["object"]
              for _ in range(4):
                  if target["type"] == "commit":
                      break
                  assert target["type"] == "tag"
                  target = api("git/tags/" + target["sha"])["object"]
              assert target["type"] == "commit" and target["sha"] == MAIN, "Refuse to move existing tag"
          release = api("releases/tags/" + TAG, missing=True)
          if release is not None:
              assert release["body"] == notes and release["name"] == "Quant Fusion 1.0.0"
              assert not release["draft"] and not release["prerelease"]
          else:
              assert api("git/ref/heads/main")["object"]["sha"] == MAIN
              release = api("releases", {"tag_name": TAG, "target_commitish": MAIN,
                  "name": "Quant Fusion 1.0.0", "body": notes, "draft": False,
                  "prerelease": False, "generate_release_notes": False, "make_latest": "true"})
          ref = api("git/ref/tags/" + TAG)
          assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == MAIN
          assert api("releases/latest")["id"] == release["id"]
          assert api("git/ref/heads/main")["object"]["sha"] == MAIN
          receipt = {"main": MAIN, "tree": TREE, "tag": TAG, "release_id": release["id"],
              "release_url": release["html_url"], "ci_run": CI_RUN, "tested_merge": TESTED,
              "protected_paths_unchanged": len(protected_paths),
              "runtime_ast_files_verified": sum(runtime(p) for p in after),
              "current_text_files_scanned": len(current_text),
              "release_body_sha256": hashlib.sha256(notes.encode()).hexdigest()}
          print("RELEASE_VERIFIED " + json.dumps(receipt, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("```json\n" + json.dumps(receipt, ensure_ascii=False, indent=2) + "\n```\n")
          PYCODE
