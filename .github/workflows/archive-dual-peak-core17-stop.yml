name: Archive dual-peak Core17 STOP evidence

on:
  push:
    branches: [agent/dual-peak-account-risk-coverage]
    paths:
      - .github/workflows/archive-dual-peak-core17-stop.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-dual-peak-core17-stop
  cancel-in-progress: false

jobs:
  archive:
    if: "${{ github.event.head_commit.message == 'evidence: fix one-shot Core17 artifact archiver' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify, and preserve the authoritative artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10501455305'
          ARTIFACT_NAME: dual-peak-account-risk-core17-v2-35230353642
          ARTIFACT_LENGTH: '109062'
          ARTIFACT_SHA256: 4ac5a79ec754644281ed25094a355a6f59a004baeda6a87ec7c60d050d1869b3
          EVIDENCE_RUN_ID: '35230353642'
          EVIDENCE_GATE_COMMIT: c396bfdedd135bee22ad1639ded55f3e19cc44ee
          CANDIDATE_SOURCE_SHA: b540a9bbcae32f923e233b6a3933ce260c91cede
          CANDIDATE_SOURCE_TREE: 514c3a597383a2d31e98ba654e63d18f3ad6cfda
        run: |
          set -euo pipefail
          destination="artifacts/diagnostics/account-risk-coverage/dual-peak-core17-stop/run-${EVIDENCE_RUN_ID}"
          temporary="$(mktemp -d)"
          archive="${temporary}/${ARTIFACT_NAME}.zip"
          extracted="${temporary}/extracted"
          mkdir -p "$destination" "$extracted"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$archive"

          test "$(stat -c '%s' "$archive")" = "$ARTIFACT_LENGTH"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$extracted"
          (cd "$extracted" && sha256sum --check SHA256SUMS)

          cp "$archive" "$destination/${ARTIFACT_NAME}.zip"
          cp "$extracted/core17-gate.json" "$destination/core17-gate.json"
          cp "$extracted/manifest.json" "$destination/manifest.json"
          cp "$extracted/SHA256SUMS" "$destination/SHA256SUMS"
          cp "$extracted/preregistration.json" "$destination/preregistration.json"
          cp "$extracted/source-identity.json" "$destination/source-identity.json"

          python - "$destination/archive-receipt.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          receipt = {
              "schema_version": 1,
              "status": "ARCHIVED_VERIFIED_CORE17_STOP",
              "workflow_run_id": int(os.environ["EVIDENCE_RUN_ID"]),
              "artifact_id": int(os.environ["ARTIFACT_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "artifact_length": int(os.environ["ARTIFACT_LENGTH"]),
              "artifact_sha256": os.environ["ARTIFACT_SHA256"],
              "gate_commit": os.environ["EVIDENCE_GATE_COMMIT"],
              "candidate_source_sha": os.environ["CANDIDATE_SOURCE_SHA"],
              "candidate_source_tree": os.environ["CANDIDATE_SOURCE_TREE"],
              "internal_sha256sums_verified": True,
              "decision": "FAIL",
              "next_layer_allowed": False,
          }
          Path(sys.argv[1]).write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f "$destination"
          git commit -m "evidence: preserve final Core17 STOP artifact"
          git push origin "HEAD:${GITHUB_REF_NAME}"
