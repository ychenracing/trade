name: C6 Parallel L1 Chunk Fix 2

on:
  push:
    branches: [codex/c6-parallel-l1-chunk-fix2-20260907]
    paths: [.github/workflows/c6-parallel-l1-chunk-fix2.yml]

permissions:
  contents: write

concurrency:
  group: c6-parallel-l1-chunk-fix2-20260907
  cancel-in-progress: false

env:
  BASE_SHA: 6e79bb9d9df9e9f19ca095817516cb1f0af37aba
  TARGET_BRANCH: codex/c6-causal-risk-closure-v11

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify isolated candidate identity
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install existing locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify focused GREEN
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/c6_non_economic/test_c6_parallel_l1.py \
            tests/c6_non_economic/test_c6_recovery_boundaries.py \
            tests/c6_non_economic/test_c6_bound_run.py --tb=short
          python -m compileall -q \
            quantfusion/application/c6_parallel_l1.py \
            quantfusion/application/c6_diagnostics.py \
            tests/c6_non_economic/test_c6_parallel_l1.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quantfusion/application/c6_parallel_l1.py \
            quantfusion/application/c6_diagnostics.py \
            tests/c6_non_economic/test_c6_parallel_l1.py
      - name: Publish only verified correction to existing PR63 branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          cp quantfusion/application/c6_parallel_l1.py /tmp/c6_parallel_l1.py
          cp tests/c6_non_economic/test_c6_parallel_l1.py /tmp/test_c6_parallel_l1.py
          git checkout --detach "$BASE_SHA"
          cp /tmp/c6_parallel_l1.py quantfusion/application/c6_parallel_l1.py
          cp /tmp/test_c6_parallel_l1.py tests/c6_non_economic/test_c6_parallel_l1.py
          git add quantfusion/application/c6_parallel_l1.py tests/c6_non_economic/test_c6_parallel_l1.py
          test "$(git diff --cached --name-only | sort)" = $'quantfusion/application/c6_parallel_l1.py\ntests/c6_non_economic/test_c6_parallel_l1.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(c6): preserve worker chunk identity across shards' -m 'Shard whole original checkpoint chunks rather than individual records. Each original 10-item process batch keeps the same members and order; only independently fresh process batches execute concurrently across jobs. Aggregate validation remains exact and fail-closed.'
          git push origin HEAD:$TARGET_BRANCH
