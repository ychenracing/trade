name: C6 Parallel Late Slot Validation

on:
  push:
    branches: [codex/c6-parallel-late-slot-batch]
    paths: [.github/workflows/c6-parallel-late-slot-batch.yml]

permissions:
  contents: write

concurrency:
  group: c6-parallel-late-slot-batch
  cancel-in-progress: false

env:
  BASE_SHA: 60660317dfcfc1b93d28df699a806400178a3770
  TARGET_BRANCH: codex/c6-causal-risk-closure-v11

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify exact target and install
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          python -m pip install --require-hashes -r requirements-lock.txt
      - name: Add RED boundary tests
        run: |
          cat >> tests/c6_non_economic/test_c6_bound_run.py <<'PY'


def test_parallel_evaluations_path_is_bound_to_runner_temp(tmp_path):
    from quantfusion.application.c6_bound_run import _parallel_evaluations_path
    runner = tmp_path / "runner"
    runner.mkdir()
    inside = runner / "shards"
    inside.mkdir()
    binding = {"runtime_late_slots": ["PARALLEL_EVALUATIONS_PATH"]}
    env = {"RUNNER_TEMP": str(runner), "C6_PARALLEL_EVALUATIONS_PATH": str(inside)}
    assert _parallel_evaluations_path(binding, env) == str(inside.resolve())


def test_parallel_evaluations_path_fails_closed_when_unbound_missing_or_outside(tmp_path):
    from quantfusion.application.c6_bound_run import _parallel_evaluations_path
    runner = tmp_path / "runner"
    runner.mkdir()
    inside = runner / "shards"
    inside.mkdir()
    outside = tmp_path / "outside"
    outside.mkdir()
    declared = {"runtime_late_slots": ["PARALLEL_EVALUATIONS_PATH"]}
    serial = {"runtime_late_slots": []}
    with pytest.raises(BoundRunError, match="requires parallel"):
        _parallel_evaluations_path(declared, {"RUNNER_TEMP": str(runner)})
    with pytest.raises(BoundRunError, match="forbids parallel"):
        _parallel_evaluations_path(serial, {"RUNNER_TEMP": str(runner), "C6_PARALLEL_EVALUATIONS_PATH": str(inside)})
    with pytest.raises(BoundRunError, match="outside RUNNER_TEMP"):
        _parallel_evaluations_path(declared, {"RUNNER_TEMP": str(runner), "C6_PARALLEL_EVALUATIONS_PATH": str(outside)})
    file_path = runner / "file"
    file_path.write_text("x", encoding="utf-8")
    with pytest.raises(BoundRunError, match="existing directory"):
        _parallel_evaluations_path(declared, {"RUNNER_TEMP": str(runner), "C6_PARALLEL_EVALUATIONS_PATH": str(file_path)})
PY
          set +e
          python -m pytest -q tests/c6_non_economic/test_c6_bound_run.py -k parallel_evaluations_path >/tmp/red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q '_parallel_evaluations_path' /tmp/red.log
      - name: Implement minimal bound late slot
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('quantfusion/application/c6_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = '''        "BASE_PRODUCER_EXPORT_PATH",\n        "BASE_PRODUCER_ARTIFACT_SHA256",\n    }\n)'''
          new = '''        "BASE_PRODUCER_EXPORT_PATH",\n        "BASE_PRODUCER_ARTIFACT_SHA256",\n        "PARALLEL_EVALUATIONS_PATH",\n    }\n)'''
          if old not in text:
              raise SystemExit('late-slot anchor missing')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8')

          bound = Path('quantfusion/application/c6_bound_run.py')
          text = bound.read_text(encoding='utf-8')
          anchor = '''def _git_text(arguments: list[str], *, cwd: Path) -> str:\n'''
          helper = '''def _parallel_evaluations_path(\n    binding: Mapping[str, Any], environment: Mapping[str, str]\n) -> str | None:\n    \"\"\"Resolve the R-declared parallel shard directory without touching source.\"\"\"\n    slot = "PARALLEL_EVALUATIONS_PATH"\n    declared = slot in binding["runtime_late_slots"]\n    raw = environment.get("C6_PARALLEL_EVALUATIONS_PATH", "")\n    if not raw:\n        if declared:\n            _raise("binding requires parallel evaluation artifacts")\n        return None\n    if not declared:\n        _raise("binding forbids parallel evaluation artifacts")\n    runner_raw = environment.get("RUNNER_TEMP", "")\n    runner = Path(runner_raw).resolve() if runner_raw else Path()\n    candidate = Path(raw)\n    if (\n        not runner_raw\n        or not runner.is_dir()\n        or not candidate.is_absolute()\n        or candidate.is_symlink()\n        or not candidate.is_dir()\n    ):\n        _raise("parallel evaluation artifacts require one existing directory")\n    resolved = candidate.resolve()\n    if not resolved.is_relative_to(runner):\n        _raise("parallel evaluation artifacts are outside RUNNER_TEMP")\n    return str(resolved)\n\n\n'''
          if anchor not in text:
              raise SystemExit('helper anchor missing')
          text = text.replace(anchor, helper + anchor, 1)
          old_late = '''    late_values = {\n        "RUN_BINDINGS_PATH": str(args.bindings_file.resolve()),\n        "OUTPUT_PATH": output_path.as_posix(),\n        "CHILD_CHECKPOINT_PATH": checkpoint_path.as_posix(),\n    }\n'''
          new_late = '''    late_values = {\n        "RUN_BINDINGS_PATH": str(args.bindings_file.resolve()),\n        "OUTPUT_PATH": output_path.as_posix(),\n        "CHILD_CHECKPOINT_PATH": checkpoint_path.as_posix(),\n    }\n    parallel_path = _parallel_evaluations_path(binding, os.environ)\n    if parallel_path is not None:\n        late_values["PARALLEL_EVALUATIONS_PATH"] = parallel_path\n'''
          if old_late not in text:
              raise SystemExit('late-values anchor missing')
          bound.write_text(text.replace(old_late, new_late, 1), encoding='utf-8')
          PY
      - name: Verify GREEN and affected contract modules
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/c6_non_economic/test_c6_bound_run.py \
            tests/c6_non_economic/test_c6_contract.py \
            tests/c6_non_economic/test_c6_parallel_l1.py \
            tests/c6_non_economic/test_c6_recovery_boundaries.py --tb=short
          python -m compileall -q quantfusion/application/c6_bound_run.py quantfusion/application/c6_contract.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quantfusion/application/c6_bound_run.py \
            quantfusion/application/c6_contract.py \
            tests/c6_non_economic/test_c6_bound_run.py
      - name: Publish coherent three-file change to PR63
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git add quantfusion/application/c6_bound_run.py quantfusion/application/c6_contract.py tests/c6_non_economic/test_c6_bound_run.py
          test "$(git diff --cached --name-only | sort)" = $'quantfusion/application/c6_bound_run.py\nquantfusion/application/c6_contract.py\ntests/c6_non_economic/test_c6_bound_run.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(c6): bind parallel shard artifacts through R' -m 'Add one explicit PARALLEL_EVALUATIONS_PATH runtime-late slot. It is usable only when the frozen binding declares it and only for an existing absolute directory beneath RUNNER_TEMP. Non-parallel bindings reject a supplied path. This lets the future parallel L1 workflow pass matrix artifacts without dirtying or bypassing the exact source checkout.'
          git push origin HEAD:$TARGET_BRANCH
