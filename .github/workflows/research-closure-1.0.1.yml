name: Research closure 1.0.1

on:
  push:
    branches: [tmp/research-closure-1.0.1]
    paths:
      - .github/workflows/research-closure-1.0.1.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: research-closure-1-0-1
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 1a929e9d24e4506dd5fc36fc606b0546a203c7a3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify immutable starting point and patch test fixture date
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/test_research_universe_closure.py')
          text = path.read_text(encoding='utf-8')
          old = '''    not_applicable = {"688825"}\n    dates = pd.bdate_range("2023-01-03", periods=3)\n'''
          new = '''    not_applicable = {"688825"}\n    dates = pd.bdate_range(end="2025-12-31", periods=3)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected prelisting test fixture shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Prove RED on the unmodified production source
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/unit/test_research_universe_closure.py > "$RUNNER_TEMP/red.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.txt"
          test "$status" -ne 0
          grep -q 'DID NOT RAISE' "$RUNNER_TEMP/red.txt"
          grep -q 'allow_provider_fallback' "$RUNNER_TEMP/red.txt"
          grep -q 'prelisting_not_applicable' "$RUNNER_TEMP/red.txt"
          grep -q 'active_symbol_count' "$RUNNER_TEMP/red.txt"
      - name: Apply bounded research and version repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_research_closure_1_0_1.py')
          text = path.read_text(encoding='utf-8')
          old = '    end = text.index(end_marker, start)\n'
          new = '    end = len(text) if end_marker == "__EOF__" else text.index(end_marker, start)\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected replace_block implementation')
          text = text.replace(old, new)
          old_call = '''    "def write_universe_comparison(",\n    "",\n    """def _member_coverage_text'''
          new_call = '''    "def write_universe_comparison(",\n    "__EOF__",\n    """def _member_coverage_text'''
          if text.count(old_call) != 1:
              raise SystemExit('unexpected writer replacement call')
          path.write_text(text.replace(old_call, new_call), encoding='utf-8')
          PY
          python scripts/_apply_research_closure_1_0_1.py
          rm -f \
            scripts/_apply_research_closure_1_0_1.py \
            .github/workflows/research-closure-1.0.1.yml \
            .github/workflows/actionable-boundary-research.yml \
            .github/workflows/no-waiver-boundary-study.yml \
            .github/workflows/no-waiver-joiner-study.yml \
            .github/workflows/no-waiver-source-snapshot.yml
      - name: Prove GREEN and focused contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/unit/test_research_universe_closure.py \
            tests/unit/test_research_universes.py \
            tests/unit/test_research_profile_routing.py \
            tests/unit/test_universe_comparison.py \
            tests/contract/test_repository_hygiene.py \
            tests/contract/test_current_formal_documentation.py
          python -m compileall -q quantfusion scripts tests/unit/test_research_universe_closure.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quantfusion/application/universe_comparison.py \
            quantfusion/config/research_universes.py \
            scripts/compare_universes.py \
            scripts/download_eastmoney_qfq.py \
            tests/unit/test_research_universe_closure.py
          pyright quantfusion
          bandit -r quantfusion scripts -ll
          pip-audit --strict -r requirements-lock.txt
      - name: Construct one clean main commit
        id: commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git add -A
          tree=$(git write-tree)
          final_commit=$(printf '%s\n\n%s\n' \
            'fix: close research reproducibility gaps for 1.0.1' \
            'Require source-bound research manifests, preserve explicit pre-listing N/A semantics, enable research-only index provider fallback, expose per-member observation coverage, remove obsolete research workflows, and align the maintained source version with 1.0.1 without changing strategy economics.' \
            | git commit-tree "$tree" -p "$EXPECTED_MAIN")
          git diff --name-only "$EXPECTED_MAIN" "$final_commit" | tee "$RUNNER_TEMP/changed.txt"
          if grep -Ev '^(README\.md|data/README\.md|docs/RELEASE\.md|docs/VALIDATION\.md|quantfusion/__init__\.py|quantfusion/application/universe_comparison\.py|quantfusion/config/research_universes\.py|scripts/compare_universes\.py|scripts/download_eastmoney_qfq\.py|tests/contract/test_repository_hygiene\.py|tests/unit/test_research_universe_closure\.py|\.github/workflows/(actionable-boundary-research|no-waiver-boundary-study|no-waiver-joiner-study|no-waiver-source-snapshot)\.yml)$' "$RUNNER_TEMP/changed.txt" | grep -q .; then
            echo 'unexpected file in final change set' >&2
            exit 1
          fi
          echo "sha=$final_commit" >> "$GITHUB_OUTPUT"
          git push origin "$final_commit":refs/heads/main
      - name: Require exact-main CI before release
        env:
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 30); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --branch main \
              --commit "$FINAL_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Publish immutable 1.0.1 tag and release
        env:
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --tags origin refs/tags/1.0.1)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          git tag -a 1.0.1 "$FINAL_SHA" -m 'Quant Fusion 1.0.1'
          git push origin refs/tags/1.0.1
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Quant Fusion 1.0.1

          Maintenance release for research reproducibility and release identity.

          - requires complete source-bound Pool research manifests and per-file SHA-256 verification;
          - records legitimate pre-listing symbols as explicit not-applicable instead of fabricating history;
          - enables independent fixed-index provider fallback only for the research comparison entry point;
          - reports per-member observation coverage separately from the portfolio replay calendar;
          - removes obsolete no-waiver/actionable-boundary research workflows;
          - preserves the production 17-symbol strategy, risk thresholds, transaction costs, frozen goldens, causal execution contract, and canonical economic evidence.

          The existing `1.0.0` tag remains unchanged.
          EOF
          gh release create 1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'Quant Fusion 1.0.1' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
