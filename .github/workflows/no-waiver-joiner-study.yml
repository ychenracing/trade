name: Joiner locked-runtime evidence
on:
  push:
    branches: [feat/no-waiver-joint-optimization]
    paths: [.github/workflows/no-waiver-joiner-study.yml]
permissions:
  contents: read
concurrency:
  group: no-waiver-joiner-evidence
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install unchanged locked runtime
        run: python -m pip install -r requirements-lock.txt
      - name: Restore exact research source and verify two diagnostic paths
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          repo = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'joiner-evidence'
          out.mkdir(parents=True, exist_ok=True)
          work = Path(os.environ['RUNNER_TEMP']) / 'joiner-source'
          record = repo / 'artifacts/diagnostics/no_waiver/late-joiner-preservation.json'
          item = json.loads(record.read_text())

          def command(args, cwd=repo):
              result = subprocess.run(args, cwd=cwd, text=True, capture_output=True)
              with (out / 'commands.log').open('a') as log:
                  log.write(repr(args) + '\n' + result.stdout + result.stderr + '\n')
              result.check_returncode()
              return result.stdout

          try:
              bundle = repo / 'artifacts/diagnostics/no_waiver/decision-preservation/research-source.bundle'
              assert command(['git', 'hash-object', str(bundle)]).strip() == '293c08e630e92ee9afc3ab20e5c5b62e185ba7eb'
              command(['git', 'bundle', 'verify', str(bundle)])
              command(['git', 'fetch', str(bundle), 'HEAD'])
              command(['git', 'worktree', 'add', '--detach', str(work), '4e33931bfdfaa0b11c7cdbe076c89eabe2535b76'])
              reversal = repo / 'artifacts/diagnostics/no_waiver/decision-preservation/rejected-confirmation-removal.patch'
              command(['git', 'apply', '--check', str(reversal)], work)
              command(['git', 'apply', str(reversal)], work)
              patch = out / 'joiner.patch'
              patch.write_text(item['joiner_patch'])
              command(['git', 'apply', '--check', str(patch)], work)
              command(['git', 'apply', str(patch)], work)
              assert item['tests_path'] == 'tests/unit/test_late_strategy_joiner.py'
              (work / item['tests_path']).write_text(item['tests_source'])
              identity_code = 'from quantfusion.application.stress_artifacts import _tree_fingerprint,_source_files; print(_tree_fingerprint(_source_files()))'
              assert command([sys.executable, '-c', identity_code], work).strip() == item['source_fingerprint']
              (out / 'source.patch').write_text(command(['git', 'diff', '--', 'quantfusion', 'tests'], work))
              (out / 'record.json').write_bytes(record.read_bytes())
              (out / 'runtime.txt').write_text(sys.version + '\n' + command([sys.executable, '-m', 'pip', 'freeze']))
              tests = [item['tests_path'], 'tests/unit/test_observed_shock_budget.py',
                       'tests/unit/test_event_transition_selection.py', 'tests/unit/test_atr_trend_readmission.py',
                       'tests/unit/test_risk_sell_strategy_state.py', 'tests/c6_non_economic/test_account_risk_budget.py',
                       'tests/c6_non_economic/test_c6_fixed_reference_admission.py']
              (out / 'tests.txt').write_text(command([sys.executable, '-m', 'pytest', '-q', *tests], work))
              command(['ruff', 'check', '--select=E,F,W', '--ignore=E501,E402,E731,E741',
                       'quantfusion/engine/signals.py', item['tests_path']], work)
              command(['git', 'diff', '--check'], work)
              command([sys.executable, '-m', 'artifacts.diagnostics.no_waiver.replay_batch',
                       '--root', str(work), '--out', str(out / 'raw'), '--workers', '2',
                       '--ids', 'prefix-03', 'prefix-13'], work)
              rows = json.loads((out / 'raw/results.json').read_text())
              assert rows['identity']['source_fingerprint'] == item['source_fingerprint']
              assert rows['identity']['data_fingerprint'] == item['data_fingerprint']
              assert rows['identity']['cfg_overrides'] == {}
              expected = {row[0]: row[1:] for row in item['rows']}
              comparisons = []
              for row in rows['results']:
                  actual = [1 + row['total_return'], row['max_drawdown'], row['date_symbol_side_count']]
                  comparisons.append({'scenario': row['scenario_id'], 'actual': actual,
                                      'expected': expected[row['scenario_id']],
                                      'exact_match': actual == expected[row['scenario_id']]})
              receipt = {'status': 'NOT_MET', 'canonical': False, 'default_promoted': False,
                         'host_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                         'source_record_sha256': hashlib.sha256(record.read_bytes()).hexdigest(),
                         'kind': 'New locked-runtime paired reproduction, not transfer of local originals',
                         'comparisons': comparisons}
              (out / 'replication.json').write_text(json.dumps(receipt, indent=2) + '\n')
              assert {x['scenario'] for x in comparisons} == {'prefix-03', 'prefix-13'}
              assert all(x['exact_match'] for x in comparisons), 'Runtime drift needs investigation'
          finally:
              entries = {str(p.relative_to(out)): hashlib.sha256(p.read_bytes()).hexdigest()
                         for p in sorted(out.rglob('*')) if p.is_file() and p.name != 'SHA256.json'}
              (out / 'SHA256.json').write_text(json.dumps(entries, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-waiver-joiner-${{ github.run_id }}
          path: ${{ runner.temp }}/joiner-evidence/
          retention-days: 90
          if-no-files-found: error
