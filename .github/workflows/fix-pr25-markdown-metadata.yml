name: Fix PR25 Markdown metadata handling

on:
  push:
    branches:
      - codex/formal-stress-958-consistency-closure
    paths:
      - .github/workflows/fix-pr25-markdown-metadata.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-stress-958-consistency-closure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Add focused RED contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/contract/test_repository_hygiene.py")
          text = path.read_text(encoding="utf-8")
          anchor = "    def test_markdown_prose_is_chinese(self) -> None:\n"
          test = (
              "    def test_markdown_metadata_comments_are_not_prose(self) -> None:\n"
              "        lines = _markdown_prose_lines(\n"
              "            \"<!-- CURRENT_FORMAL_STRESS_PLAN:START -->\\n\"\n"
              "            \"当前正式压力计划。\\n\"\n"
              "            \"<!-- CURRENT_FORMAL_STRESS_PLAN:END -->\\n\"\n"
              "        )\n"
              "        self.assertEqual(lines, [\"当前正式压力计划。\"])\n"
              "\n"
          )
          if test not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("markdown test insertion anchor changed")
              text = text.replace(anchor, test + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q tests/contract/test_repository_hygiene.py
          set +e
          python -m pytest -q \
            tests/contract/test_repository_hygiene.py::MarkdownConsistencyTests::test_markdown_metadata_comments_are_not_prose \
            >/tmp/markdown-red.txt 2>&1
          status=$?
          set -e
          cat /tmp/markdown-red.txt
          test "$status" -ne 0
          grep -q "AssertionError" /tmp/markdown-red.txt

      - name: Treat managed HTML comments as Markdown metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/contract/test_repository_hygiene.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        if not in_fence and stripped:\n"
              "            lines.append(stripped)\n"
          )
          new = (
              "        is_html_comment = (\n"
              "            stripped.startswith(\"<!--\") and stripped.endswith(\"-->\")\n"
              "        )\n"
              "        if not in_fence and stripped and not is_html_comment:\n"
              "            lines.append(stripped)\n"
          )
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("markdown prose helper anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify independently testable PR25 fixes
        run: |
          python -m pytest -q \
            tests/contract/test_repository_hygiene.py::MarkdownConsistencyTests::test_markdown_metadata_comments_are_not_prose \
            tests/contract/test_repository_hygiene.py::MarkdownConsistencyTests::test_markdown_prose_is_chinese
          python -m compileall -q \
            tests/contract/test_repository_hygiene.py \
            tests/contract/test_formal_stress_documentation_consistency.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            tests/contract/test_repository_hygiene.py \
            tests/contract/test_formal_stress_documentation_consistency.py

      - name: Commit coherent focused fix and remove this workflow
        run: |
          rm -f .github/workflows/fix-pr25-markdown-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: treat managed Markdown comments as metadata"
          git push origin HEAD:codex/formal-stress-958-consistency-closure
          remote="$(git ls-remote origin refs/heads/codex/formal-stress-958-consistency-closure | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
