name: Apply current-only cleanup

on:
  push:
    branches:
      - agent/ab5-recovery-cleanup-20260917
    paths:
      - .github/current_only_cleanup_apply.py
      - .github/workflows/apply-current-only-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ab5-recovery-cleanup-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Apply deterministic cleanup
        run: python .github/current_only_cleanup_apply.py
      - name: Disable removed option abbreviation
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "quantfusion/application/backtest_cli.py": (
                  '    parser = argparse.ArgumentParser(\n        description="Quant Fusion standalone backtester"\n    )',
                  '    parser = argparse.ArgumentParser(\n        description="Quant Fusion standalone backtester",\n        allow_abbrev=False,\n    )',
              ),
              "scripts/download_eastmoney_qfq.py": (
                  '    parser = argparse.ArgumentParser()',
                  '    parser = argparse.ArgumentParser(allow_abbrev=False)',
              ),
              "quantfusion/application/daily_scan.py": (
                  '    parser = argparse.ArgumentParser(description="Daily technology-sector signal scan")',
                  '    parser = argparse.ArgumentParser(\n        description="Daily technology-sector signal scan", allow_abbrev=False\n    )',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{filename}: expected one parser constructor, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Normalize safe import edits
        run: >-
          python -m ruff check --select=I,F401 --fix
          quantfusion/application/backtest_cli.py
          quantfusion/application/daily_scan.py
          scripts/download_eastmoney_qfq.py
          tests/unit/test_current_only_cli.py
          tests/unit/test_research_universes.py
          tests/integration/test_market_data_dependencies.py
          tests/integration/test_daily_regime_snapshot.py
          tests/integration/test_input_evidence_boundaries.py
          tests/integration/test_trading_day_coverage.py
      - name: Lint affected Python with repository CI contract
        run: >-
          python -m ruff check --select=E,F,W --ignore=E501,E402,E731,E741
          quantfusion/application/backtest_cli.py
          quantfusion/application/daily_scan.py
          scripts/download_eastmoney_qfq.py
          tests/unit/test_current_only_cli.py
          tests/unit/test_research_universes.py
          tests/integration/test_market_data_dependencies.py
          tests/integration/test_daily_regime_snapshot.py
          tests/integration/test_input_evidence_boundaries.py
          tests/integration/test_trading_day_coverage.py
      - name: Run affected tests
        run: >-
          python -m pytest -q
          tests/unit/test_current_only_cli.py
          tests/unit/test_research_universes.py
          tests/integration/test_market_data_dependencies.py
          tests/integration/test_daily_regime_snapshot.py
          tests/integration/test_input_evidence_boundaries.py
          tests/integration/test_trading_day_coverage.py
      - name: Remove transport-only files
        run: >-
          git rm
          .github/current_only_cleanup_apply.py
          .github/workflows/current-only-cli-test.yml
          .github/workflows/apply-current-only-cleanup.yml
      - name: Commit and push verified cleanup
        run: |
          git config user.name "trade-cleanup-bot"
          git config user.email "trade-cleanup-bot@users.noreply.github.com"
          git add quantfusion/application/backtest_cli.py quantfusion/application/daily_scan.py scripts/download_eastmoney_qfq.py tests README.md data/README.md docs/VALIDATION.md docs/RELEASE.md docs/ARCHITECTURE.md
          git diff --cached --check
          git commit -m "cleanup: remove legacy CLI and data paths"
          git push origin HEAD:agent/ab5-recovery-cleanup-20260917
