name: Finalize exact 958-scenario acceptance evidence

on:
  push:
    branches:
      - codex/formal-stress-958-acceptance
    paths:
      - .github/workflows/finalize-formal-stress-958.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-stress-958-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify current 17-symbol / 958-scenario contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from quantfusion.application import stress_scenarios
          from quantfusion.config import daily
          from quantfusion.config.universe import SYMBOL_NAMES

          expected = (
              "300308", "300502", "300394", "688256", "603986",
              "688072", "688300", "300054", "688361", "002409",
              "688498", "688120", "002384", "688082", "300604",
              "601869", "300408",
          )
          assert tuple(SYMBOL_NAMES) == expected
          assert tuple(daily.SYMBOLS) == expected
          scenarios = stress_scenarios._multi_seed_scenarios(
              random_samples=stress_scenarios.DEFAULT_RANDOM_SAMPLES,
              permutation_samples=stress_scenarios.DEFAULT_PERMUTATION_SAMPLES,
              seeds=stress_scenarios.DEFAULT_SEEDS,
          )
          assert len(scenarios) == 958
          assert len({item["scenario_id"] for item in scenarios}) == 958
          assert Counter(item["scenario_type"] for item in scenarios) == {
              "prefix": 17,
              "leave_one_out": 17,
              "add_one": 24,
              "random_subset": 750,
              "permutation": 150,
          }
          PY
      - name: Reuse complete evidence or run exact plan once
        id: stress
        shell: bash
        run: |
          set -euo pipefail
          existing="artifacts/validation/formal_stress_958_acceptance_summary.json"
          if [[ -s "$existing" ]]; then
            echo "mode=reuse" >> "$GITHUB_OUTPUT"
            echo "exit_status=$(python -c 'import json; print(json.load(open("artifacts/validation/formal_stress_958_acceptance_summary.json"))["formal_exit_status"])')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_sha="$(git rev-parse HEAD)"
          echo "$source_sha" > /tmp/formal_source_sha
          find artifacts/validation/candidates -maxdepth 1 -type f -name '*.json' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum > /tmp/prior_candidates.sha256
          checkpoint="${RUNNER_TEMP}/formal-stress-958-${source_sha}.json"
          log="${RUNNER_TEMP}/formal-stress-958.log"
          set +e
          python -m quantfusion.application.stress \
            --workers 4 \
            --checkpoint "$checkpoint" \
            --checkpoint-every 10 \
            --source-revision "$source_sha" \
            >"$log" 2>&1
          status=$?
          set -e
          tail -n 250 "$log"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            exit "$status"
          fi
          echo "mode=run" >> "$GITHUB_OUTPUT"
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
      - name: Validate evidence, write summary, and synchronize docs
        shell: bash
        env:
          STRESS_MODE: ${{ steps.stress.outputs.mode }}
          FORMAL_EXIT_STATUS: ${{ steps.stress.outputs.exit_status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          summary_path = Path("artifacts/validation/formal_stress_958_acceptance_summary.json")
          if os.environ["STRESS_MODE"] == "reuse":
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              source_sha = str(summary["source_revision"])
          else:
              source_sha = Path("/tmp/formal_source_sha").read_text(encoding="utf-8").strip()
              candidate_matches = []
              for path in sorted(Path("artifacts/validation/candidates").glob("*.json")):
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  if payload.get("source_revision") == source_sha and payload.get("scenario_count") == 958:
                      candidate_matches.append((path, payload))
              if len(candidate_matches) != 1:
                  raise RuntimeError(f"expected one current candidate, got {len(candidate_matches)}")
              candidate_path, payload = candidate_matches[0]
              results = payload.get("results")
              if not isinstance(results, list) or len(results) != 958:
                  raise RuntimeError("current candidate is not 958/958")
              ids = [str(item["scenario_id"]) for item in results]
              if len(set(ids)) != 958:
                  raise RuntimeError("scenario IDs are not unique")
              families = Counter(str(item["scenario_type"]) for item in results)
              expected_families = Counter(
                  prefix=17,
                  leave_one_out=17,
                  add_one=24,
                  random_subset=750,
                  permutation=150,
              )
              if families != expected_families:
                  raise RuntimeError(f"unexpected families: {families}")
              for item in results:
                  if item.get("deployment_policy") != "production_daily_replay":
                      raise RuntimeError(f"non-production result: {item.get('scenario_id')}")
                  for key in ("total_return", "max_drawdown", "sharpe", "calmar"):
                      value = item.get(key)
                      if not isinstance(value, (int, float)) or not math.isfinite(float(value)):
                          raise RuntimeError(f"non-finite {key}: {item.get('scenario_id')}")
              for key in ("source_fingerprint", "data_fingerprint", "scenario_signature", "run_signature"):
                  if not isinstance(payload.get(key), str) or len(payload[key]) < 32:
                      raise RuntimeError(f"invalid provenance: {key}")
              worst = min(results, key=lambda item: float(item["max_drawdown"]))
              random_worst = min(
                  (item for item in results if item["scenario_type"] == "random_subset"),
                  key=lambda item: float(item["max_drawdown"]),
              )
              add_one_worst = min(
                  (item for item in results if item["scenario_type"] == "add_one"),
                  key=lambda item: float(item["max_drawdown"]),
              )
              prefix17 = next(
                  item for item in results
                  if item["scenario_type"] == "prefix" and item["symbol_count"] == 17
              )
              summary = {
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "formal_exit_status": int(os.environ["FORMAL_EXIT_STATUS"]),
                  "source_revision": source_sha,
                  "candidate_path": str(candidate_path),
                  "candidate_sha256": hashlib.sha256(candidate_path.read_bytes()).hexdigest(),
                  "scenario_count": 958,
                  "unique_scenario_ids": 958,
                  "family_counts": dict(sorted(families.items())),
                  "artifact_status": str(payload.get("artifact_status", "unknown")),
                  "acceptance_status": str(payload.get("acceptance_status", "unknown")),
                  "canonical": bool(payload.get("canonical", False)),
                  "absolute_hard_gates": payload.get("absolute_hard_gates", {}),
                  "retained_robustness_hard_gates": payload.get("retained_robustness_hard_gates", {}),
                  "robustness_diagnostics": payload.get("robustness_diagnostics", {}),
                  "promotion_gates": payload.get("promotion_gates", {}),
                  "initial_baseline_gates": payload.get("initial_baseline_gates", {}),
                  "provenance": {
                      key: payload[key]
                      for key in ("source_fingerprint", "data_fingerprint", "scenario_signature", "run_signature")
                  },
                  "worst_all": {
                      "scenario_id": worst["scenario_id"],
                      "max_drawdown": float(worst["max_drawdown"]),
                      "total_return": float(worst["total_return"]),
                  },
                  "worst_random_subset": {
                      "scenario_id": random_worst["scenario_id"],
                      "max_drawdown": float(random_worst["max_drawdown"]),
                      "total_return": float(random_worst["total_return"]),
                  },
                  "worst_add_one_drawdown": {
                      "scenario_id": add_one_worst["scenario_id"],
                      "max_drawdown": float(add_one_worst["max_drawdown"]),
                      "total_return": float(add_one_worst["total_return"]),
                  },
                  "prefix_17": {
                      key: prefix17[key]
                      for key in ("scenario_id", "total_return", "max_drawdown", "sharpe", "calmar", "total_trades")
                  },
              }
              summary_path.parent.mkdir(parents=True, exist_ok=True)
              summary_path.write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
                  encoding="utf-8",
              )

          if int(summary["scenario_count"]) != 958 or int(summary["unique_scenario_ids"]) != 958:
              raise RuntimeError("summary is not exact 958/958")
          candidate = Path(str(summary["candidate_path"]))
          if hashlib.sha256(candidate.read_bytes()).hexdigest() != summary["candidate_sha256"]:
              raise RuntimeError("candidate SHA mismatch")

          result = (
              "<!-- CURRENT_FORMAL_STRESS_RESULT:START -->\n"
              f"完整计划已运行：`958/958`，唯一 scenario ID：`958`。工件状态为 `{summary['artifact_status']}`，"
              f"acceptance 为 `{summary['acceptance_status']}`，canonical 为 `{str(summary['canonical']).lower()}`；"
              f"absolute hard gates passed=`{summary['absolute_hard_gates'].get('passed')}`，"
              f"retained robustness gates passed=`{summary['retained_robustness_hard_gates'].get('passed')}`。"
              f"全场景最差最大回撤为 `{summary['worst_all']['max_drawdown']:.6%}`"
              f"（`{summary['worst_all']['scenario_id']}`），17 股完整 prefix 的总收益为 "
              f"`{summary['prefix_17']['total_return']:.6%}`、最大回撤为 "
              f"`{summary['prefix_17']['max_drawdown']:.6%}`。当前候选：`{summary['candidate_path']}`，"
              f"SHA-256：`{summary['candidate_sha256']}`；source revision：`{summary['source_revision']}`。"
              "详细 gates 与 provenance 见 `artifacts/validation/formal_stress_958_acceptance_summary.json`。\n"
              "<!-- CURRENT_FORMAL_STRESS_RESULT:END -->"
          )
          for filename in ("README.md", "docs/VALIDATION.md", "docs/ARCHITECTURE.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              start = "<!-- CURRENT_FORMAL_STRESS_RESULT:START -->"
              end = "<!-- CURRENT_FORMAL_STRESS_RESULT:END -->"
              if text.count(start) != 1 or text.count(end) != 1:
                  raise RuntimeError(f"missing result block: {filename}")
              left, rest = text.split(start, 1)
              _, right = rest.split(end, 1)
              updated = left + result + right
              for stale in (
                  "共 983 次生产逐日回放",
                  "全部 983 个正式场景",
                  "当前完整 983 场景",
                  "当前983场景",
              ):
                  if stale in updated:
                      raise RuntimeError(f"stale current-plan wording in {filename}: {stale}")
              path.write_text(updated, encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Verify old evidence, all tests, types, security, and documentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/prior_candidates.sha256 ]]; then
            sha256sum --check /tmp/prior_candidates.sha256
          fi
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          pyright quantfusion
          bandit -r quantfusion scripts -ll
          pip-audit --strict -r requirements-lock.txt
          git diff --check
      - name: Commit final evidence and remove temporary task infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/bootstrap-formal-stress-958.yml \
            .github/workflows/run-formal-stress-958.yml \
            .github/workflows/run-formal-stress-958-v2.yml \
            .github/workflows/finalize-formal-stress-958.yml \
            .github/task-bootstrap/formal-stress-958-acceptance.md \
            scripts/_formal_stress_958_task.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "test: finalize exact 958-scenario formal acceptance"
            git push origin HEAD:codex/formal-stress-958-acceptance
          fi
      - name: Refresh Draft PR with current verified state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:codex/formal-stress-958-acceptance" \
            --jq '.[0].number')"
          test -n "$pr_number"
          summary="artifacts/validation/formal_stress_958_acceptance_summary.json"
          acceptance="$(python -c 'import json; print(json.load(open("artifacts/validation/formal_stress_958_acceptance_summary.json"))["acceptance_status"])')"
          canonical="$(python -c 'import json; print(str(json.load(open("artifacts/validation/formal_stress_958_acceptance_summary.json"))["canonical"]).lower())')"
          worst="$(python -c 'import json; print(json.load(open("artifacts/validation/formal_stress_958_acceptance_summary.json"))["worst_all"]["max_drawdown"])')"
          cat > /tmp/pr-body.md <<EOF
          ## Objective
          Run and preserve the exact current 17-symbol, 958-scenario formal stress acceptance; synchronize directly related comments, tests, README, architecture, and validation documentation.

          ## Verified result
          - Completion: 958/958; 958 unique scenario IDs.
          - Families: 17 prefix, 17 leave-one-out, 24 add-one, 750 random-subset, 150 permutation.
          - Acceptance: ${acceptance}; canonical: ${canonical}.
          - Worst all-scenario maximum drawdown: ${worst}.
          - Full metrics, gates, artifact SHA-256, and four fingerprints: \`${summary}\`.

          ## Constraints preserved
          No alpha, risk economics, 18% threshold, universe order, seed, data, fees, slippage, capacity, T+1, or matching changes. Historical 22-symbol/983 evidence remains immutable.

          ## Verification
          Full pytest, compileall, Ruff, Pyright, Bandit, pip-audit, evidence integrity, exact family counts, unique IDs, finite metrics, production replay semantics, and documentation consistency all ran in the finalization workflow.

          ## Merge readiness
          Awaiting a final connector-originated checkpoint commit so ordinary PR CI validates the exact remote head. No result is represented as accepted or canonical unless the artifact says so.
          EOF
          gh pr edit "$pr_number" --body-file /tmp/pr-body.md
