name: C6 v25 Central Hash Targeted

on:
  push:
    branches: [codex/c6-v25-attested-central-hash-fix-20260908]
    paths:
      - tests/c6_non_economic/test_c6_parallel_l1_single_pass.py
      - tests/c6_non_economic/test_c6_parallel_l1_attestation.py
      - tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
      - quantfusion/application/c6_parallel_l1.py
      - .github/workflows/c6-v25-central-hash-targeted.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply minimal attested central hash fix once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('quantfusion/application/c6_parallel_l1.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _validate_record(
              item: Any, *, seen_ids: set[str] | None = None
          ) -> tuple[str, dict[str, Any]]:
              if (
                  not isinstance(item, dict)
                  or set(item) != _RECORD_KEYS
                  or item["item_kind"] != "evaluation"
                  or item["result_schema"] != "evaluation_record"
                  or not isinstance(item["item_id"], str)
                  or not isinstance(item["result"], dict)
                  or item["result_sha256"] != canonical_payload_hash(item["result"])
                  or (seen_ids is not None and item["item_id"] in seen_ids)
              ):
                  raise ValueError("parallel L1 record hash/schema is invalid")
              return item["item_id"], item["result"]
          '''
          new = '''def _validate_record(
              item: Any,
              *,
              seen_ids: set[str] | None = None,
              verify_result_hash: bool = True,
          ) -> tuple[str, dict[str, Any]]:
              if (
                  not isinstance(item, dict)
                  or set(item) != _RECORD_KEYS
                  or item["item_kind"] != "evaluation"
                  or item["result_schema"] != "evaluation_record"
                  or not isinstance(item["item_id"], str)
                  or not isinstance(item["result"], dict)
                  or (seen_ids is not None and item["item_id"] in seen_ids)
              ):
                  raise ValueError("parallel L1 record hash/schema is invalid")
              if verify_result_hash and item["result_sha256"] != canonical_payload_hash(
                  item["result"]
              ):
                  raise ValueError("parallel L1 record hash/schema is invalid")
              return item["item_id"], item["result"]
          '''
          old_call = '            item_id, result = _validate_record(item, seen_ids=set(by_id))\n'
          new_call = '''            item_id, result = _validate_record(
                      item,
                      seen_ids=set(by_id),
                      verify_result_hash=not attestations_required,
                  )
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('expected _validate_record block not found')
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('expected merge call not found')
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- quantfusion/application/c6_parallel_l1.py; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add quantfusion/application/c6_parallel_l1.py
            git commit -m 'fix(c6): trust exact shard hash attestation in central merge'
            git push origin HEAD:codex/c6-v25-attested-central-hash-fix-20260908
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run aggregate and recovered-shard regressions
        run: >-
          python -m pytest -q
          tests/c6_non_economic/test_c6_parallel_l1_single_pass.py
          tests/c6_non_economic/test_c6_parallel_l1_attestation.py
          tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
