name: AB5 book recovery diagnostic

on:
  push:
    branches:
      - research/ab5-book-recovery-diagnostic-20260917

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: pip install -r requirements-lock.txt
      - name: Preserve diagnostic runner
        run: cp scripts/ab5_candidate_diagnostic.py /tmp/ab5_candidate_diagnostic.py
      - name: Run candidate
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/ab5_candidate_diagnostic.py --output /tmp/candidate.json
      - name: Run frozen main base
        run: |
          git checkout --detach 85cce57e370b1d8097f2931ffc4ea76c01ae7c86
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/ab5_candidate_diagnostic.py --output /tmp/base.json
      - name: Compare candidate to base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('/tmp/base.json').read_text())
          candidate = json.loads(Path('/tmp/candidate.json').read_text())
          numeric = (
              'total_return', 'annual_return', 'sharpe', 'calmar', 'max_drawdown',
              'fills', 'sell_fills', 'date_symbol_side_buckets', 'sell_buckets',
              'turnover_over_mean_assets', 'explicit_fees', 'sell_rebuy_chains',
              'rebuy_within_20_sessions', 'rebuy_within_60_sessions',
              'pure_ab5_rebuy_within_20_sessions', 'ab5_sell_fills',
              'ab5_sell_notional',
          )
          comparison = {
              'base': base,
              'candidate': candidate,
              'candidate_minus_base': {key: candidate[key] - base[key] for key in numeric},
              'baseline_methodology_check': {
                  'sell_rebuy_chains_expected': 82,
                  'sell_rebuy_chains_actual': base['sell_rebuy_chains'],
                  'within_20_expected': 40,
                  'within_20_actual': base['rebuy_within_20_sessions'],
                  'within_60_expected': 67,
                  'within_60_actual': base['rebuy_within_60_sessions'],
                  'date_symbol_side_expected': 190,
                  'date_symbol_side_actual': base['date_symbol_side_buckets'],
              },
          }
          Path('/tmp/comparison.json').write_text(json.dumps(comparison, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(comparison, ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ab5-book-recovery-diagnostic
          path: |
            /tmp/base.json
            /tmp/candidate.json
            /tmp/comparison.json
          if-no-files-found: error
          retention-days: 7
