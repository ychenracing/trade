name: C6 v27 Relay Rebind Build

on:
  push:
    branches: [codex/c6-v27-relay-rebind-build-20260908]
    paths:
      - .github/scripts/build_c6_v27_relay.py
      - .github/workflows/c6-v27-relay-rebind-build.yml

permissions:
  contents: write

concurrency:
  group: c6-v27-relay-rebind-build-20260908
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 24682791cbe96acc69d36cd0dcfc42e69d61bcda
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1744434eac1c80bb1d74fa0d92fb13193aab9062
          path: bindings
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify immutable inputs and builder scope
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '24682791cbe96acc69d36cd0dcfc42e69d61bcda'
          test "$(git -C bindings rev-parse HEAD)" = '1744434eac1c80bb1d74fa0d92fb13193aab9062'
          remote="$(git remote get-url origin)"
          for pair in \
            'codex/c6-preregistration-v27:e02089ec12c25a8912f2adf0cf9c53f3b844069b' \
            'codex/c6-base-v27:24682791cbe96acc69d36cd0dcfc42e69d61bcda' \
            'codex/c6-s-v27:d6b06596f3280d0e8ce3573d481cae99443ae866' \
            'codex/c6-evidence-v27:1744434eac1c80bb1d74fa0d92fb13193aab9062' \
            'codex/c6-v27-workflow-anchor:3a0eb31775d633b0a8dea431207c141ae1f290cc'; do
            ref="${pair%%:*}"; sha="${pair##*:}"
            test "$(git ls-remote --refs "$remote" "refs/heads/$ref" | cut -f1)" = "$sha"
          done
          test -z "$(git ls-remote --refs "$remote" refs/heads/codex/c6-v27-relay-rebind-candidate)"
          cp .github/scripts/build_c6_v27_relay.py "$RUNNER_TEMP/build_c6_v27_relay.py"
          git checkout --detach aafaa3458c517e229db5c8ff918a58772c6298db
      - name: Build exact v27 auto-resume and stage-relay rebind
        run: |
          python "$RUNNER_TEMP/build_c6_v27_relay.py"
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/scripts/c6_auto_resume.py\n.github/scripts/c6_stage_advance.py\n.github/scripts/test_c6_stage_advance.py\n.github/workflows/c6-auto-resume.yml\n.github/workflows/c6-stage-advance.yml'
      - name: Run existing orchestration synthetic suites
        run: |
          python -I -S .github/scripts/test_c6_auto_resume.py
          python -I -S .github/scripts/test_c6_stage_advance.py "$GITHUB_WORKSPACE/source"
      - name: Create and publish validated candidate object
        run: |
          set -euo pipefail
          git add \
            .github/scripts/c6_auto_resume.py \
            .github/scripts/c6_stage_advance.py \
            .github/scripts/test_c6_stage_advance.py \
            .github/workflows/c6-auto-resume.yml \
            .github/workflows/c6-stage-advance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C6: rebind existing continuation relays to frozen v27' -m 'Rebind only the existing automatic checkpoint resume and frozen stage relay to P27/I_B27/I_S27/R27 and immutable W27. Preserve existing schedules, concurrency ownership, fail-closed result consumers and all economic contracts.'
          git rev-parse HEAD | tee "$RUNNER_TEMP/candidate-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/candidate-tree.txt"
          git push origin HEAD:refs/heads/codex/c6-v27-relay-rebind-candidate || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-v27-relay-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/candidate-tree.txt
          if-no-files-found: ignore
          retention-days: 30
