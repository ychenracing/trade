name: C6 v25 Lazy Central Targeted

on:
  push:
    branches: [codex/c6-v25-attested-central-hash-fix-20260908]
    paths:
      - .github/workflows/c6-v25-lazy-central-targeted.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Apply bounded attested merge fix
        run: python .github/scripts/c6_v25_lazy_merge_patch.py
      - name: Run affected static and behavioral checks
        run: |
          python -m py_compile \
            quantfusion/io/c6_stream.py \
            quantfusion/application/c6_parallel_l1.py \
            quantfusion/application/c6_diagnostics.py \
            tests/c6_non_economic/test_c6_parallel_l1_attestation.py
          python -m ruff check --select E9,F821,F822,F823 \
            quantfusion/io/c6_stream.py \
            quantfusion/application/c6_parallel_l1.py \
            quantfusion/application/c6_diagnostics.py \
            tests/c6_non_economic/test_c6_parallel_l1_attestation.py
          python -m pytest -q \
            tests/c6_non_economic/test_c6_parallel_l1_single_pass.py \
            tests/c6_non_economic/test_c6_parallel_l1_attestation.py \
            tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
      - name: Publish verified production and regression fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quantfusion/io/c6_stream.py quantfusion/application/c6_parallel_l1.py quantfusion/application/c6_diagnostics.py tests/c6_non_economic/test_c6_parallel_l1_attestation.py
          git commit -m 'fix(c6): keep attested central merge disk-backed'
          git push origin HEAD:codex/c6-v25-attested-central-hash-fix-20260908
