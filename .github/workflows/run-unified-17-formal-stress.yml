name: Run unified 17-symbol formal stress

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unify-17-symbol-universe
    paths:
      - .github/workflows/run-unified-17-formal-stress.yml

permissions:
  contents: write

jobs:
  formal-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-17-symbol-universe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run the exact 958-scenario formal plan
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          set +e
          python -m quantfusion.application.stress \
            --source-revision "$SOURCE_SHA" \
            --workers 4 \
            --checkpoint /tmp/unified-17-formal-stress-checkpoint.json
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 2 ]; then
            echo "Expected fail-closed rejected publication status 2, got $STATUS" >&2
            exit 1
          fi
          CANDIDATE="artifacts/validation/candidates/stress-${SOURCE_SHA}-rejected.json"
          test -f "$CANDIDATE"
          SOURCE_SHA="$SOURCE_SHA" CANDIDATE="$CANDIDATE" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          candidate_path = Path(os.environ["CANDIDATE"])
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          results = candidate.get("results")
          if not isinstance(results, list) or len(results) != 958:
              raise SystemExit("formal candidate must contain exactly 958 results")
          ids = [str(item["scenario_id"]) for item in results]
          if len(set(ids)) != 958:
              raise SystemExit("formal candidate scenario IDs must be unique")
          if candidate.get("scenario_count") != 958:
              raise SystemExit("formal candidate scenario_count must be 958")
          if candidate.get("acceptance_status") != "rejected":
              raise SystemExit("the known >18% full-universe result must remain rejected")
          if candidate.get("canonical") is not False:
              raise SystemExit("a rejected candidate must not be canonical")
          if candidate.get("source_revision") != source_sha:
              raise SystemExit("candidate source revision mismatch")
          by_id = {str(item["scenario_id"]): item for item in results}
          full = by_id.get("prefix-17")
          if full is None:
              raise SystemExit("formal plan is missing prefix-17")
          if abs(float(full["max_drawdown"]) - (-0.20499295904714276)) > 1e-12:
              raise SystemExit("prefix-17 no longer matches the verified economic baseline")
          if candidate["absolute_hard_gates"]["passed"] is not False:
              raise SystemExit("18% absolute hard gate must reject the current candidate")

          digest = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          summary = {
              "schema_version": 1,
              "status": "rejected",
              "canonical": False,
              "source_revision": source_sha,
              "candidate_path": candidate_path.as_posix(),
              "candidate_sha256": digest,
              "scenario_count": 958,
              "unique_scenario_id_count": len(set(ids)),
              "prefix_17": {
                  key: full[key]
                  for key in (
                      "total_return",
                      "max_drawdown",
                      "sharpe",
                      "calmar",
                      "total_trades",
                      "date_symbol_side_count",
                  )
              },
              "summary": candidate.get("summary"),
              "absolute_hard_gates": candidate.get("absolute_hard_gates"),
              "retained_robustness_hard_gates": candidate.get(
                  "retained_robustness_hard_gates"
              ),
              "robustness_diagnostics": candidate.get("robustness_diagnostics"),
              "promotion_gates": candidate.get("promotion_gates"),
              "rejection_reasons": candidate.get("rejection_reasons"),
              "provenance": {
                  key: candidate.get(key)
                  for key in (
                      "stress_contract_version",
                      "source_fingerprint",
                      "data_fingerprint",
                      "scenario_signature",
                      "run_signature",
                      "engine",
                      "deployment_policy",
                      "start_date",
                      "end_date",
                      "initial_capital",
                  )
              },
          }
          output = Path("artifacts/diagnostics/unified-17-formal-stress-summary.json")
          output.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          echo "adda276bea8a11b76fa6881e4e7a9770bf8cfb79bb93a397aa5aa405327358c2  artifacts/validation/candidates/stress-f5625e5b5813a5b58c52d076ad3c38e33d8b3292-rejected.json" | sha256sum --check --status
      - name: Commit rejected evidence and remove one-shot workflow
        run: |
          rm .github/workflows/run-unified-17-formal-stress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: retain rejected 17-symbol formal stress evidence"
          git push origin HEAD:codex/unify-17-symbol-universe
