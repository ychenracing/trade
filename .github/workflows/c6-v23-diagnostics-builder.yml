name: C6 v23 Diagnostics Builder

on:
  push:
    branches: [codex/c6-v23-diagnostics-builder-20260908]
    paths:
      - .github/workflows/c6-v23-diagnostics-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/c6-v23-aggregate-single-pass-red-20260908
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Apply exact diagnostics patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('quantfusion/application/c6_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if args.parallel_evaluations is not None:\n        from quantfusion.application.c6_parallel_l1 import load_parallel_evaluations\n        evaluations = load_parallel_evaluations(\n            Path(args.parallel_evaluations), prereg=prereg, binding=binding,\n            source_revision=args.source_revision, shard_count=args.parallel_shard_count,\n        )\n'''
          new = '''    if args.parallel_evaluations is not None:\n        from quantfusion.application.c6_parallel_l1 import load_parallel_evaluations\n        shard_source_revision = args.parallel_shard_source_revision or args.source_revision\n        preregistration_sha256 = hashlib.sha256(args.preregistration.read_bytes()).hexdigest()\n        evaluations = load_parallel_evaluations(\n            Path(args.parallel_evaluations), prereg=prereg, binding=binding,\n            source_revision=shard_source_revision, shard_count=args.parallel_shard_count,\n            attestations_required=args.parallel_validation_attestations_required,\n            validator_source_revision=args.source_revision,\n            preregistration_sha256=preregistration_sha256,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit('parallel load block drifted')
          text = text.replace(old, new)

          old = '''    parser.add_argument("--parallel-evaluations")\n    parser.add_argument("--parallel-shard-count", type=int)\n    parser.add_argument("--output", required=True)\n'''
          new = '''    parser.add_argument("--parallel-evaluations")\n    parser.add_argument("--parallel-shard-count", type=int)\n    parser.add_argument("--parallel-shard-source-revision")\n    parser.add_argument("--parallel-validation-attestations-required", action="store_true")\n    parser.add_argument("--output", required=True)\n'''
          if text.count(old) != 1:
              raise SystemExit('parser block drifted')
          text = text.replace(old, new)

          old = '''    parallel = args.parallel_evaluations is not None or args.parallel_shard_count is not None\n    if parallel and (args.parallel_evaluations is None or args.parallel_shard_count is None\n                     or args.parallel_shard_count < 2):\n        raise ValueError("parallel L1 requires a directory and shard_count >= 2")\n'''
          new = '''    parallel = any((\n        args.parallel_evaluations is not None,\n        args.parallel_shard_count is not None,\n        args.parallel_shard_source_revision is not None,\n        args.parallel_validation_attestations_required,\n    ))\n    if parallel and (args.parallel_evaluations is None or args.parallel_shard_count is None\n                     or args.parallel_shard_count < 2):\n        raise ValueError("parallel L1 requires a directory and shard_count >= 2")\n    if args.parallel_shard_source_revision is not None and (\n        len(args.parallel_shard_source_revision) != 40\n        or any(character not in "0123456789abcdef" for character in args.parallel_shard_source_revision)\n    ):\n        raise ValueError("parallel_shard_source_revision must be a lowercase Git SHA")\n    if args.parallel_validation_attestations_required and args.parallel_shard_source_revision is None:\n        raise ValueError("attested parallel L1 requires an explicit shard source revision")\n'''
          if text.count(old) != 1:
              raise SystemExit('parallel validation block drifted')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'quantfusion/application/c6_diagnostics.py'
      - name: Run targeted recovery tests
        run: >-
          python -m pytest -q
          tests/c6_non_economic/test_c6_parallel_l1_single_pass.py
          tests/c6_non_economic/test_c6_parallel_l1_attestation.py
          tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
          tests/c6_non_economic/test_c6_parallel_l1.py
          tests/c6_non_economic/test_c6_diagnostics.py
          --tb=short
      - name: Commit and publish exact code-only candidate
        run: |
          set -euo pipefail
          git add quantfusion/application/c6_diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(c6): bind recovered shard validation identities'
          git rev-parse HEAD | tee candidate-sha.txt
          git rev-parse HEAD^{tree} | tee candidate-tree.txt
          git push origin HEAD:refs/heads/codex/c6-v23-diagnostics-patched-20260908
