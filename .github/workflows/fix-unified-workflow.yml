name: Repair unified-universe workflow syntax

on:
  push:
    branches:
      - codex/unify-17-symbol-universe
    paths:
      - .github/workflows/fix-unified-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-17-symbol-universe
          fetch-depth: 0
      - name: Repair YAML block indentation and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-unified-17-symbol-universe.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('          Path("quantfusion/config/daily.py").write_text(')
          end = text.index('          profiles_path = Path("quantfusion/config/profiles.py")')
          replacement_lines = [
              '          Path("quantfusion/config/daily.py").write_text(',
              '              "\\n".join(',
              '                  [',
              '                      \'"""Daily scan universe and request defaults."""\',',
              '                      "",',
              '                      "from quantfusion.config.paths import REGIME_DATA_DIR",',
              '                      "from quantfusion.config.universe import SYMBOL_NAMES",',
              '                      "",',
              '                      "SYMBOLS: dict[str, str] = dict(SYMBOL_NAMES)",',
              '                      \'START_DATE = "2026-07-01"\',',
              '                      "INITIAL_CAPITAL = 2_000_000.0",',
              '                      \'DEFAULT_CACHE_DIR = "data_cache"\',',
              '                      \'DEFAULT_OUTPUT_DIR = "daily_signals"\',',
              '                      "DEFAULT_REGIME_DATA_DIR = str(REGIME_DATA_DIR)",',
              '                  ]',
              '              )',
              '              + "\\n",',
              '              encoding="utf-8",',
              '          )',
              '',
              '          Path("quantfusion/execution/priorities.py").write_text(',
              '              "\\n".join(',
              '                  [',
              '                      \'"""Stable deterministic execution priorities."""\',',
              '                      "",',
              '                      "from quantfusion.config.universe import SYMBOL_NAMES",',
              '                      "",',
              '                      "EXECUTION_PRIORITY = {",',
              '                      "    code: rank for rank, code in enumerate(SYMBOL_NAMES)",',
              '                      "}",',
              '                  ]',
              '              )',
              '              + "\\n",',
              '              encoding="utf-8",',
              '          )',
              '',
          ]
          path.write_text(
              text[:start] + '\n'.join(replacement_lines) + text[end:],
              encoding='utf-8',
          )
          Path('.github/workflows/fix-unified-workflow.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair unified-universe workflow syntax"
          git push origin HEAD:codex/unify-17-symbol-universe
