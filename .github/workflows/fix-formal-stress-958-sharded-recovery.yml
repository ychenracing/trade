name: Review sharded 958 recovery before replay

on:
  push:
    branches:
      - codex/formal-stress-958-acceptance
    paths:
      - .github/workflows/fix-formal-stress-958-sharded-recovery.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-stress-958-acceptance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Apply the reviewed recovery contract in one pass
        shell: bash
        env:
          PREFLIGHT_B64:  
          SHARD_ANCHOR_B64: 
          REVIEWED_SHARD_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(".github/workflows/run-formal-stress-958-v2.yml")
          text = path.read_text(encoding="utf-8")

          old_name = "name: Run exact 958-scenario formal acceptance v8 sharded recovery\n"
          new_name = "name: Run exact 958-scenario formal acceptance v9 reviewed sharded recovery\n"
          if text.count(old_name) != 1:
              raise SystemExit("unexpected sharded workflow name anchor")
          text = text.replace(old_name, new_name, 1)

          jobs_anchor = "jobs:\n  shard:\n"
          preflight = base64.b64decode(os.environ["PREFLIGHT_B64"]).decode()
          if text.count(jobs_anchor) != 1:
              raise SystemExit("unexpected jobs/shard anchor")
          text = text.replace(jobs_anchor, preflight, 1)

          shard_anchor = base64.b64decode(os.environ["SHARD_ANCHOR_B64"]).decode()
          reviewed_shard = base64.b64decode(
              os.environ["REVIEWED_SHARD_B64"]
          ).decode()
          if text.count(shard_anchor) != 1:
              raise SystemExit("unexpected shard validation anchor")
          text = text.replace(shard_anchor, reviewed_shard, 1)

          checkpoint_anchor = (
              '              signature=str(provenance["run_signature"]),\n'
              "              provenance=provenance,\n"
              "          )\n"
          )
          checkpoint_fix = (
              '              signature=str(provenance["run_signature"]),\n'
              "              provenance=provenance,\n"
              "              diagnostic_selection=None,\n"
              "          )\n"
          )
          if text.count(checkpoint_anchor) != 1:
              raise SystemExit("unexpected formal checkpoint call anchor")
          text = text.replace(checkpoint_anchor, checkpoint_fix, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify the patched workflow before restarting shards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/run-formal-stress-958-v2.yml")
          text = path.read_text(encoding="utf-8")
          yaml.compose(text)
          assert "diagnostic_selection=None" in text
          assert "actual_ids == expected_ids" in text
          assert "payload[field] == expected_provenance[field]" in text
          assert "needs: preflight" in text
          assert text.count(
              "name: Run exact 958-scenario formal acceptance v9"
          ) == 1
          PY
          git diff --check

      - name: Commit reviewed workflow and remove this fixer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-formal-stress-958-sharded-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: validate sharded recovery before replay"
          git push origin HEAD:codex/formal-stress-958-acceptance
          remote="$(git ls-remote origin refs/heads/codex/formal-stress-958-acceptance | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
