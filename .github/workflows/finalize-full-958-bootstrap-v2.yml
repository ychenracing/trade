name: Finalize full 958 stress task bootstrap v2

on:
  push:
    branches:
      - codex/full-958-stress-acceptance
    paths:
      - .github/workflows/finalize-full-958-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-958-stress-acceptance
          fetch-depth: 0
      - name: Persist exact verified branch-point SHA and close bootstrap
        run: |
          git fetch origin main
          baseline_sha="$(git merge-base HEAD origin/main)"
          BASELINE_SHA="$baseline_sha" python - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/task-bootstrap/full-958-stress-acceptance.md')
          text = path.read_text(encoding='utf-8')
          placeholder = 'PENDING_BOOTSTRAP_RESOLUTION'
          if text.count(placeholder) != 1:
              raise SystemExit('bootstrap placeholder is missing or duplicated')
          updated = text.replace(placeholder, os.environ['BASELINE_SHA'])
          path.write_text(updated, encoding='utf-8')
          if os.environ['BASELINE_SHA'] not in updated:
              raise SystemExit('exact baseline SHA was not persisted')
          PY
          rm \
            .github/workflows/finalize-full-958-bootstrap.yml \
            .github/workflows/finalize-full-958-bootstrap-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record full 958 stress task checkpoint"
          git push origin HEAD:codex/full-958-stress-acceptance
