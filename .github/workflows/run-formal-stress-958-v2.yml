name: Run exact 958-scenario formal acceptance v5

on:
  push:
    branches:
      - codex/formal-stress-958-acceptance
    paths:
      - .github/workflows/run-formal-stress-958-v2.yml

permissions:
  contents: write

concurrency:
  group: formal-stress-958-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-stress-958-acceptance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Verify merged main and prepare current contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/task-bootstrap/formal-stress-958-acceptance.md
          test -f scripts/_formal_stress_958_task
          git fetch origin main
          git merge-base --is-ancestor 88690b2cb1db8803c8f6cc48f774eebe9db40b9e HEAD
          PYTHONPATH=. python scripts/_formal_stress_958_task prepare
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          artifact = json.loads(
              (ROOT / 'artifacts/validation/universe_backtest.json').read_text(
                  encoding='utf-8'
              )
          )
          results = artifact['results']
          universes = (
              ('1_symbol', '1'),
              ('3_symbols', '3'),
              ('5_symbols', '5'),
              ('13_symbols', '13'),
              ('17_symbols', '17'),
          )

          def selected(name: str, state: str) -> dict[str, object]:
              matches = [
                  item
                  for item in results
                  if item.get('universe') == name
                  and item.get('indicator_state') == state
                  and item.get('end_date') == '2026-07-20'
              ]
              if len(matches) != 1:
                  raise RuntimeError(
                      f'expected one {name}/{state}/2026-07-20 result, got {len(matches)}'
                  )
              return matches[0]

          warm = {label: selected(name, 'warm') for name, label in universes}
          cold = {label: selected(name, 'cold') for name, label in universes}

          def pct(value: object) -> str:
              return f'{float(value):.4%}'

          def replace_required(text: str, old: str, new: str) -> str:
              if old in text:
                  return text.replace(old, new)
              if new in text:
                  return text
              raise RuntimeError(f'missing expected documentation text: {old[:80]!r}')

          def replace_table(text: str, heading: str, header: str, table: str) -> str:
              heading_index = text.index(heading)
              table_start = text.index(header, heading_index)
              table_end = text.index('\n\n', table_start)
              return text[:table_start] + table.rstrip() + text[table_end:]

          baseline_header = (
              '| 股票数量 | 总收益 | 最大回撤 | 实际成交记录 | 日期/股票/方向桶 |\n'
              '|---:|---:|---:|---:|---:|'
          )
          baseline_rows = [baseline_header]
          for _, label in universes:
              item = warm[label]
              baseline_rows.append(
                  f"| {label} | {pct(item['total_return'])} | "
                  f"{pct(item['max_drawdown'])} | {int(item['total_trades'])} | "
                  f"{int(item['date_symbol_side_count'])} |"
              )
          baseline_table = '\n'.join(baseline_rows)

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_required(readme, '1/3/5/13/22 只股票池', '1/3/5/13/17 只股票池')
          readme = replace_required(
              readme,
              '定位问题时可用 `--scenario-id add-one-05-688205`',
              '定位问题时可用 `--scenario-id add-one-05-688072`',
          )
          readme = replace_required(
              readme,
              '  --scenario-id add-one-05-688205 \\\n  --diagnostic-output artifacts/diagnostics/add-one-05-688205.json',
              '  --scenario-id add-one-05-688072 \\\n  --diagnostic-output artifacts/diagnostics/add-one-05-688072.json',
          )
          readme = replace_table(
              readme,
              '## 已验证基线',
              '| 股票数量 | 总收益 | 最大回撤 | 实际成交记录 | 日期/股票/方向桶 |',
              baseline_table,
          )
          readme_path.write_text(readme, encoding='utf-8')

          validation_path = ROOT / 'docs/VALIDATION.md'
          validation = validation_path.read_text(encoding='utf-8')
          summary_sentence = (
              '当前默认配置在 2025-04-01 至 2026-07-20 的冻结牛市样本中，'
              '1/3/5/13/17 股池分别取得 '
              + '、'.join(pct(warm[label]['total_return']) for _, label in universes)
              + ' 总收益。当前实现的聚合指标和经济事件序列均受冻结基线保护。'
          )
          validation = replace_required(
              validation,
              '当前默认配置在 2025-04-01 至 2026-07-20 的冻结牛市样本中，'
              '1/3/5/13/22 股池分别取得 530.8950%、1059.3890%、1226.3702%、'
              '1039.0505% 和 1052.7670% 总收益。当前实现的聚合指标和经济事件序列'
              '均受冻结基线保护。',
              summary_sentence,
          )
          validation = replace_table(
              validation,
              '## 生产趋势基线',
              '| 股票数量 | 总收益 | 最大回撤 | 实际成交记录 | 日期/股票/方向桶 |',
              baseline_table,
          )

          cold_header = (
              '| 股票数量 | 冷启动收益 | 冷启动回撤 | 成交记录/侧桶 | '
              '预热收益 | 预热回撤 | 成交记录/侧桶 |\n'
              '|---:|---:|---:|---:|---:|---:|---:|'
          )
          cold_rows = [cold_header]
          for _, label in universes:
              cold_item = cold[label]
              warm_item = warm[label]
              cold_rows.append(
                  f"| {label} | {pct(cold_item['total_return'])} | "
                  f"{pct(cold_item['max_drawdown'])} | "
                  f"{int(cold_item['total_trades'])} / "
                  f"{int(cold_item['date_symbol_side_count'])} | "
                  f"{pct(warm_item['total_return'])} | "
                  f"{pct(warm_item['max_drawdown'])} | "
                  f"{int(warm_item['total_trades'])} / "
                  f"{int(warm_item['date_symbol_side_count'])} |"
              )
          validation = replace_table(
              validation,
              '## 冷启动与预热',
              '| 股票数量 | 冷启动收益 | 冷启动回撤 | 成交记录/侧桶 |',
              '\n'.join(cold_rows),
          )

          one = warm['1']
          five = warm['5']
          old_route_intro = (
              '2024-01-02 至 2024-12-31 的五股 `ProductionReplayEngine` 逐日回放取得 '
              '52.2276% 收益、-17.2195% 最大回撤和 18 条成交记录。动态弱势持仓完整'
              '参与组合、板块和路由清算。牛市生产回放不会重复执行外层和叠加层风控：'
              '1 股和 5 股结果分别与趋势生产基线完全一致。'
          )
          new_route_intro = (
              '2024-01-02 至 2024-12-31 的历史五股弱市 `ProductionReplayEngine` '
              '逐日回放取得 52.2276% 收益、-17.2195% 最大回撤和 18 条成交记录。'
              '动态弱势持仓完整参与组合、板块和路由清算。当前牛市生产回放不会重复'
              '执行外层和叠加层风控：1 股和 5 股结果分别与当前趋势生产基线完全一致。'
          )
          validation = replace_required(validation, old_route_intro, new_route_intro)
          route_table = '\n'.join(
              (
                  '| 场景 | 总收益 | 最大回撤 | 实际成交记录 | 日期/股票/方向桶 | 说明 |',
                  '|---|---:|---:|---:|---:|---|',
                  '| 2024 历史五股弱市 | 52.2276% | -17.2195% | 18 | 18 | '
                  '空仓进入弱市，启用冻结龙头账本并接受统一清算 |',
                  f"| 2025—2026 一股牛市 | {pct(one['total_return'])} | "
                  f"{pct(one['max_drawdown'])} | {int(one['total_trades'])} | "
                  f"{int(one['date_symbol_side_count'])} | 与当前趋势基线完全一致 |",
                  f"| 2025—2026 五股牛市 | {pct(five['total_return'])} | "
                  f"{pct(five['max_drawdown'])} | {int(five['total_trades'])} | "
                  f"{int(five['date_symbol_side_count'])} | 与当前趋势基线完全一致 |",
              )
          )
          validation = replace_table(
              validation,
              '## 生产逐日路由验证',
              '| 场景 | 总收益 | 最大回撤 | 实际成交记录 | 日期/股票/方向桶 | 说明 |',
              route_table,
          )
          validation = replace_required(
              validation,
              '只有显式首基线动作、精确 canonical 983、当前语义参考工件',
              '只有显式首基线动作、精确 canonical 958、当前语义参考工件',
          )
          validation = replace_required(
              validation,
              '只有未经筛选且与 canonical 默认场景签名精确相等的 983 场景计划',
              '只有未经筛选且与 canonical 默认场景签名精确相等的 958 场景计划',
          )
          validation = replace_required(
              validation,
              '该 PR 未选择生产风控实现、未运行新的 canonical 983，也未建立 v2 baseline。',
              '该历史研究未选择生产风控实现，也未建立当时的 v2 baseline。',
          )
          validation_path.write_text(validation, encoding='utf-8')

          data_readme_path = ROOT / 'data/README.md'
          data_readme = data_readme_path.read_text(encoding='utf-8')
          data_readme = replace_required(
              data_readme,
              '- `market/`：22 只生产股票及寒武纪（`688256`）专项验证样本的前复权日线、'
              '`manifest.json` 与 `SHA256SUMS`；',
              '- `market/`：当前 17 只交易股票所需的冻结前复权日线，以及不再属于默认'
              '交易池但仍供历史研究审计的样本、`manifest.json` 与 `SHA256SUMS`；',
          )
          data_readme_path.write_text(data_readme, encoding='utf-8')

          test_path = ROOT / 'tests/contract/test_current_formal_documentation.py'
          test_path.write_text(
              '''"""Current 17-symbol baseline and formal-stress documentation contracts."""

from __future__ import annotations

import json
from pathlib import Path


ROOT = Path(__file__).resolve().parents[2]
UNIVERSES = (
    ("1_symbol", "1"),
    ("3_symbols", "3"),
    ("5_symbols", "5"),
    ("13_symbols", "13"),
    ("17_symbols", "17"),
)


def _warm_result(name: str) -> dict[str, object]:
    payload = json.loads(
        (ROOT / "artifacts/validation/universe_backtest.json").read_text(
            encoding="utf-8"
        )
    )
    matches = [
        item
        for item in payload["results"]
        if item.get("universe") == name
        and item.get("indicator_state") == "warm"
        and item.get("end_date") == "2026-07-20"
    ]
    assert len(matches) == 1
    return matches[0]


def test_current_baseline_tables_match_the_frozen_artifact() -> None:
    readme = (ROOT / "README.md").read_text(encoding="utf-8")
    validation = (ROOT / "docs/VALIDATION.md").read_text(encoding="utf-8")
    for name, label in UNIVERSES:
        item = _warm_result(name)
        row = (
            f"| {label} | {float(item['total_return']):.4%} | "
            f"{float(item['max_drawdown']):.4%} | "
            f"{int(item['total_trades'])} | "
            f"{int(item['date_symbol_side_count'])} |"
        )
        assert row in readme
        assert row in validation


def test_current_plan_wording_is_not_mixed_with_historical_983_evidence() -> None:
    readme = (ROOT / "README.md").read_text(encoding="utf-8")
    validation = (ROOT / "docs/VALIDATION.md").read_text(encoding="utf-8")
    architecture = (ROOT / "docs/ARCHITECTURE.md").read_text(encoding="utf-8")
    data_readme = (ROOT / "data/README.md").read_text(encoding="utf-8")
    combined_current = "\n".join((readme, validation, architecture))
    assert "1/3/5/13/22" not in combined_current
    assert "共 983 次生产逐日回放" not in combined_current
    assert "全部 983 个正式场景" not in combined_current
    assert "精确 canonical 983" not in validation
    assert "983 场景计划能够进入正式发布校验" not in validation
    assert "add-one-05-688072" in readme
    assert "当前 17 只交易股票" in data_readme
    assert "历史 22 股完整 983 场景" in validation


def test_final_result_block_replaces_pending_text_after_publication() -> None:
    summary = ROOT / "artifacts/validation/formal_stress_958_acceptance_summary.json"
    if not summary.exists():
        return
    for relative in ("README.md", "docs/VALIDATION.md", "docs/ARCHITECTURE.md"):
        text = (ROOT / relative).read_text(encoding="utf-8")
        assert "完整 958 场景尚未在本次任务中形成最终工件" not in text
        assert "完整计划已运行：`958/958`" in text
''',
              encoding='utf-8',
          )
          PY
          python -m pytest -q \
            tests/unit/test_current_formal_stress_plan.py \
            tests/contract/test_current_formal_documentation.py \
            tests/unit/test_stress_sampling_capacity.py \
            tests/unit/test_stress_scenarios.py
          python -m compileall -q \
            quantfusion \
            tests/unit/test_current_formal_stress_plan.py \
            tests/contract/test_current_formal_documentation.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quantfusion \
            tests/unit/test_current_formal_stress_plan.py \
            tests/contract/test_current_formal_documentation.py

      - name: Commit stable pre-run source and documentation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/README.md docs/VALIDATION.md docs/ARCHITECTURE.md \
            tests/unit/test_current_formal_stress_plan.py \
            tests/contract/test_current_formal_documentation.py
          if ! git diff --cached --quiet; then
            git commit -m "docs: align current 17-symbol validation evidence"
            git push origin HEAD:codex/formal-stress-958-acceptance
          fi
          source_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$source_sha" > /tmp/formal_source_sha
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "formal_source_sha=$source_sha"
          PYTHONPATH=. python scripts/_formal_stress_958_task snapshot-prior \
            --output /tmp/prior_candidate_hashes.json

      - name: Run exact complete 958-scenario formal plan once
        id: stress
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/formal_source_sha)"
          checkpoint="${RUNNER_TEMP}/formal-stress-958-${source_sha}.json"
          log="${RUNNER_TEMP}/formal-stress-958.log"
          set +e
          python -m quantfusion.application.stress \
            --workers 4 \
            --checkpoint "$checkpoint" \
            --checkpoint-every 10 \
            --source-revision "$source_sha" \
            >"$log" 2>&1
          status=$?
          set -e
          tail -n 250 "$log"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            echo "Unexpected formal stress exit status: $status" >&2
            exit "$status"
          fi
          echo "formal_exit_status=$status" >> "$GITHUB_OUTPUT"

      - name: Preserve raw exact-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: formal-stress-958-${{ steps.source.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/formal-stress-958-${{ steps.source.outputs.source_sha }}.json
            ${{ runner.temp }}/formal-stress-958.log
            artifacts/validation/candidates/stress-${{ steps.source.outputs.source_sha }}-rejected.json
            artifacts/validation/prefix_stress.json
            artifacts/validation/universe_stress.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate complete evidence and update result documentation
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/formal_source_sha)"
          PYTHONPATH=. python scripts/_formal_stress_958_task finalize \
            --source-sha "$source_sha" \
            --prior-hashes /tmp/prior_candidate_hashes.json \
            --exit-status "${{ steps.stress.outputs.formal_exit_status }}"
          if ! git diff --quiet "$source_sha" -- quantfusion '*.py'; then
            echo "Fingerprint-relevant Python source changed after source revision" >&2
            git diff "$source_sha" -- quantfusion '*.py'
            exit 1
          fi

      - name: Remove temporary task infrastructure before final verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/bootstrap-formal-stress-958.yml \
            .github/workflows/run-formal-stress-958.yml \
            .github/workflows/run-formal-stress-958-v2.yml \
            .github/task-bootstrap/formal-stress-958-acceptance.md \
            scripts/_formal_stress_958_task \
            scripts/_formal_stress_958_task.py

      - name: Run complete engineering verification on final tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          pyright quantfusion
          bandit -r quantfusion scripts -ll
          pip-audit --strict -r requirements-lock.txt
          git diff --check

      - name: Commit complete evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Expected final evidence and cleanup changes" >&2
            exit 1
          fi
          git commit -m "test: record exact 958-scenario formal acceptance"
          git push origin HEAD:codex/formal-stress-958-acceptance
