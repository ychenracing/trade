name: No-waiver boundary evidence

on:
  push:
    branches: [feat/no-waiver-joint-optimization]
    paths:
      - .github/workflows/no-waiver-boundary-study.yml
      - artifacts/diagnostics/no_waiver/boundary_replay.py
      - tests/unit/test_boundary_observer.py

permissions:
  contents: read

concurrency:
  group: no-waiver-boundary-evidence
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [reference, reversal]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install existing locked dependencies and check observer
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pytest -q tests/unit/test_boundary_observer.py
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 artifacts/diagnostics/no_waiver/boundary_replay.py tests/unit/test_boundary_observer.py
      - name: Recover source without changing production files
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          bundle=artifacts/diagnostics/no_waiver/decision-preservation/research-source.bundle
          test "$(git hash-object "$bundle")" = 293c08e630e92ee9afc3ab20e5c5b62e185ba7eb
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          test "$(git rev-parse 4e33931bfdfaa0b11c7cdbe076c89eabe2535b76^{tree})" = c521380be962794e536117c0a97b155b1dc06935
          if [ "$SOURCE" = reference ]; then
            git worktree add --detach "$RUNNER_TEMP/replay-source" 86fd22448b9aad9d5e6194c0c065c40d56d7bddd
          else
            git worktree add --detach "$RUNNER_TEMP/replay-source" 4e33931bfdfaa0b11c7cdbe076c89eabe2535b76
            git -C "$RUNNER_TEMP/replay-source" apply "$GITHUB_WORKSPACE/artifacts/diagnostics/no_waiver/decision-preservation/rejected-confirmation-removal.patch"
          fi
      - name: New read-only boundary traces, never formal acceptance
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/boundary-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/boundary-evidence/observer-owner-HEAD.txt"
          cp artifacts/diagnostics/no_waiver/boundary_replay.py tests/unit/test_boundary_observer.py requirements-lock.txt "$RUNNER_TEMP/boundary-evidence/"
          python -m pip freeze > "$RUNNER_TEMP/boundary-evidence/dependencies.txt"
          if [ "$SOURCE" = reference ]; then
            fingerprint=5e94ba6a8be97c10ae94e8363b22477a22a2318cf030d529c9886248303098aa
            scenarios='prefix-01 prefix-13'
          else
            fingerprint=a22f14c2f1e47b5bcc70618b4af07c074aa90b97e9e72321575fdf54a1a75c83
            scenarios='prefix-01 prefix-13 random-20260817-03-027'
          fi
          python -m artifacts.diagnostics.no_waiver.boundary_replay --root "$RUNNER_TEMP/replay-source" --out "$RUNNER_TEMP/boundary-evidence/raw" --source-fingerprint "$fingerprint" --ids $scenarios 2>&1 | tee "$RUNNER_TEMP/boundary-evidence/replay.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-waiver-boundaries-${{ matrix.source }}-${{ github.run_id }}
          path: ${{ runner.temp }}/boundary-evidence/
          retention-days: 90
          if-no-files-found: error
