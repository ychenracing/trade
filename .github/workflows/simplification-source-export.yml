name: Simplification source export
on:
  push:
    branches: [codex/trade-simplification-source-export-20260912]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 24abb4706bd269cb5e1c23bb797cd0b417202c9e
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact historical objects needed by retained evidence
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 24abb4706bd269cb5e1c23bb797cd0b417202c9e
          test "$(git rev-parse HEAD^{tree})" = 2db23a481789061d3076e509e9740becc9cf783b
          mkdir -p "$RUNNER_TEMP/trade-source"
          git fetch --no-tags origin 4659a2b6d265f45256777da6a2fc25d1369308bd
          test "$(git rev-parse FETCH_HEAD)" = 4659a2b6d265f45256777da6a2fc25d1369308bd
          git cat-file -e 4659a2b6d265f45256777da6a2fc25d1369308bd:artifacts/diagnostics/c6-preregistration.json
          git bundle create "$RUNNER_TEMP/trade-source/trade.bundle" HEAD FETCH_HEAD
          git bundle verify "$RUNNER_TEMP/trade-source/trade.bundle"
          cd "$RUNNER_TEMP/trade-source"
          sha256sum trade.bundle > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: trade-simplification-preregistration-source
          path: ${{ runner.temp }}/trade-source/
          retention-days: 7
          if-no-files-found: error
