name: C6 Flow-Fix Transition Evidence Publish

on:
  push:
    branches: [codex/c6-flowfix-transition-reference-evidence]
    paths: [.github/workflows/c6-flowfix-transition-evidence-publish.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: c6-flowfix-transition-reference-evidence
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '34087817539'
  SOURCE_SHA: 86fd22448b9aad9d5e6194c0c065c40d56d7bddd
  ARTIFACT_NAME: c6-flowfix-transition-reference-34087817539
  CANDIDATE_SHA256: ffe023ae48de50225870c220d37208d1d1ee6c26ba6905a470093562153decbe
  TARGET: artifacts/validation/candidates/stress-86fd22448b9aad9d5e6194c0c065c40d56d7bddd-rejected.json

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: evidence
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify and materialize exact reference
        run: |
          set -euo pipefail
          source_path="evidence/stress-${SOURCE_SHA}-rejected.json"
          test -f "$source_path"
          test "$(sha256sum "$source_path" | cut -d' ' -f1)" = "$CANDIDATE_SHA256"
          python - "$source_path" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['source_revision']=='86fd22448b9aad9d5e6194c0c065c40d56d7bddd'
          assert p['scenario_count']==958 and len(p['results'])==958
          assert len({r['scenario_id'] for r in p['results']})==958
          assert p['acceptance_status']=='rejected' and p['canonical'] is False
          assert p['artifact_status']=='current_candidate'
          assert p['data_fingerprint']=='aeeb96a94e84830033e8ad11180293fc982bb08e99322054d2c27dbb3f4b5975'
          assert p['scenario_signature']=='29be14d97ffa4249455a0e70ae42df74e4567609c3576250e659c4281fd94880'
          PY
          mkdir -p "$(dirname "$TARGET")"
          cp "$source_path" "$TARGET"
          test "$(sha256sum "$TARGET" | cut -d' ' -f1)" = "$CANDIDATE_SHA256"
      - name: Commit evidence only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/c6-flowfix-transition-reference-evidence"
          git status --short
          git diff --exit-code -- . ':!.github/workflows/c6-flowfix-transition-evidence-publish.yml' || true
          git add "$TARGET"
          test "$(git diff --cached --name-only)" = "$TARGET"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence(c6): retain flow-corrected transition reference'
          git push origin HEAD:codex/c6-flowfix-transition-reference-evidence
