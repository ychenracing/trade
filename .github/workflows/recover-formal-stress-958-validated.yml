name: Recover validated exact 958 evidence from shards

on:
  push:
    branches:
      - codex/formal-stress-958-acceptance
    paths:
      - .github/workflows/recover-formal-stress-958-validated.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: formal-stress-958-validated-recovery
  cancel-in-progress: false

env:
  SOURCE_SHA: acf4cccf4117edb35e6beb57aa2f9004476c8b93
  SOURCE_RUN_ID: "33767142820"
  SHARD_COUNT: "12"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Wait for the existing shard run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          for _ in $(seq 1 240); do
            status="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
              break
            fi
            sleep 10
          done
          test "$status" = "completed"
          echo "Source run conclusion: $conclusion"

      - name: Download all exact shard artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ychenracing/trade
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: formal-stress-958-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Independently validate shards and reconstruct formal checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/_formal_stress_958_sharded_recovery.py preflight \
            --source-sha "$SOURCE_SHA" \
            --shard-count "$SHARD_COUNT"
          PYTHONPATH=. python scripts/_formal_stress_958_task snapshot-prior \
            --output "${RUNNER_TEMP}/prior-candidate-hashes.json"
          PYTHONPATH=. python scripts/_formal_stress_958_sharded_recovery.py aggregate \
            --source-sha "$SOURCE_SHA" \
            --shard-count "$SHARD_COUNT" \
            --input-dir "${RUNNER_TEMP}/shards" \
            --output "${RUNNER_TEMP}/formal-stress-958-checkpoint.json"

      - name: Publish through the unfiltered production entry point without replay
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/formal-stress-958-publish.log"
          set +e
          python -m quantfusion.application.stress \
            --workers 1 \
            --checkpoint "${RUNNER_TEMP}/formal-stress-958-checkpoint.json" \
            --checkpoint-every 10 \
            --source-revision "$SOURCE_SHA" \
            >"$log" 2>&1
          status=$?
          set -e
          tail -n 250 "$log"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            echo "Unexpected production publisher exit status: $status" >&2
            exit "$status"
          fi
          printf '%s\n' "$status" >"${RUNNER_TEMP}/formal-exit-status"
          PYTHONPATH=. python scripts/_formal_stress_958_task finalize \
            --source-sha "$SOURCE_SHA" \
            --prior-hashes "${RUNNER_TEMP}/prior-candidate-hashes.json" \
            --exit-status "$status"
          PYTHONPATH=. python scripts/_formal_stress_958_sharded_recovery.py validate-final \
            --source-sha "$SOURCE_SHA" \
            --shard-count "$SHARD_COUNT" \
            --summary artifacts/validation/formal_stress_958_acceptance_summary.json \
            --candidate-copy "${RUNNER_TEMP}/formal-stress-958-candidate.json"

      - name: Upload independently validated exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: formal-stress-958-validated-${{ env.SOURCE_SHA }}
          path: |
            artifacts/validation/formal_stress_958_acceptance_summary.json
            ${{ runner.temp }}/formal-stress-958-candidate.json
            ${{ runner.temp }}/formal-stress-958-checkpoint.json
            ${{ runner.temp }}/formal-stress-958-publish.log
            ${{ runner.temp }}/formal-exit-status
          if-no-files-found: error
          retention-days: 30

      - name: Remove non-workflow task scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/task-bootstrap/formal-stress-958-acceptance.md \
            artifacts/validation/formal_stress_958_remote_checkpoint.md \
            scripts/_formal_stress_958_task \
            scripts/_formal_stress_958_task.py \
            scripts/_formal_stress_958_docs \
            scripts/_formal_stress_958_generated_test_fix \
            scripts/_formal_stress_958_sharded_recovery.py

      - name: Verify the final non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          pyright quantfusion
          bandit -r quantfusion scripts -ll
          pip-audit --strict -r requirements-lock.txt
          git diff --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          summary_path = Path(
              "artifacts/validation/formal_stress_958_acceptance_summary.json"
          )
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          assert summary["source_revision"] == "acf4cccf4117edb35e6beb57aa2f9004476c8b93"
          assert summary["scenario_count"] == 958
          assert summary["unique_scenario_ids"] == 958
          assert summary["formal_exit_status"] in {0, 2}
          candidate = Path(summary["candidate_path"])
          assert candidate.is_file()
          assert hashlib.sha256(candidate.read_bytes()).hexdigest() == summary[
              "candidate_sha256"
          ]
          if summary["formal_exit_status"] == 2:
              assert summary["acceptance_status"] == "rejected"
              assert summary["canonical"] is False
          PY

      - name: Commit and push the recoverable evidence checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . \
            ':(exclude).github/workflows' \
            ':(exclude).github/workflows/**'
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Workflow files must be cleaned by a human-authored commit" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Expected formal evidence and task cleanup changes" >&2
            exit 1
          fi
          git commit -m "test: record exact 958-scenario formal evidence"
          git push origin HEAD:codex/formal-stress-958-acceptance
          remote="$(git ls-remote origin refs/heads/codex/formal-stress-958-acceptance | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
