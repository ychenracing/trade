name: Converge known unified 17-symbol failures

on:
  push:
    branches:
      - codex/unify-17-symbol-universe
    paths:
      - .github/workflows/fix-unified-17-ci.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-17-symbol-universe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Apply verified current-universe fixes idempotently
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          hygiene_path = Path("tests/contract/test_repository_hygiene.py")
          hygiene = hygiene_path.read_text(encoding="utf-8")
          stale_hygiene = '            self.assertIn(str(len(codes)), {"1", "3", "5", "13", "22"})\n'
          if stale_hygiene in hygiene:
              hygiene = hygiene.replace(stale_hygiene, "", 1)
          hygiene_path.write_text(hygiene, encoding="utf-8")

          cli_path = Path("tests/integration/test_daily_cli.py")
          cli = cli_path.read_text(encoding="utf-8")
          universe_import = "from quantfusion.config.universe import ORDERED_SYMBOLS\n"
          if universe_import not in cli:
              import_anchor = "from quantfusion.config.profiles import uses_unmapped_auto_route\n"
              if cli.count(import_anchor) != 1:
                  raise SystemExit("daily CLI import anchor changed")
              cli = cli.replace(import_anchor, import_anchor + universe_import, 1)
          cli = cli.replace(
              "def test_all_26_symbols_are_mapped",
              "def test_all_symbols_are_mapped",
              1,
          )
          old_count = (
              "    def test_symbol_count_is_26(self) -> None:\n"
              "        self.assertEqual(len(dss.SYMBOLS), 26)\n"
          )
          new_count = (
              "    def test_symbol_order_matches_authoritative_universe(self) -> None:\n"
              "        self.assertEqual(tuple(dss.SYMBOLS), ORDERED_SYMBOLS)\n"
              "\n"
              "    def test_scan_title_matches_current_universe(self) -> None:\n"
              "        self.assertEqual(\n"
              "            dss._scan_title(),\n"
              "            f\"AI 板块 {len(dss.SYMBOLS)} 标的每日信号扫描\",\n"
              "        )\n"
          )
          if old_count in cli:
              cli = cli.replace(old_count, new_count, 1)
          elif "def test_symbol_order_matches_authoritative_universe" not in cli:
              raise SystemExit("daily CLI symbol-count contract changed unexpectedly")
          cli_path.write_text(cli, encoding="utf-8")

          scan_path = Path("quantfusion/application/daily_scan.py")
          scan = scan_path.read_text(encoding="utf-8")
          if "def _scan_title()" not in scan:
              anchor = (
                  "_validate_risk_state = validate_risk_state\n"
                  "\n"
                  "def _run_main() -> int:\n"
              )
              replacement = (
                  "_validate_risk_state = validate_risk_state\n"
                  "\n\n"
                  "def _scan_title() -> str:\n"
                  "    return f\"AI 板块 {len(SYMBOLS)} 标的每日信号扫描\"\n"
                  "\n\n"
                  "def _run_main() -> int:\n"
              )
              if scan.count(anchor) != 1:
                  raise SystemExit("daily-scan title helper anchor changed")
              scan = scan.replace(anchor, replacement, 1)
          stale_title = '    print("  AI 板块 26 标的每日信号扫描")\n'
          dynamic_title = '    print(f"  {_scan_title()}")\n'
          if stale_title in scan:
              scan = scan.replace(stale_title, dynamic_title, 1)
          elif dynamic_title not in scan:
              raise SystemExit("daily-scan title print changed unexpectedly")
          scan_path.write_text(scan, encoding="utf-8")
          PYCODE
      - name: Verify repaired failure contracts
        run: |
          python -m pytest -q \
            tests/contract/test_repository_hygiene.py::RepositoryHygieneTests::test_validation_script_reads_the_single_golden_metrics_source \
            tests/integration/test_daily_cli.py::CLIArgumentTests::test_all_symbols_are_mapped \
            tests/integration/test_daily_cli.py::CLIArgumentTests::test_symbol_order_matches_authoritative_universe \
            tests/integration/test_daily_cli.py::CLIArgumentTests::test_scan_title_matches_current_universe
      - name: Verify final engineering candidate
        run: |
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          python -m pytest -q
          pyright quantfusion
      - name: Commit coherent fix and remove temporary task machinery
        run: |
          rm -f \
            .github/workflows/finalize-unified-17-symbol-universe.yml \
            .github/workflows/fix-unified-17-ci.yml \
            .github/workflows/run-unified-17-formal-stress.yml \
            .github/workflows/run-unified-17-symbol-task.yml \
            scripts/_patch_unified_test_expectations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align CI and scan title with 17-symbol universe"
          git push origin HEAD:codex/unify-17-symbol-universe
