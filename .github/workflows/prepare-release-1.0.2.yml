name: Prepare 1.0.2 release metadata

on:
  push:
    branches:
      - agent/release-1.0.2

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-1.0.2
          fetch-depth: 0

      - name: Update version and release documentation
        run: |
          set -euo pipefail
          python scripts/prepare_release_1_0_2.py
          git diff --check
          git status --short

      - name: Commit release metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            quantfusion/__init__.py \
            README.md \
            docs/RELEASE.md \
            tests/contract/test_repository_hygiene.py; then
            echo "Release metadata is already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            quantfusion/__init__.py \
            README.md \
            docs/RELEASE.md \
            tests/contract/test_repository_hygiene.py
          git commit -m "release: prepare 1.0.2"
          git push origin HEAD:agent/release-1.0.2
