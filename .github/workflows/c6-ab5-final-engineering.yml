name: C6 AB5 final engineering verification
on:
  push:
    branches: [codex/c6-ab5-release-build-20260912]
    paths: [.github/workflows/c6-ab5-final-engineering.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: c6-ab5-final-engineering
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: python@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate reviewed batch and isolate original PR source
        run: |
          set -euo pipefail
          export C6_TRANSFER="$RUNNER_TEMP/c6-integrity-transfer"
          export C6_VERIFY_OUT="$RUNNER_TEMP/c6-integrity-evidence"
          printf 'C6_TRANSFER=%s\nC6_VERIFY_OUT=%s\n' "$C6_TRANSFER" "$C6_VERIFY_OUT" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,zlib
          encoded=''.join(pathlib.Path(f'.github/c6-transfer/publication-integrity-{i}.b64').read_text().strip() for i in range(3))
          assert hashlib.sha256(encoded.encode()).hexdigest()=='b522ef35f9b70fa495e0d1cf9000ab4b8517143be2bf7212f6f12feb1edd5823'
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0abd9f404e6de1ef01047d1cf0726b0abd2eedf75d0bb70d0fb7b5169301ce1b'
          files=json.loads(raw)
          assert set(files)=={'red.patch','green.patch','post.patch','publish.py','run.py'}
          root=pathlib.Path(os.environ['C6_TRANSFER']); root.mkdir()
          authority=pathlib.Path('.github/c6-transfer/publication-authority.json').read_bytes()
          assert hashlib.sha256(authority).hexdigest()=='df6bf807aca43376da97d09162519b41b5f8c5d64f94323d60d759e225a9af51'
          parsed=json.loads(authority)
          assert parsed['author_association']=='OWNER' and parsed['comment_id']==5579901968
          assert parsed['expected_pr_head']=='4a852d4401a71927b1407cf14d1b0b2febfe4fe6'
          (root/'authority.json').write_bytes(authority)
          # The plugin has just authenticated the original owner comment.
          # Preserve that transport explicitly instead of a rate-limited public GET.
          lines=files['run.py'].splitlines()
          start=next(i for i,line in enumerate(lines) if line.startswith('request=urllib.request.Request('))
          assert lines[start+1].startswith('with urllib.request.urlopen(request,timeout=60)')
          lines[start:start+2]=["heartbeat=json.loads((TRANSFER/'authority.json').read_text())['heartbeat_excerpt']"]
          files['run.py']='\n'.join(lines)+'\n'
          for name,content in files.items():
              (root/name).write_text(content)
              if name.endswith('.py'): ast.parse(content)
          out=pathlib.Path(os.environ['C6_VERIFY_OUT']); out.mkdir()
          (out/'authority.json').write_bytes(authority)
          (out/'bootstrap.json').write_text(json.dumps({'status':'started_not_completed','run_id':os.environ['GITHUB_RUN_ID'],'authority_transport':'connected_github_projection','transfer_sha256':hashlib.sha256(raw).hexdigest()},sort_keys=True)+'\n')
          PY
          git switch --detach 4a852d4401a71927b1407cf14d1b0b2febfe4fe6
          test -z "$(git status --porcelain)"
      - name: Install unchanged locked runtime
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify RED controls, repair, authenticate native evidence and publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$C6_TRANSFER/run.py"
      - name: Preserve native integrity verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-ab5-integrity-canonical-${{ github.run_id }}
          path: |
            ${{ env.C6_VERIFY_OUT }}/*.txt
            ${{ env.C6_VERIFY_OUT }}/*.xml
            ${{ env.C6_VERIFY_OUT }}/*.json
            ${{ env.C6_VERIFY_OUT }}/*.bundle
          if-no-files-found: error
          retention-days: 90
