name: C6 v22 Freeze Build

on:
  push:
    branches: [codex/c6-v22-freeze-build-20260907]
    paths:
      - .github/workflows/c6-v22-freeze-build.yml

permissions:
  contents: write

concurrency:
  group: c6-v22-freeze-build-20260907
  cancel-in-progress: false

env:
  SOURCE_BASE: 3b4b9c2554b2ac54d065173d3889040a30bc6e89
  LIVE_MAIN: 5b5efea8abcd3a7722b2a05aed19e21b03a7c608
  PR_HEAD: 04ed41b04c2214f3287f6b944c250abba5004b30
  P21: 1dbcd6709470c2212919164cb39aa02859314dce
  IB21: b41b6fbc551903221353271024a38ca42e7c2e19
  IS21: c89842bc3df1eefcc5f3f6d4a250c2b62323393d
  R21: 6d68e9b91fe5f93c6535718c886242da75ffae26
  W21: f9da08afebf22b3dc03a1fb3a0ec351a79adf42c

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify exact live state and prior frozen identities
        run: |
          set -euo pipefail
          remote="$(git remote get-url origin)"
          test "$(git ls-remote --refs "$remote" refs/heads/main | cut -f1)" = "$LIVE_MAIN"
          test "$(git ls-remote --refs "$remote" refs/heads/codex/c6-causal-risk-closure-v11 | cut -f1)" = "$PR_HEAD"
          for pair in \
            "codex/c6-preregistration-v21:$P21" \
            "codex/c6-base-v21:$IB21" \
            "codex/c6-s-v21:$IS21" \
            "codex/c6-evidence-v21:$R21" \
            "codex/c6-v21-workflow-anchor:$W21"; do
            ref="${pair%%:*}"; sha="${pair##*:}"
            test "$(git ls-remote --refs "$remote" "refs/heads/$ref" | cut -f1)" = "$sha"
          done
          for ref in codex/c6-preregistration-v22 codex/c6-base-v22 codex/c6-s-v22 codex/c6-evidence-v22; do
            test -z "$(git ls-remote --refs "$remote" "refs/heads/$ref")"
          done
          expected=$'.github/scripts/c6_auto_resume.py\n.github/scripts/c6_stage_advance.py\n.github/scripts/test_c6_stage_advance.py\n.github/workflows/c6-auto-resume.yml\n.github/workflows/c6-stage-advance.yml'
          test "$(git diff --name-only "$SOURCE_BASE" "$LIVE_MAIN" | sort)" = "$expected"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Derive v22 builder from the verified v21 builder
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/build_c6_v21_freeze.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'codex/c6-v21-workflow-anchor'
          placeholder = '__C6_RETAINED_W21_ANCHOR__'
          if text.count(anchor) < 3:
              raise SystemExit('unexpected W21 anchor count in source builder')
          text = text.replace(anchor, placeholder)

          exact = [
              ('MAIN = "3b4b9c2554b2ac54d065173d3889040a30bc6e89"\nPR_HEAD = "9bea501127306060af0af90b20186780c9913ee2"',
               'MAIN = "3b4b9c2554b2ac54d065173d3889040a30bc6e89"\nLIVE_MAIN = "5b5efea8abcd3a7722b2a05aed19e21b03a7c608"\nPR_HEAD = "04ed41b04c2214f3287f6b944c250abba5004b30"'),
              ('"refs/heads/main": MAIN,', '"refs/heads/main": LIVE_MAIN,'),
              ('refs/heads/codex/c6-preregistration-v21', 'refs/heads/codex/c6-preregistration-v22'),
              ('refs/heads/codex/c6-base-v21', 'refs/heads/codex/c6-base-v22'),
              ('refs/heads/codex/c6-s-v21', 'refs/heads/codex/c6-s-v22'),
              ('refs/heads/codex/c6-evidence-v21', 'refs/heads/codex/c6-evidence-v22'),
              ('codex/c6-preregistration-v21', 'codex/c6-preregistration-v22'),
              ('codex/c6-base-v21', 'codex/c6-base-v22'),
              ('codex/c6-s-v21', 'codex/c6-s-v22'),
              ('codex/c6-evidence-v21', 'codex/c6-evidence-v22'),
              ('c6-causal-risk-closure-17x958-v21', 'c6-causal-risk-closure-17x958-v22'),
              ('2026-09-07T10:35:00Z', '2026-09-07T13:15:00Z'),
              ('v21_correctness_and_parallel_rebind', 'v22_parallel_shard_stream_repair'),
              ('B_flow_neutral_cash_hwm_correctness_plus_A_execution_efficiency', 'A_parallel_shard_records_stream_transport_after_B_flow_fix'),
              ('"invalid_execution_revision": "v19"', '"invalid_execution_revision": "v21"'),
              ('"invalid_bound_run_id": 34070745634', '"invalid_bound_run_id": 34115292050'),
              ('retain forensic bytes; import zero records; never resume/relabel/use for residual/S/D/L2/L4',
               'retain immutable v21 bytes; no sealed economic result exists; import zero records; never native-rerun/relabel/use for residual/S/D/L2/L4'),
              ('Correctness-required v21 rebind after invalidating v19 flow-neutral sleeve cash/HWM accounting, ',
               'Engineering-required v22 rebind after v21 Base aggregate transport failure, '),
              ('plus A-class execution-overhead reduction. Preserve fixed Base/S economics, 765/3831/3875 manifests, ',
               'while preserving the prior B-class flow fix and A-class execution optimizations. Preserve fixed Base/S economics, 765/3831/3875 manifests, '),
              ('official 17/958 gates, data, seeds, qualification and mechanical selection. Import no v19 economic record.',
               'official 17/958 gates, data, seeds, qualification and mechanical selection. Import no v19 or v21 economic record.'),
              ('C6 v21 preregistration: flow-corrected parallel rebind', 'C6 v22 preregistration: streamed-shard aggregate repair'),
              ('Freeze C6-Base v21 on corrected main with parallel runner', 'Freeze C6-Base v22 with streamed-shard aggregate repair'),
              ('Freeze C6-Base+S v21 with exact six-path S overlay', 'Freeze C6-Base+S v22 with exact six-path S overlay'),
              ('Bind all seven C6 v21 stages to corrected parallel identities', 'Bind all seven C6 v22 stages to streamed-shard identities'),
              ('c6_v21_freeze_receipt', 'c6_v22_freeze_receipt'),
              ('v21 ref already exists', 'v22 ref already exists'),
          ]
          for old, new in exact:
              if old not in text:
                  raise SystemExit(f'missing required builder token: {old!r}')
              text = text.replace(old, new)

          text = text.replace('c6-v21-', 'c6-v22-')
          text = text.replace(placeholder, anchor)

          needle = '        "hard_drawdown_gate": 0.18,\n    }\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected v22 recovery block terminator count')
          extra = '''        "hard_drawdown_gate": 0.18,\n        "prior_frozen_identities": {\n            "P": "1dbcd6709470c2212919164cb39aa02859314dce",\n            "I_B": "b41b6fbc551903221353271024a38ca42e7c2e19",\n            "I_S": "c89842bc3df1eefcc5f3f6d4a250c2b62323393d",\n            "R": "6d68e9b91fe5f93c6535718c886242da75ffae26",\n            "workflow": WORKFLOW21,\n        },\n        "live_main_at_freeze": LIVE_MAIN,\n        "all_parallel_shards_succeeded": 12,\n        "sealed_economic_result": False,\n        "aggregate_failure": "records root array decoded as one JSON record and exceeded the unchanged 64 MiB per-record limit",\n        "repair": "stream only shard records as FileArray; retain the 64 MiB limit and exact per-record partition/hash/schema/preregistration/union validation",\n        "pr63_fix_head": PR_HEAD,\n        "pr63_exact_head_ci": 34125997027,\n        "v21_imported_records": 0,\n    }\n'''
          text = text.replace(needle, extra)

          if anchor not in text or 'codex/c6-v22-workflow-anchor' in text:
              raise SystemExit('retained workflow anchor was rewritten')
          for stale in (
              'refs/heads/codex/c6-preregistration-v21',
              'refs/heads/codex/c6-base-v21',
              'refs/heads/codex/c6-s-v21',
              'refs/heads/codex/c6-evidence-v21',
          ):
              if stale in text:
                  raise SystemExit(f'stale target ref survived: {stale}')
          if 'c6-v21-' in text.replace(anchor, ''):
              raise SystemExit('stale v21 logical execution token survived')
          if 'PR_HEAD = "04ed41b04c2214f3287f6b944c250abba5004b30"' not in text:
              raise SystemExit('PR63 fixed head missing')

          Path('/tmp/build_c6_v22_freeze.py').write_text(text, encoding='utf-8')
          PY
          python -m py_compile /tmp/build_c6_v22_freeze.py
      - name: Build validate and atomically publish P22 I_B22 I_S22 R22
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python /tmp/build_c6_v22_freeze.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c6-v22-freeze-receipt-${{ github.run_id }}
          path: c6-v22-freeze-receipt.json
          if-no-files-found: ignore
          retention-days: 90
