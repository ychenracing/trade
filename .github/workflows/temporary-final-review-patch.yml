name: Temporary final review patch

on:
  push:
    branches:
      - agent/final-code-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-code-review
      - name: Apply reviewed text-only core cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          test_path = Path("test_review_fixes.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = replace_once(
              test_text,
              "from unittest import mock\n",
              "",
              "remove unused mock import",
          )
          test_path.write_text(test_text, encoding="utf-8")

          path = Path("quant_fusion.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''    """Real portfolio state from a live account snapshot.\n\n    Used by the daily signal scanner to derive correct action labels\n    without relying on a simulated replay from scratch.\n    """''',
              '''    """Legacy account-state shape retained for API compatibility.\n\n    Production account decisions are generated by ``account_signal_engine.py``;\n    historical backtests reject account-state injection.\n    """''',
              "AccountState documentation",
          )
          text = replace_once(
              text,
              '''        If account-state injection populated ``_initial_positions`` and\n        ``_initial_cash`` before this method is called (single-sleeve mode),\n        those values are restored after the reset so the engine replays from\n        the real portfolio state instead of a zero-position, full-capital start.''',
              '''        Legacy initial-position fields are restored for backward-compatible\n        internal tests only. The public backtest API rejects real-account\n        injection; production account advice is handled by a separate engine.''',
              "reset-state documentation",
          )
          text = replace_once(
              text,
              '''        # ── DEPRECATED: Account snapshot injection ─────────────────────\n        # The public run() API now raises NotImplementedError when\n        # account_state is passed. The injection logic below is dead code\n        # retained for reference until the separate account signal engine\n        # is built. Do NOT re-enable without reading the architecture\n        # defects documented in BACKTEST_RESULTS.md.''',
              '''        # ── 兼容字段：禁止在生产回测中注入真实账户 ────────────────\n        # 公共 run() 会拒绝 account_state。真实账户建议由\n        # account_signal_engine.py 独立生成；以下字段只保留兼容性，\n        # 不得重新接入历史回测状态机。''',
              "legacy account comment",
          )
          text = replace_once(
              text,
              '''        """Inject the account snapshot on the as-of date before delegating.\n\n        When ``_account_state_to_inject`` is set and the current date is the\n        second-to-last trading day (the day before the simulation end / as-of\n        date), the real account state replaces the simulated book before the\n        day's opening execution.  Every date before the injection point runs\n        as an unmodified simulation so historical signal generation is not\n        affected by the snapshot.\n        """''',
              '''        """保留旧内部钩子的执行顺序，但生产入口不会设置账户快照。\n\n        公共回测接口会拒绝 ``account_state``；真实持仓只允许进入独立的\n        时点账户引擎，避免把当前账户状态写入历史路径。\n        """''',
              "legacy process hook documentation",
          )
          text = replace_once(
              text,
              '''                "Real-account mode (account_state) is disabled. "\n                "The account injection logic has known architecture defects. "\n                "Use simulation mode (account_state=None) instead. "\n                "A separate account signal engine is planned."''',
              '''                "Historical backtest account_state injection is disabled. "\n                "Use account_signal_engine.py or daily_signal_scan.py --account "\n                "for point-in-time account decision support."''',
              "public account-state error",
          )
          text = replace_once(
              text,
              '''            if account_state:\n                self._initial_positions = self._apply_account_state(\n                    account_state, self\n                )\n''',
              "",
              "remove unreachable account branch",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit reviewed cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant_fusion.py test_review_fixes.py
          git commit -m "refactor: remove stale account injection descriptions"
          git push origin HEAD:agent/final-code-review
