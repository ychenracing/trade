name: Temporary final review patch

on:
  push:
    branches:
      - agent/final-code-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-code-review
      - name: Apply reviewed core and test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("quant_fusion.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "import math\nimport re\nimport time\n",
              "import math\nimport os\nimport re\nimport tempfile\nimport time\n",
              "imports",
          )
          replace_once(
              '''        if volume.isna().any() or (volume < 0).any():
                      raise ValueError(f"{provider_name} returned invalid volume values")
          ''',
              '''        if (
                      volume.isna().any()
                      or not np.isfinite(volume.to_numpy(dtype=float)).all()
                      or (volume < 0).any()
                  ):
                      raise ValueError(f"{provider_name} returned invalid volume values")
          ''',
              "provider volume finite validation",
          )
          replace_once(
              '''    @staticmethod
              def _write_cache_contract(cache_path: Path) -> None:
                  """Persist the unit contract next to an atomically replaceable cache."""
                  meta_path = DataFetcher._cache_contract_path(cache_path)
                  meta_path.write_text(
                      json.dumps(
                          {
                              "schema_version": DataFetcher._CACHE_SCHEMA_VERSION,
                              "volume_unit": "shares",
                          },
                          sort_keys=True,
                      )
                      + "\\n",
                      encoding="utf-8",
                  )
          ''',
              '''    @staticmethod
              def _atomic_replace_text(path: Path, content: str) -> None:
                  """Write text through a flushed temporary file and atomic replacement."""
                  path.parent.mkdir(parents=True, exist_ok=True)
                  fd, temporary = tempfile.mkstemp(
                      dir=str(path.parent),
                      prefix=f".{path.name}.",
                      suffix=".tmp",
                  )
                  try:
                      with os.fdopen(fd, "w", encoding="utf-8", newline="") as handle:
                          handle.write(content)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temporary, path)
                  except OSError:
                      try:
                          os.unlink(temporary)
                      except OSError:
                          pass
                      raise

              @staticmethod
              def _write_cache_frame(cache_path: Path, frame: pd.DataFrame) -> None:
                  """Persist a cache CSV atomically so interrupted refreshes keep old data."""
                  DataFetcher._atomic_replace_text(cache_path, frame.to_csv())

              @staticmethod
              def _write_cache_contract(cache_path: Path) -> None:
                  """Persist the share-volume contract next to the cache atomically."""
                  meta_path = DataFetcher._cache_contract_path(cache_path)
                  DataFetcher._atomic_replace_text(
                      meta_path,
                      json.dumps(
                          {
                              "schema_version": DataFetcher._CACHE_SCHEMA_VERSION,
                              "volume_unit": "shares",
                          },
                          sort_keys=True,
                      )
                      + "\\n",
                  )
          ''',
              "atomic cache helpers",
          )
          text = text.replace(
              "            combined.to_csv(cache_path)\n",
              "            DataFetcher._write_cache_frame(cache_path, combined)\n",
          )
          text = text.replace(
              "        df.to_csv(cache_path)\n",
              "        DataFetcher._write_cache_frame(cache_path, df)\n",
          )
          if "to_csv(cache_path)" in text:
              raise SystemExit("cache write replacement incomplete")
          replace_once(
              '''        if out[required].isna().any().any():
                      bad = out[out[required].isna().any(axis=1)].head(3)
                      raise ValueError(
                          f"Market data contains an unparseable price; sample:\\n{bad}"
                      )
                  if (out[required] <= 0).any().any():
          ''',
              '''        if out[required].isna().any().any():
                      bad = out[out[required].isna().any(axis=1)].head(3)
                      raise ValueError(
                          f"Market data contains an unparseable price; sample:\\n{bad}"
                      )
                  if not np.isfinite(out[required].to_numpy(dtype=float)).all():
                      raise ValueError("Market data contains a non-finite price")
                  if (out[required] <= 0).any().any():
          ''',
              "OHLC finite validation",
          )
          replace_once(
              '''        if out["volume"].isna().any():
                      out["volume"] = out["volume"].fillna(0.0)
                  if (out["volume"] < 0).any():
          ''',
              '''        if out["volume"].isna().any():
                      out["volume"] = out["volume"].fillna(0.0)
                  if not np.isfinite(out["volume"].to_numpy(dtype=float)).all():
                      raise ValueError("Market data contains non-finite volume")
                  if (out["volume"] < 0).any():
          ''',
              "volume finite validation",
          )
          replace_once(
              '''class AccountState:
              """Real portfolio state from a live account snapshot.

              Used by the daily signal scanner to derive correct action labels
              without relying on a simulated replay from scratch.
              """''',
              '''class AccountState:
              """Legacy account snapshot shape retained for API compatibility.

              Historical backtests reject account-state injection. Production account
              decisions are generated by ``account_signal_engine.py`` instead.
              """''',
              "AccountState documentation",
          )
          replace_once(
              '''        # Apply initial risk state when explicitly provided by the caller.
                  # Note: daily_signal_scan.py does NOT use this feature — it replays
                  # the full history each time to avoid time-direction errors.
                  initial_risk = self.cfg.get("_initial_risk_state")
                  if initial_risk and initial_risk.get("sector_guard_active", False):
                      self.sector_guard_active = True
          ''',
              "",
              "broken initial risk restore",
          )
          replace_once(
              '''    risk_state: dict | None = None
              # DEPRECATED: account_state is always None now — the public run() API
              # raises NotImplementedError before this field is ever set. Retained for
              # API compatibility until the account signal engine is built.
              account_state: AccountState | None = None
          ''',
              "",
              "dead request fields",
          )
          old_error = '''                "Real-account mode (account_state) is disabled. "
                          "The account injection logic has known architecture defects. "
                          "Use simulation mode (account_state=None) instead. "
                          "A separate account signal engine is planned."'''
          new_error = '''                "Historical backtest account_state injection is disabled. "
                          "Use account_signal_engine.py or daily_signal_scan.py --account "
                          "for point-in-time account decision support."'''
          if text.count(old_error) != 2:
              raise SystemExit("expected two account-state errors")
          text = text.replace(old_error, new_error)
          guard = '''        if account_state is not None:
                      raise NotImplementedError(
                          "Historical backtest account_state injection is disabled. "
                          "Use account_signal_engine.py or daily_signal_scan.py --account "
                          "for point-in-time account decision support."
                      )
                  mode = str(allocation_mode or self.policy.allocation_mode).lower()
          '''
          guarded = '''        if account_state is not None:
                      raise NotImplementedError(
                          "Historical backtest account_state injection is disabled. "
                          "Use account_signal_engine.py or daily_signal_scan.py --account "
                          "for point-in-time account decision support."
                      )
                  if risk_state is not None:
                      raise NotImplementedError(
                          "Historical backtest risk_state injection is disabled. "
                          "Replay from start_date; daily_signal_scan.py preserves saved "
                          "risk state only for identity checks and terminal-state audit."
                      )
                  mode = str(allocation_mode or self.policy.allocation_mode).lower()
          '''
          if text.count(guard) != 2:
              raise SystemExit("expected two external-state guards")
          text = text.replace(guard, guarded)
          replace_once(
              '''            self.sleeves = [self]
                          if risk_state:
                              self.cfg = dict(self.cfg)
                              self.cfg["_initial_risk_state"] = risk_state
                          if account_state:
                              self._initial_positions = self._apply_account_state(
                                  account_state, self
                              )
                          result = super().run(
          ''',
              '''            self.sleeves = [self]
                          result = super().run(
          ''',
              "single dead state branches",
          )
          replace_once(
              '''                indicator_state=indicator_state,
                          warmup_calendar_days=warmup_calendar_days,
                          risk_state=risk_state,
                          account_state=account_state,
          ''',
              '''                indicator_state=indicator_state,
                          warmup_calendar_days=warmup_calendar_days,
          ''',
              "request construction",
          )
          replace_once(
              '''        # ── DEPRECATED: Account snapshot injection ─────────────────────
                  # The public run() API now raises NotImplementedError when
                  # account_state is passed. The injection logic below is dead code
                  # retained for reference until the separate account signal engine
                  # is built. Do NOT re-enable without reading the architecture
                  # defects documented in BACKTEST_RESULTS.md.
                  self._account_state_to_inject: AccountState | None = None
                  self._account_state_injected: bool = False
          ''',
              "",
              "mixin account fields",
          )
          start = text.index(
              "    def _process_trading_day(\n",
              text.index("class _UniverseInvariantSleeveMixin"),
          )
          end = text.index("    def _prepare_run(\n", start)
          text = text[:start] + text[end:]
          replace_once(
              '''        if risk_state:
                      sleeve.cfg = dict(sleeve.cfg)
                      sleeve.cfg["_initial_risk_state"] = risk_state
                  if account_state:
                      # DEPRECATED: This path is unreachable — the public run() API
                      # raises NotImplementedError when account_state is not None.
                      # Retained for reference until the account signal engine replaces
                      # this injection mechanism.
                      sleeve._account_state_to_inject = account_state
                  result = sleeve.run(
          ''',
              '''        result = sleeve.run(
          ''',
              "wrapper dead state branches",
          )
          start = text.index(
              "        # Restore previous risk state when explicitly provided by the caller.\n"
          )
          end = text.index(
              "        portfolio_risk_events: list[dict[str, Any]] = []\n",
              start,
          )
          text = text[:start] + text[end:]
          replace_once(
              '''        for idx, date in enumerate(reference_dates):
                      # Inject account snapshot at the open of the as-of date so that
                      # everything from this day onward uses the real account state
                      # while all prior dates ran as a clean simulation.
                      if account_state is not None and idx == as_of_idx and states:
                          self._apply_account_state(
                              account_state, states[0].sleeve, set_cash=False
                          )
                      self._execute_ensemble_open(states, date)
          ''',
              '''        for date in reference_dates:
                      self._execute_ensemble_open(states, date)
          ''',
              "ensemble account injection",
          )
          old_reset = '''        If account-state injection populated ``_initial_positions`` and
                  ``_initial_cash`` before this method is called (single-sleeve mode),
                  those values are restored after the reset so the engine replays from
                  the real portfolio state instead of a zero-position, full-capital start.'''
          new_reset = '''        Legacy initial-position fields are retained for private compatibility
                  tests only. Public historical backtests reject real-account injection;
                  production account advice uses a separate point-in-time engine.'''
          replace_once(old_reset, new_reset, "reset documentation")
          text = text.replace(
              '"""Convert a live account snapshot into the nested engine position map."""',
              '"""Convert a legacy snapshot for compatibility tests, not production runs."""',
              1,
          )
          for forbidden in (
              "A separate account signal engine is planned",
              "until the account signal engine is built",
              "until the separate account signal engine",
              "_initial_risk_state",
              "_account_state_to_inject",
              "_account_state_injected",
              "request.risk_state",
              "request.account_state",
          ):
              if forbidden in text:
                  raise SystemExit(f"forbidden residue: {forbidden}")
          path.write_text(text, encoding="utf-8")

          test_path = Path("test_review_fixes.py")
          test_text = test_path.read_text(encoding="utf-8")
          for old, new in (
              ('frame.loc[0, "high"] = 1.0', 'frame.loc[1, "high"] = 1.0'),
              ('frame.loc[0, "close"] = float("inf")', 'frame.loc[1, "close"] = float("inf")'),
              ('frame.loc[0, "volume"] = float("inf")', 'frame.loc[1, "volume"] = float("inf")'),
          ):
              if test_text.count(old) != 1:
                  raise SystemExit(f"test patch expected one match: {old}")
              test_text = test_text.replace(old, new, 1)
          insertion = '''
              def test_non_finite_provider_volume_is_rejected(self) -> None:
                  frame = pd.DataFrame(
                      {
                          "date": ["2026-01-01"],
                          "open": [10],
                          "close": [10],
                          "high": [11],
                          "low": [9],
                          "volume": [float("inf")],
                      }
                  )
                  with self.assertRaisesRegex(ValueError, "invalid volume"):
                      qf.DataFetcher._normalize_provider_volume(frame, "Sina")

              def test_market_data_normalizer_rejects_non_finite_values(self) -> None:
                  for column in ("close", "volume"):
                      with self.subTest(column=column):
                          frame = pd.DataFrame(
                              {
                                  "date": ["2026-01-01"],
                                  "open": [10.0],
                                  "close": [10.0],
                                  "high": [11.0],
                                  "low": [9.0],
                                  "volume": [1_000.0],
                              }
                          )
                          frame.loc[0, column] = float("inf")
                          with self.assertRaisesRegex(ValueError, "non-finite"):
                              qf.DataFetcher._normalize_columns(frame)

              def test_historical_risk_state_injection_is_explicitly_rejected(self) -> None:
                  with self.assertRaisesRegex(NotImplementedError, "risk_state injection"):
                      qf.BacktestEngine().run(
                          {"300308": "中际旭创"},
                          "2025-04-01",
                          "2025-04-02",
                          risk_state={"sector_guard_active": True},
                      )

          '''
          marker = "    def test_legacy_cache_without_unit_contract_is_rejected(self) -> None:\n"
          if test_text.count(marker) != 1:
              raise SystemExit("test insertion marker not unique")
          test_text = test_text.replace(marker, insertion + marker, 1)
          test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Compile patched files
        run: python -m py_compile quant_fusion.py test_review_fixes.py
      - name: Commit reviewed cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant_fusion.py test_review_fixes.py
          git commit -m "fix: complete core data and state review"
          git push origin HEAD:agent/final-code-review
