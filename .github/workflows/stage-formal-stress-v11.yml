name: Stage clean formal-stress v11 trigger

on:
  push:
    branches:
      - codex/formal-stress-958-acceptance
    paths:
      - .github/workflows/stage-formal-stress-v11.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-stress-958-acceptance
          fetch-depth: 0

      - name: Build a clean fast-forward trigger commit on staging branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/run-formal-stress-958-v2.yml")
          text = path.read_text(encoding="utf-8")
          old = "name: Run exact 958-scenario formal acceptance v10 production shards\n"
          new = "name: Run exact 958-scenario formal acceptance v11 production shards\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one v10 workflow name, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/stage-formal-stress-v11.yml
          changed="$(git diff --name-only acf4cccf4117edb35e6beb57aa2f9004476c8b93)"
          test "$changed" = ".github/workflows/run-formal-stress-958-v2.yml"
          git diff --quiet acf4cccf4117edb35e6beb57aa2f9004476c8b93 -- quantfusion data README.md docs tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: trigger verified v11 production shards"
          git push origin HEAD:refs/heads/codex/formal-stress-958-v11-stage-20260903
