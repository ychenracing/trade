name: Account budget rejected-evidence preservation
on:
  push:
    branches: [evidence/account-budget-originals-20260917]
    paths: [.github/workflows/account-budget-rejection-evidence.yml]
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install exact retained measurement libraries
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Reconstruct and verify original bytes, without economic promotion
        run: >-
          python artifacts/diagnostics/account-budget-convergence/original-identity/preserve_originals.py
          --repo "$GITHUB_WORKSPACE"
          --metadata "$GITHUB_WORKSPACE/artifacts/diagnostics/account-budget-convergence/original-identity"
          --work "$RUNNER_TEMP/budget-originals"
      - name: Save verified originals using inherited Git authorization
        run: |
          set -eu
          BRANCH=evidence/account-budget-originals-20260917
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 7d5efe5e4ea2159f82b9deb0ff4810730d8de15f
          DEST=artifacts/diagnostics/account-budget-convergence/originals
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/budget-originals/verified-originals/." "$DEST/"
          git add -- "$DEST"
          git diff --cached --stat
          git -c user.name='Trade evidence preservation' -c user.email='verification@localhost' commit -m 'evidence: retain byte-verified rejected account-budget originals'
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/budget-originals/remote-save.txt"
      - name: Archive original bytes and recovery receipts
        if: always()
        run: |
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'budget-originals'
          out = Path(os.environ['RUNNER_TEMP']) / 'preservation-download'
          out.mkdir(exist_ok=True)
          with tarfile.open(out / 'rejected-originals.tar.xz', 'w:xz') as archive:
              for path in sorted(root.rglob('*')):
                  rel = path.relative_to(root)
                  if rel.parts[0] in {'baseline', 'observe', 'protective', 'verified-originals'}:
                      continue
                  if path.is_file():
                      archive.add(path, arcname=str(rel), recursive=False)
          data = (out / 'rejected-originals.tar.xz').read_bytes()
          (out / 'SHA256SUMS').write_text(hashlib.sha256(data).hexdigest() + '  rejected-originals.tar.xz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-budget-rejected-originals-${{ github.sha }}
          path: ${{ runner.temp }}/preservation-download/
          if-no-files-found: error
          retention-days: 30
