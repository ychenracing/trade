name: Account budget original-byte preservation
on:
  push:
    branches: [evidence/account-budget-originals-20260917]
    paths: [.github/workflows/account-budget-rejection-evidence.yml]
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Download immutable transport base, not a new economic run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35183732237
          name: account-budget-rejected-originals-4b7aaca1579494494aa6f50c1c048c92576b36e2
          path: ${{ runner.temp }}/budget-base
      - name: Restore all original bytes and verify original hashes
        run: >-
          python artifacts/diagnostics/account-budget-convergence/original-identity/restore_original_bytes.py
          --metadata "$GITHUB_WORKSPACE/artifacts/diagnostics/account-budget-convergence/original-identity"
          --base-dir "$RUNNER_TEMP/budget-base"
          --out "$RUNNER_TEMP/exact-originals"
      - name: Package complete originals and readback receipt
        run: |
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'exact-originals'
          out = Path(os.environ['RUNNER_TEMP']) / 'preservation-download'
          out.mkdir()
          (root / 'transport-source.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          with tarfile.open(out / 'exact-originals.tar.xz', 'w:xz') as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.add(path, arcname=str(path.relative_to(root)), recursive=False)
          data = (out / 'exact-originals.tar.xz').read_bytes()
          (out / 'SHA256SUMS').write_text(hashlib.sha256(data).hexdigest() + '  exact-originals.tar.xz\n')
          (out / 'sizes.txt').write_text(str(len(data)) + '  exact-originals.tar.xz\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: account-budget-original-bytes-${{ github.sha }}
          path: ${{ runner.temp }}/preservation-download/
          if-no-files-found: error
          retention-days: 90
