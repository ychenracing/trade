name: Alpha leader discovery diagnostic

on:
  push:
    branches:
      - agent/alpha-opportunity-consistency

permissions:
  contents: read
  actions: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify retained leader-health correction
        run: python -m pytest -q tests/unit/test_leader_evidence_health.py
      - name: Download source-bound 2023-current research inputs
        uses: actions/download-artifact@v4
        with:
          name: research-universe-validation-42122d4ca97388e14e920655c65eb21abee8bb1c
          path: /tmp/research-artifact
          repository: ychenracing/trade
          run-id: '35058209928'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify retained research inputs
        run: |
          (cd /tmp/research-artifact/trade-research-market && sha256sum -c SHA256SUMS)
          (cd /tmp/research-artifact/trade-research-regime && sha256sum -c SHA256SUMS)
      - name: Compare current leader discovery with parameter-free quality ranking
        run: |
          python - <<'PYCODE'
          from __future__ import annotations

          import json
          import math
          from pathlib import Path
          from statistics import median

          import numpy as np
          import pandas as pd

          from quantfusion.config.regime import (
              EMERGING_MIN_DAYS,
              LEADER_LOOKBACK,
              MAX_EMERGING_LEADERS,
              MAX_LEADERS,
          )
          from quantfusion.config.research_universes import symbols_for_pool
          from quantfusion.data.providers import DataFetcher
          from quantfusion.regime.evidence import select_positive_momentum_leaders
          from quantfusion.regime.models import RegimeRoute
          from quantfusion.regime.state_machine import simulate_route_sequence

          MARKET = Path('/tmp/research-artifact/trade-research-market')
          REGIME = Path('/tmp/research-artifact/trade-research-regime')
          START = '2023-01-01'
          END = '2026-09-15'
          POOLS = ('pool_b', 'pool_f', 'pool_g')
          REFERENCES = ('300308', '300502', '300394', '688008', '603986')

          steps = simulate_route_sequence(REGIME, start_date=START, end_date=END)
          weak_boundaries: list[str] = []
          previous = None
          for step in steps:
              if step.route == RegimeRoute.WEAK.value and previous != RegimeRoute.WEAK.value:
                  weak_boundaries.append(step.date)
              previous = step.route

          all_symbols = set(REFERENCES)
          for pool in POOLS:
              all_symbols.update(symbols_for_pool(pool))
          frames: dict[str, pd.DataFrame] = {}
          for code in sorted(all_symbols):
              frames[code] = DataFetcher.load_stock_data(
                  code, START, END, data_dir=str(MARKET)
              ).sort_index()

          def history(code: str, boundary: str) -> pd.DataFrame:
              return frames[code].loc[frames[code].index <= pd.Timestamp(boundary)]

          def raw_factors(code: str, boundary: str) -> dict[str, float] | None:
              frame = history(code, boundary)
              if len(frame) < max(EMERGING_MIN_DAYS, 61):
                  return None
              close = pd.to_numeric(frame['close'], errors='coerce').dropna()
              if len(close) < 61:
                  return None
              daily = close.pct_change().dropna()
              ret20 = float(close.iloc[-1] / close.iloc[-21] - 1.0)
              ret60 = float(close.iloc[-1] / close.iloc[-61] - 1.0)
              vol20 = float(daily.iloc[-20:].std())
              vol60 = float(daily.iloc[-60:].std())
              high60 = float(close.iloc[-60:].max())
              breakout = float(close.iloc[-1] / high60) if high60 > 0 else float('nan')
              volume_ratio = float('nan')
              if 'volume' in frame.columns and len(frame) >= 21:
                  volume = pd.to_numeric(frame['volume'], errors='coerce')
                  current = float(volume.iloc[-1])
                  average = float(volume.iloc[-21:-1].mean())
                  if math.isfinite(current) and math.isfinite(average) and average > 0:
                      volume_ratio = current / average
              if not all(math.isfinite(v) for v in (ret20, ret60, vol20, vol60, breakout, volume_ratio)):
                  return None
              if vol20 <= 0 or vol60 <= 0:
                  return None
              return {
                  'ret20': ret20,
                  'ret60': ret60,
                  'ra20': ret20 / (vol20 * math.sqrt(20.0)),
                  'ra60': ret60 / (vol60 * math.sqrt(60.0)),
                  'breakout': breakout,
                  'volume': volume_ratio,
              }

          def quality_selection(symbols: tuple[str, ...], boundary: str) -> tuple[str, ...]:
              ref = {code: raw_factors(code, boundary) for code in REFERENCES}
              if any(item is None for item in ref.values()):
                  return ()
              reference = {code: item for code, item in ref.items() if item is not None}
              ref_ret60 = float(np.mean([item['ret60'] for item in reference.values()]))
              factor_refs = {
                  'ra20': [item['ra20'] for item in reference.values()],
                  'ra60': [item['ra60'] for item in reference.values()],
                  'rs60': [item['ret60'] - ref_ret60 for item in reference.values()],
                  'breakout': [item['breakout'] for item in reference.values()],
                  'volume': [item['volume'] for item in reference.values()],
              }
              ranked: list[tuple[float, str, bool]] = []
              for code in symbols:
                  item = raw_factors(code, boundary)
                  if item is None:
                      continue
                  closes = pd.to_numeric(history(code, boundary)['close'], errors='coerce').dropna()
                  mature = False
                  if len(closes) >= LEADER_LOOKBACK + 1:
                      ret240 = float(closes.iloc[-1] / closes.iloc[-LEADER_LOOKBACK - 1] - 1.0)
                      mature = math.isfinite(ret240) and ret240 > 0
                  emerging = item['ret20'] > 0 and item['ret60'] > 0 and item['breakout'] >= 0.90
                  if not (mature or emerging):
                      continue
                  values = {
                      'ra20': item['ra20'],
                      'ra60': item['ra60'],
                      'rs60': item['ret60'] - ref_ret60,
                      'breakout': item['breakout'],
                      'volume': item['volume'],
                  }
                  percentiles = [
                      sum(reference_value <= values[name] for reference_value in factor_refs[name])
                      / len(factor_refs[name])
                      for name in ('ra20', 'ra60', 'rs60', 'breakout', 'volume')
                  ]
                  # Median fixed-reference percentile: one short-term spike or
                  # volume burst cannot dominate a candidate whose other factors
                  # are weak. No tunable weights are introduced.
                  score = float(median(percentiles))
                  ranked.append((score, code, mature))
              ranked.sort(key=lambda row: (-row[0], row[1]))
              selected: list[str] = []
              emerging_count = 0
              for _, code, mature in ranked:
                  if not mature:
                      if emerging_count >= MAX_EMERGING_LEADERS:
                          continue
                      emerging_count += 1
                  selected.append(code)
                  if len(selected) >= MAX_LEADERS:
                      break
              return tuple(selected)

          def forward_metrics(code: str, boundary: str, horizon: int) -> dict[str, float] | None:
              frame = frames[code]
              pos = int(frame.index.searchsorted(pd.Timestamp(boundary), side='right'))
              if pos >= len(frame) or pos + horizon - 1 >= len(frame):
                  return None
              start = float(frame['open'].iloc[pos])
              if not math.isfinite(start) or start <= 0:
                  return None
              close_path = pd.to_numeric(
                  frame['close'].iloc[pos: pos + horizon], errors='coerce'
              ).dropna()
              if len(close_path) != horizon:
                  return None
              end = float(close_path.iloc[-1])
              returns = close_path / start - 1.0
              return {
                  'return': end / start - 1.0,
                  'adverse': float(returns.min()),
              }

          detail: list[dict[str, object]] = []
          aggregates: dict[str, dict[str, dict[str, list[float]]]] = {}
          for pool in POOLS:
              symbols = tuple(symbols_for_pool(pool))
              aggregates[pool] = {
                  'current': {'r20': [], 'r60': [], 'a20': [], 'a60': []},
                  'quality': {'r20': [], 'r60': [], 'a20': [], 'a60': []},
              }
              for boundary in weak_boundaries:
                  current = select_positive_momentum_leaders(
                      symbols,
                      data_dir=MARKET,
                      as_of=boundary,
                      maximum=MAX_LEADERS,
                  )
                  if current.status != 'READY':
                      continue
                  quality = quality_selection(symbols, boundary)
                  row: dict[str, object] = {
                      'pool': pool,
                      'boundary': boundary,
                      'current': list(current.selected_symbols),
                      'quality': list(quality),
                  }
                  for label, selected in (
                      ('current', current.selected_symbols),
                      ('quality', quality),
                  ):
                      row[label + '_metrics'] = {}
                      for horizon in (20, 60):
                          values = [
                              forward_metrics(code, boundary, horizon)
                              for code in selected
                          ]
                          values = [value for value in values if value is not None]
                          if not values:
                              continue
                          r = [value['return'] for value in values]
                          a = [value['adverse'] for value in values]
                          aggregates[pool][label][f'r{horizon}'].extend(r)
                          aggregates[pool][label][f'a{horizon}'].extend(a)
                          row[label + '_metrics'][str(horizon)] = {
                              'mean_return': float(np.mean(r)),
                              'positive_rate': float(np.mean([value > 0 for value in r])),
                              'worst_adverse': float(min(a)),
                          }
                  detail.append(row)

          summary: dict[str, object] = {'weak_boundaries': weak_boundaries, 'pools': {}}
          for pool in POOLS:
              pool_summary: dict[str, object] = {}
              for label in ('current', 'quality'):
                  source = aggregates[pool][label]
                  item: dict[str, object] = {}
                  for horizon in (20, 60):
                      returns = source[f'r{horizon}']
                      adverse = source[f'a{horizon}']
                      item[str(horizon)] = {
                          'observations': len(returns),
                          'mean_return': float(np.mean(returns)) if returns else None,
                          'median_return': float(np.median(returns)) if returns else None,
                          'positive_rate': float(np.mean([value > 0 for value in returns])) if returns else None,
                          'worst_adverse': float(min(adverse)) if adverse else None,
                          'mean_adverse': float(np.mean(adverse)) if adverse else None,
                      }
                  pool_summary[label] = item
              summary['pools'][pool] = pool_summary

          payload = {'summary': summary, 'episodes': detail}
          Path('/tmp/leader-discovery-diagnostic.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          print('LEADER_DISCOVERY_SUMMARY=' + json.dumps(summary, ensure_ascii=False, sort_keys=True))
          print('LEADER_DISCOVERY_EPISODES=' + json.dumps(detail, ensure_ascii=False, sort_keys=True))
          PYCODE
