name: Alpha ranking targeted check

on:
  push:
    branches:
      - agent/alpha-opportunity-consistency

permissions:
  contents: read
  actions: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run opportunity and leader-health contracts
        run: >-
          python -m pytest -q
          tests/unit/test_opportunity_ranking.py
          tests/unit/test_leader_evidence_health.py
      - name: Measure fixed-universe economics
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from tests.regression.test_quant_fusion import UNIVERSES, run_quiet

          baseline = json.loads(Path('tests/fixtures/backtest_golden_metrics.json').read_text())
          rows = {}
          for name, codes in UNIVERSES.items():
              result = run_quiet(codes)
              expected = baseline[str(len(codes))]
              rows[name] = {
                  'symbols': len(codes),
                  'total_return': float(result['total_return']),
                  'baseline_total_return': float(expected['total_return']),
                  'return_delta': float(result['total_return']) - float(expected['total_return']),
                  'max_drawdown': float(result['max_drawdown']),
                  'baseline_max_drawdown': float(expected['max_drawdown']),
                  'drawdown_delta': float(result['max_drawdown']) - float(expected['max_drawdown']),
                  'sharpe': float(result['sharpe']),
                  'calmar': float(result['calmar']),
                  'total_trades': int(result['total_trades']),
                  'baseline_total_trades': int(expected['total_trades']),
                  'trade_delta': int(result['total_trades']) - int(expected['total_trades']),
              }
          print('ALPHA_OPPORTUNITY_PROBE=' + json.dumps(rows, sort_keys=True))
          PYCODE
      - name: Download source-bound 2023-current research inputs
        uses: actions/download-artifact@v4
        with:
          name: research-universe-validation-42122d4ca97388e14e920655c65eb21abee8bb1c
          path: /tmp/research-artifact
          repository: ychenracing/trade
          run-id: '35058209928'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify retained research inputs
        run: |
          (cd /tmp/research-artifact/trade-research-market && sha256sum -c SHA256SUMS)
          (cd /tmp/research-artifact/trade-research-regime && sha256sum -c SHA256SUMS)
          (cd /tmp/research-artifact/universe-comparison && sha256sum -c SHA256SUMS)
      - name: Replay Pool B F G on identical retained inputs
        run: |
          cp -a /tmp/research-artifact /tmp/research-run
          python -m scripts.compare_universes \
            --pool pool_b --pool pool_f --pool pool_g \
            --start-date 2023-01-01 --end-date 2026-09-15 \
            --data-dir /tmp/research-run/trade-research-market \
            --regime-data-dir /tmp/research-run/trade-research-regime \
            --output-dir /tmp/candidate-comparison
      - name: Compare long-window economics with retained main baseline
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          baseline_rows = json.loads(Path('/tmp/research-artifact/universe-comparison/comparison.json').read_text())
          candidate_rows = json.loads(Path('/tmp/candidate-comparison/comparison.json').read_text())
          baseline = {row['pool']: row for row in baseline_rows}
          candidate = {row['pool']: row for row in candidate_rows}
          metrics = (
              'total_return', 'annual_return', 'max_drawdown', 'total_trades',
              'turnover_ratio', 'all_cash_day_ratio', 'average_cash_ratio',
              'holding_concentration_hhi_mean', 'max_concurrent_symbols',
          )
          report = {}
          for pool in sorted(candidate):
              report[pool] = {
                  metric: {
                      'baseline': baseline[pool][metric],
                      'candidate': candidate[pool][metric],
                      'delta': candidate[pool][metric] - baseline[pool][metric],
                  }
                  for metric in metrics
              }
          print('ALPHA_LONG_WINDOW_PROBE=' + json.dumps(report, sort_keys=True))
          PYCODE
