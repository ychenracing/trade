name: Alpha ranking targeted check

on:
  push:
    branches:
      - agent/alpha-opportunity-consistency

permissions:
  contents: read
  actions: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run opportunity and leader-health contracts
        run: >-
          python -m pytest -q
          tests/unit/test_opportunity_ranking.py
          tests/unit/test_leader_evidence_health.py
      - name: Measure fixed-universe economics
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from tests.regression.test_quant_fusion import UNIVERSES, run_quiet

          baseline = json.loads(Path('tests/fixtures/backtest_golden_metrics.json').read_text())
          rows = {}
          for name, codes in UNIVERSES.items():
              result = run_quiet(codes)
              expected = baseline[str(len(codes))]
              rows[name] = {
                  'symbols': len(codes),
                  'total_return': float(result['total_return']),
                  'baseline_total_return': float(expected['total_return']),
                  'return_delta': float(result['total_return']) - float(expected['total_return']),
                  'max_drawdown': float(result['max_drawdown']),
                  'baseline_max_drawdown': float(expected['max_drawdown']),
                  'drawdown_delta': float(result['max_drawdown']) - float(expected['max_drawdown']),
                  'total_trades': int(result['total_trades']),
                  'baseline_total_trades': int(expected['total_trades']),
                  'trade_delta': int(result['total_trades']) - int(expected['total_trades']),
              }
          print('ALPHA_FIXED_WINDOW_PROBE=' + json.dumps(rows, sort_keys=True))
          PYCODE
      - name: Download source-bound 2023-current research inputs
        uses: actions/download-artifact@v4
        with:
          name: research-universe-validation-42122d4ca97388e14e920655c65eb21abee8bb1c
          path: /tmp/research-artifact
          repository: ychenracing/trade
          run-id: '35058209928'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify retained research inputs
        run: |
          (cd /tmp/research-artifact/trade-research-market && sha256sum -c SHA256SUMS)
          (cd /tmp/research-artifact/trade-research-regime && sha256sum -c SHA256SUMS)
          (cd /tmp/research-artifact/universe-comparison && sha256sum -c SHA256SUMS)
      - name: Prepare current-main control with identical health semantics
        run: |
          git worktree add --detach /tmp/main-control origin/main
          cp quantfusion/regime/evidence.py /tmp/main-control/quantfusion/regime/evidence.py
      - name: Replay Candidate B on retained inputs without refreshing data
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.compare_universes import _run_pool

          rows = [
              _run_pool(
                  pool,
                  start_date='2023-01-01',
                  end_date='2026-09-15',
                  data_dir=Path('/tmp/research-artifact/trade-research-market'),
                  regime_data_dir=Path('/tmp/research-artifact/trade-research-regime'),
                  initial_capital=2_000_000.0,
                  indicator_state='warm',
                  warmup_calendar_days=365,
              )
              for pool in ('pool_b', 'pool_f', 'pool_g')
          ]
          Path('/tmp/candidate-long-window.json').write_text(json.dumps(rows, sort_keys=True))
          print('CANDIDATE_LONG_WINDOW=' + json.dumps(rows, sort_keys=True))
          PYCODE
      - name: Replay current-main control on the same retained inputs
        working-directory: /tmp/main-control
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.compare_universes import _run_pool

          rows = [
              _run_pool(
                  pool,
                  start_date='2023-01-01',
                  end_date='2026-09-15',
                  data_dir=Path('/tmp/research-artifact/trade-research-market'),
                  regime_data_dir=Path('/tmp/research-artifact/trade-research-regime'),
                  initial_capital=2_000_000.0,
                  indicator_state='warm',
                  warmup_calendar_days=365,
              )
              for pool in ('pool_b', 'pool_f', 'pool_g')
          ]
          Path('/tmp/control-long-window.json').write_text(json.dumps(rows, sort_keys=True))
          print('CONTROL_LONG_WINDOW=' + json.dumps(rows, sort_keys=True))
          PYCODE
      - name: Compare Candidate B to exact current-main control
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          candidate_rows = json.loads(Path('/tmp/candidate-long-window.json').read_text())
          control_rows = json.loads(Path('/tmp/control-long-window.json').read_text())
          retained_rows = json.loads(Path('/tmp/research-artifact/universe-comparison/comparison.json').read_text())
          candidate = {row['pool']: row for row in candidate_rows}
          control = {row['pool']: row for row in control_rows}
          retained = {row['pool']: row for row in retained_rows}
          metrics = (
              'total_return', 'annual_return', 'max_drawdown', 'total_trades',
              'turnover_ratio', 'all_cash_day_ratio', 'average_cash_ratio',
              'holding_concentration_hhi_mean', 'max_concurrent_symbols',
          )
          report = {}
          for pool in sorted(candidate):
              report[pool] = {
                  metric: {
                      'control': control[pool][metric],
                      'candidate': candidate[pool][metric],
                      'candidate_delta': candidate[pool][metric] - control[pool][metric],
                      'retained_pr105': retained[pool][metric],
                      'control_vs_retained': control[pool][metric] - retained[pool][metric],
                  }
                  for metric in metrics
              }
          print('ALPHA_EXACT_CONTROL=' + json.dumps(report, sort_keys=True))
          Path('/tmp/alpha-exact-control.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PYCODE
