name: Final current-only migration

on:
  push:
    branches:
      - agent/ab5-recovery-cleanup-20260917
    paths:
      - .github/workflows/final-current-only-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ab5-recovery-cleanup-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Rename provider-neutral market data entrypoint
        run: |
          git mv scripts/download_eastmoney_qfq.py scripts/download_market_data.py
          python - <<'PY'
          from pathlib import Path

          roots = [
              Path("README.md"),
              Path("data"),
              Path("docs"),
              Path("scripts"),
              Path("tests"),
              Path(".github/PROJECT_BRIEF.md"),
          ]
          files: list[Path] = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(
                      p for p in root.rglob("*") if p.is_file() and p.suffix in {".py", ".md"}
                  )
          for path in files:
              text = path.read_text(encoding="utf-8")
              updated = text.replace("download_eastmoney_qfq", "download_market_data")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          replacements = {
              "README.md": [
                  (
                      "Pool 模式的数据默认写入被忽略的 `data_cache/research_market`，不会覆盖 `data/market`。研究下载器会取得所选 Pool 的并集、固定信号参考和现有独立风险篮，并在请求窗口前多取 365 个自然日用于 warm 指标。",
                      "市场数据下载器默认写入被忽略的 `data_cache/research_market`，不会覆盖 `data/market`。选择 Pool 时会取得所选 Pool 的并集、固定信号参考和现有独立风险篮；所有下载请求都在回放窗口前多取 365 个自然日用于 warm 指标。",
                  ),
                  (
                      "不能靠共同陈旧、旧容忍 继续。",
                      "不能靠共同陈旧或自然日容忍继续。",
                  ),
                  (
                      "旧自然日容忍范围 均不能绕过该检查",
                      "自然日容忍也不能绕过该检查",
                  ),
              ],
              "data/README.md": [
                  (
                      "`scripts.download_market_data.py` 统一使用当前 provider failover、2023 起默认窗口和独立运行缓存；显式 `--symbol` 仍只下载指定标的。Pool 研究模式另支持可重复 `--pool` 与 `--all-pools`，默认研究窗口起点为 `2023-01-01`、默认输出为被忽略的 `data_cache/research_market`，不会覆盖仓库冻结证据。它下载所选 Pool 并集、`PortfolioPolicy.regime_symbols` 和现有固定 `RISK_BASKET`，并把研究起点前 365 个自然日作为指标预热输入。",
                      "`scripts.download_market_data.py` 统一使用当前 provider failover、2023 起默认窗口和独立运行缓存；默认输出为被忽略的 `data_cache/research_market`，不会覆盖仓库冻结证据，显式 `--symbol` 仍只下载指定标的。研究入口另支持可重复 `--pool` 与 `--all-pools`；选择 Pool 时下载所选 Pool 并集、`PortfolioPolicy.regime_symbols` 和现有固定 `RISK_BASKET`。所有模式都把回放起点前 365 个自然日作为指标预热输入。",
                  ),
              ],
              "docs/RELEASE.md": [
                  (
                      "研究数据应放在独立目录。以下命令准备 Pool B/F/G 的股票、固定信号参考和现有独立风险篮；未指定 `--output` 时，Pool 模式默认使用 `data_cache/research_market`，不会覆盖仓库冻结 `data/market`。Pool 模式会在研究窗口前额外保留 365 个自然日的真实行情用于 warm 指标预热，但收益、回撤和报告窗口仍从指定的 `--start-date` 开始。",
                      "研究数据应放在独立目录。以下命令准备 Pool B/F/G 的股票、固定信号参考和现有独立风险篮；未指定 `--output` 时，下载器默认使用 `data_cache/research_market`，不会覆盖仓库冻结 `data/market`。下载器会在回放窗口前额外保留 365 个自然日的真实行情用于 warm 指标预热，但收益、回撤和报告窗口仍从指定的 `--start-date` 开始。",
                  ),
              ],
              "docs/ARCHITECTURE.md": [
                  (
                      "Pool 数据准备由 `scripts/download_market_data.py` 的研究模式完成，默认写入被忽略的独立缓存；旧无 Pool 路径保持原冻结快照语义。研究 manifest 在外部 I/O 前先标记不完整，每个 CSV 原子替换并记录 SHA-256；只有全部交易池、固定参考和风险篮股票完成才可形成完整输入。",
                      "市场数据准备统一由 `scripts/download_market_data.py` 完成，默认写入被忽略的独立缓存并复用当前 provider failover；不存在单独的旧无 Pool 下载分支。manifest 在外部 I/O 前先标记不完整，每个 CSV 原子替换并记录 SHA-256；只有全部请求股票完成才可形成完整输入，Pool 请求还必须覆盖对应固定参考和风险篮股票。",
                  ),
              ],
              "docs/VALIDATION.md": [
                  (
                      "不能用自然日容忍 绕过。",
                      "不能用自然日容忍绕过。",
                  ),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one match for {old!r}, got {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          current_test = Path("tests/unit/test_current_only_cli.py")
          text = current_test.read_text(encoding="utf-8")
          marker = "def test_download_cli_keeps_only_current_date_flags() -> None:\n"
          if "test_old_provider_specific_downloader_is_removed" not in text:
              insertion = '''def test_old_provider_specific_downloader_is_removed() -> None:\n    root = Path(__file__).resolve().parents[2]\n    assert (root / "scripts" / "download_market_data.py").is_file()\n    assert not (root / "scripts" / "download_eastmoney_qfq.py").exists()\n\n\n'''
              if marker not in text:
                  raise SystemExit("current-only test insertion marker missing")
              text = text.replace(marker, insertion + marker, 1)
              text = text.replace("import pytest\n", "from pathlib import Path\n\nimport pytest\n", 1)
              current_test.write_text(text, encoding="utf-8")
          PY
      - name: Reject stale live references
        run: |
          if git grep -n 'download_eastmoney_qfq' -- README.md data docs scripts tests .github/PROJECT_BRIEF.md; then
            echo "stale provider-specific downloader reference remains"
            exit 1
          fi
      - name: Normalize imports and lint
        run: |
          python -m ruff check --select=I,F401 --fix scripts/download_market_data.py scripts/compare_universes.py tests/unit/test_current_only_cli.py tests/unit/test_research_universes.py tests/unit/test_research_universe_closure.py tests/unit/test_unified_universe.py tests/integration/test_market_data_dependencies.py tests/contract/test_architecture.py tests/contract/test_repository_hygiene.py
          python -m ruff check --select=E,F,W --ignore=E501,E402,E731,E741 scripts/download_market_data.py scripts/compare_universes.py tests/unit/test_current_only_cli.py tests/unit/test_research_universes.py tests/unit/test_research_universe_closure.py tests/unit/test_unified_universe.py tests/integration/test_market_data_dependencies.py tests/contract/test_architecture.py tests/contract/test_repository_hygiene.py
      - name: Run affected verification
        run: |
          python -m pytest -q \
            tests/unit/test_current_only_cli.py \
            tests/unit/test_research_universes.py \
            tests/unit/test_research_universe_closure.py \
            tests/unit/test_unified_universe.py \
            tests/integration/test_market_data_dependencies.py \
            tests/integration/test_daily_regime_snapshot.py \
            tests/integration/test_input_evidence_boundaries.py \
            tests/integration/test_trading_day_coverage.py \
            tests/contract/test_architecture.py \
            tests/contract/test_repository_hygiene.py
      - name: Remove transport workflow
        run: git rm .github/workflows/final-current-only-migration.yml
      - name: Commit and push verified migration
        run: |
          git config user.name "trade-cleanup-bot"
          git config user.email "trade-cleanup-bot@users.noreply.github.com"
          git add README.md data/README.md docs scripts tests .github/PROJECT_BRIEF.md
          git diff --cached --check
          git commit -m "cleanup: unify market data entrypoint"
          git push origin HEAD:agent/ab5-recovery-cleanup-20260917
