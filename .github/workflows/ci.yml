name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run all tests (auto-discovery)
        run: |
          python -m pytest -v --tb=short

  lint:
    name: Lint (ruff + bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff bandit pip-audit

      - name: Run ruff check (gating)
        run: ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py regime_adaptive.py run_regime_validation.py

      - name: Run bandit security scan (gating)
        run: bandit -r quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py regime_adaptive.py run_regime_validation.py -ll

      - name: Run pip-audit on project dependencies (gating)
        run: pip-audit --strict

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pyright (gating)
        # quant_fusion.py predates the repository's type-checking gate and is
        # protected by the full test suite plus the numerical regression job.
        # Keep Pyright strict for the type-clean production entry points.
        run: pyright quant_fusion_optimizer.py daily_signal_scan.py regime_adaptive.py run_regime_validation.py

  regression:
    name: Backtest regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify multi-universe warm backtest metrics
        run: |
          python -c "
          import quant_fusion as qf
          from backtest_universes import NAMES, UNIVERSES

          universes = {
              n: {code: NAMES[code] for code in UNIVERSES[key]}
              for n, key in ((1, '1_symbol'), (3, '3_symbols'),
                             (5, '5_symbols'), (13, '13_symbols'),
                             (22, '22_symbols'))
          }

          baselines = {
              1:  {'return': 5.3089, 'dd': -0.1834, 'trades': 24},
              3:  {'return': 10.8370, 'dd': -0.1792, 'trades': 194},
              5:  {'return': 11.1599, 'dd': -0.1586, 'trades': 222},
              13: {'return': 10.3874, 'dd': -0.1841, 'trades': 324},
              22: {'return': 9.8357, 'dd': -0.1622, 'trades': 244},
          }

          for n, symbols in universes.items():
              engine = qf.BacktestEngine(2_000_000)
              r = engine.run(symbols, '2025-04-01', '2026-07-20',
                             data_dir='market_data', indicator_state='warm')
              b = baselines[n]
              assert abs(r['total_return'] - b['return']) < 0.02, \\
                  f'{n}-symbol return mismatch: {r[\"total_return\"]:.4f} vs {b[\"return\"]}'
              assert abs(r['max_drawdown'] - b['dd']) < 0.005, \\
                  f'{n}-symbol drawdown mismatch: {r[\"max_drawdown\"]:.4f} vs {b[\"dd\"]}'
              assert r['total_trades'] == b['trades'], \\
                  f'{n}-symbol trade count mismatch: {r[\"total_trades\"]} vs {b[\"trades\"]}'
              print(f'{n}-symbol OK: return={r[\"total_return\"]:.4%} dd={r[\"max_drawdown\"]:.4%} trades={r[\"total_trades\"]}')
          "
