name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Lint every Python file
        run: ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
      - name: Run complete test suite
        run: python -m pytest -q

  typecheck:
    name: Maintained module typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Pyright
        run: >-
          pyright
          quant_fusion_optimizer.py
          daily_signal_scan.py
          regime_adaptive.py
          account_signal_engine.py
          market_data_contracts.py
          benchmark_validation.py
          run_regime_validation.py

  security:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Bandit
        run: >-
          bandit -r
          quant_fusion.py
          quant_fusion_optimizer.py
          daily_signal_scan.py
          regime_adaptive.py
          cross_market_overlay.py
          account_signal_engine.py
          market_data_contracts.py
          benchmark_validation.py
          run_regime_validation.py
          validate_basket.py
          download_eastmoney_qfq.py
          backtest_universes.py
          backtest_cambricon_universe.py
          stress_test_prefixes.py
          -ll
      - name: Audit locked dependencies
        run: pip-audit --strict -r requirements-lock.txt

  regression:
    name: Exact backtest regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, typecheck, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify five frozen universes exactly
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          from pathlib import Path

          import quant_fusion as qf
          from backtest_universes import DATA_DIR, NAMES, UNIVERSES

          baselines = json.loads(
              Path("backtest_golden_metrics.json").read_text(encoding="utf-8")
          )
          for name, codes in UNIVERSES.items():
              with contextlib.redirect_stdout(io.StringIO()):
                  result = qf.BacktestEngine(2_000_000).run(
                      {code: NAMES[code] for code in codes},
                      "2025-04-01",
                      "2026-07-20",
                      data_dir=str(DATA_DIR),
                      indicator_state="warm",
                  )
              actual = (
                  float(result["total_return"]),
                  float(result["max_drawdown"]),
                  int(result["total_trades"]),
              )
              baseline_key = str(len(codes))
              expected_item = baselines[baseline_key]
              expected = (
                  float(expected_item["total_return"]),
                  float(expected_item["max_drawdown"]),
                  int(expected_item["total_trades"]),
              )
              if actual != expected:
                  raise SystemExit(
                      f"{name} regression: expected {expected}, got {actual}"
                  )
              print(name, actual)
          PY
