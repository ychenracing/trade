name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

env:
  C6_PREFREEZE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'codex/c6-workflow-preflight' || github.head_ref == 'codex/c6-causal-risk-closure' || github.head_ref == 'codex/c6-causal-risk-closure-v4' || github.head_ref == 'codex/c6-v4-ci-preflight' || github.head_ref == 'codex/c6-causal-risk-closure-v5' || github.head_ref == 'codex/c6-v5-ci-preflight' || github.head_ref == 'codex/c6-v6-ci-execution' || github.head_ref == 'codex/c6-baseline-rebuild') }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-file: requirements-lock-py311.txt
            pytest-args: '-k "not economic_sequences_match_frozen_fingerprints"'
          - python-version: "3.12"
            lock-file: requirements-lock.txt
            pytest-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}
      - name: Install locked dependencies
        run: python -m pip install -r ${{ matrix.lock-file }}
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Lint every Python file
        run: ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
      - name: Run complete test suite
        if: env.C6_PREFREEZE != 'true'
        run: python -m pytest -q ${{ matrix.pytest-args }}
      - name: Run C6 pre-freeze engineering tests
        if: env.C6_PREFREEZE == 'true'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          safe_files = {
              "tests/contract/test_architecture.py",
              "tests/contract/test_current_formal_documentation.py",
              "tests/contract/test_fail_closed_boundaries.py",
              "tests/contract/test_formal_stress_documentation_consistency.py",
              "tests/contract/test_regime_safety_contracts.py",
              "tests/contract/test_repository_hygiene.py",
              "tests/integration/test_daily_artifact_transactions.py",
              "tests/integration/test_daily_cli.py",
              "tests/integration/test_daily_schema_contracts.py",
              "tests/integration/test_daily_signal_service.py",
              "tests/integration/test_daily_snapshot_and_state.py",
              "tests/regression/test_cross_market_overlay.py",
              "tests/regression/test_quant_fusion.py",
              "tests/regression/test_quant_fusion_optimizer.py",
              "tests/regression/test_regime_adaptive.py",
              "tests/regression/test_system_boundaries.py",
              "tests/unit/test_account_modules.py",
              "tests/unit/test_account_signal_sellability.py",
              "tests/unit/test_account_snapshot_v3.py",
              "tests/unit/test_account_truth_boundary.py",
              "tests/unit/test_config_profiles.py",
              "tests/unit/test_current_formal_stress_plan.py",
              "tests/unit/test_daily_scan_modules.py",
              "tests/unit/test_data_context.py",
              "tests/unit/test_engine_modules.py",
              "tests/unit/test_leaf_modules.py",
              "tests/unit/test_optimizer_modules.py",
              "tests/unit/test_overlay_modules.py",
              "tests/unit/test_regime_modules.py",
              "tests/unit/test_risk_governance.py",
              "tests/unit/test_stress_sampling_capacity.py",
              "tests/unit/test_stress_scenarios.py",
              "tests/unit/test_unified_universe.py",
          }
          # Exact fail-closed C6 surface.  A directory prefix is intentionally
          # forbidden here: adding a new test file must not silently make it
          # executable during the economic pre-freeze embargo.
          planned_c6_files = {
              "tests/c6_non_economic/test_baseline_rebuild.py",
              "tests/c6_non_economic/test_c6_book_identity.py",
              "tests/c6_non_economic/test_c6_fixed_reference_admission.py",
              "tests/c6_non_economic/test_c6_retained_winner.py",
              "tests/c6_non_economic/test_c6_contract.py",
              "tests/c6_non_economic/test_c6_diagnostics.py",
              "tests/c6_non_economic/test_c6_bound_run.py",
              "tests/c6_non_economic/test_c6_early_concentration.py",
              "tests/c6_non_economic/test_c6_s_qualification.py",
          }
          discovered_files = {
              path.as_posix() for path in Path("tests").rglob("test_*.py")
          }
          discovered_c6_python = {
              path.as_posix() for path in Path("tests/c6_non_economic").rglob("*.py")
          }
          ib_markers = {
              "quantfusion/application/c6_contract.py",
              "quantfusion/application/c6_diagnostics.py",
              "quantfusion/application/c6_bound_run.py",
          }
          ib_required = {
              "tests/c6_non_economic/test_c6_book_identity.py",
              "tests/c6_non_economic/test_c6_fixed_reference_admission.py",
              "tests/c6_non_economic/test_c6_retained_winner.py",
              "tests/c6_non_economic/test_c6_contract.py",
              "tests/c6_non_economic/test_c6_diagnostics.py",
              "tests/c6_non_economic/test_c6_bound_run.py",
          }
          is_markers = {
              "quantfusion/application/c6_s_qualification.py",
          }
          is_required = {
              "tests/c6_non_economic/test_c6_early_concentration.py",
              "tests/c6_non_economic/test_c6_s_qualification.py",
          }
          required_c6_files = {"tests/c6_non_economic/test_baseline_rebuild.py"}
          if any(Path(path).is_file() for path in ib_markers):
              required_c6_files |= ib_required
          if any(Path(path).is_file() for path in is_markers):
              required_c6_files |= ib_required | is_required
          unknown_files = discovered_files - safe_files - planned_c6_files
          unplanned_c6_python = discovered_c6_python - planned_c6_files
          missing_files = (safe_files | required_c6_files) - discovered_files
          if unknown_files or unplanned_c6_python or missing_files:
              raise SystemExit(
                  "invalid pre-freeze test surface:\n"
                  + "\n".join(
                      sorted(unknown_files | unplanned_c6_python | missing_files)
                  )
              )
          selected_files = safe_files | required_c6_files
          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", *sorted(selected_files)],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          nodes = [
              line.strip()
              for line in collected
              if line.startswith("tests/") and "::" in line
          ]
          collected_nodes = set(nodes)
          unmatched_embargoed = embargoed_nodes - collected_nodes
          unmatched_prefixes = {
              prefix
              for prefix in embargoed_prefixes
              if not any(node.startswith(prefix) for node in nodes)
          }
          if unmatched_embargoed or unmatched_prefixes:
              raise SystemExit(
                  "unmatched economic embargo selectors:\n"
                  + "\n".join(sorted(unmatched_embargoed | unmatched_prefixes))
              )
          executable_nodes = [
              node
              for node in nodes
              if node not in embargoed_nodes
              and not node.startswith(embargoed_prefixes)
          ]
          if not executable_nodes:
              raise SystemExit("no pre-freeze engineering tests collected")
          Path(os.environ["RUNNER_TEMP"], "c6-prefreeze-nodes").write_text(
              "\n".join(executable_nodes) + "\n", encoding="utf-8"
          )
          PY
          xargs -d '\n' python -m pytest -q < "$RUNNER_TEMP/c6-prefreeze-nodes"

  typecheck:
    name: Canonical package typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Pyright
        run: pyright quantfusion

  security:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Bandit
        run: bandit -r quantfusion scripts -ll
      - name: Audit locked dependencies
        run: pip-audit --strict -r requirements-lock.txt

  regression:
    name: Exact backtest regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, typecheck, security]
    steps:
      - uses: actions/checkout@v4
      - name: Verify C6 pre-freeze embargo identity
        if: env.C6_PREFREEZE == 'true'
        run: |
          python3 -I -S - <<'PY'
          import json
          import os

          event = json.loads(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8").read())
          head = event["pull_request"]["head"]
          if head["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("C6 pre-freeze PR must originate in this repository")
          if head["ref"] not in {
              "codex/c6-workflow-preflight",
              "codex/c6-causal-risk-closure",
              "codex/c6-causal-risk-closure-v4",
              "codex/c6-v4-ci-preflight",
              "codex/c6-causal-risk-closure-v5",
              "codex/c6-v5-ci-preflight",
              "codex/c6-v6-ci-execution",
              "codex/c6-baseline-rebuild",
          }:
              raise SystemExit("unapproved C6 pre-freeze branch")
          PY
      - uses: actions/setup-python@v5
        if: env.C6_PREFREEZE != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        if: env.C6_PREFREEZE != 'true'
        run: python -m pip install -r requirements-lock.txt
      - name: Verify five frozen universes (integers exact, floats tight-tolerance)
        if: env.C6_PREFREEZE != 'true'
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          import math
          from pathlib import Path

          from scripts.backtest_universes import DATA_DIR, NAMES, UNIVERSES
          from quantfusion.engine import BacktestEngine
          from quantfusion.research.fingerprints import economic_sequence_fingerprints
          from tests.regression.test_quant_fusion import regime_route_fingerprint

          # 整数指标（交易数/成交数）必须精确一致；浮点指标（收益/回撤）
          # 仅容忍严格的跨平台浮点求和顺序差异（rel_tol=1e-9 远小于
          # 任何真实行为漂移的量级，行为变化仍然会立刻被捕获）。
          baselines = json.loads(
              Path("tests/fixtures/backtest_golden_metrics.json").read_text(encoding="utf-8")
          )
          for name, codes in UNIVERSES.items():
              with contextlib.redirect_stdout(io.StringIO()):
                  result = BacktestEngine(2_000_000).run(
                      {code: NAMES[code] for code in codes},
                      "2025-04-01",
                      "2026-07-20",
                      data_dir=str(DATA_DIR),
                      indicator_state="warm",
                  )
              actual = {
                  "total_return": float(result["total_return"]),
                  "max_drawdown": float(result["max_drawdown"]),
                  "total_trades": int(result["total_trades"]),
                  "sell_trades": int(result["sell_trades"]),
                  "sleeve_fill_count": int(result["sleeve_fill_count"]),
                  "sleeve_sell_fill_count": int(result["sleeve_sell_fill_count"]),
                  "date_symbol_side_count": int(result["date_symbol_side_count"]),
                  "date_symbol_sell_side_count": int(
                      result["date_symbol_sell_side_count"]
                  ),
              }
              actual.update(economic_sequence_fingerprints(result))
              actual.pop("regime_state_series_sha256")
              actual["regime_route_sha256"] = regime_route_fingerprint(result)
              expected_item = baselines[str(len(codes))]
              for key, value in actual.items():
                  baseline_value = expected_item[key]
                  if isinstance(value, int):
                      if value != int(baseline_value):
                          raise SystemExit(
                              f"{name} regression on {key}: "
                              f"expected {baseline_value}, got {value}"
                          )
                  elif isinstance(value, str):
                      if value != str(baseline_value):
                          raise SystemExit(
                              f"{name} regression on {key}: "
                              f"expected {baseline_value}, got {value}"
                          )
                  elif not math.isclose(
                      value, float(baseline_value), rel_tol=1e-9, abs_tol=1e-12
                  ):
                      raise SystemExit(
                          f"{name} regression on {key}: "
                          f"expected {baseline_value}, got {value}"
                      )
              print(name, actual)
          PY
