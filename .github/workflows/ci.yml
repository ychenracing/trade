name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run all tests (auto-discovery)
        run: |
          python -m pytest -v --tb=short

  lint:
    name: Lint (ruff + bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff bandit pip-audit

      - name: Run ruff check (gating)
        run: ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py

      - name: Run bandit security scan (gating)
        run: bandit -r quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py -ll

      - name: Run pip-audit on project dependencies (gating)
        run: pip-audit --strict

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pyright (gating)
        run: pyright quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py

  regression:
    name: Backtest regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify 5-symbol warm backtest metrics
        run: |
          python -c "
          import quant_fusion as qf
          engine = qf.BacktestEngine(2_000_000)
          symbols = {
              '300308': '中际旭创', '300502': '新易盛', '300394': '天孚通信',
              '688008': '澜起科技', '603986': '兆易创新',
          }
          r = engine.run(symbols, '2025-04-01', '2026-07-20',
                         data_dir='market_data', indicator_state='warm')
          assert abs(r['total_return'] - 11.1599) < 0.01, f\"return mismatch: {r['total_return']:.4f}\"
          assert abs(r['max_drawdown'] - (-0.1586)) < 0.005, f\"drawdown mismatch: {r['max_drawdown']:.4f}\"
          assert r['total_trades'] == 222, f\"trade count mismatch: {r['total_trades']}\"
          print(f'Regression OK: return={r[\"total_return\"]:.4%} dd={r[\"max_drawdown\"]:.4%} trades={r[\"total_trades\"]}')
          "
