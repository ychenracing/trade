name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest test_quant_fusion.py test_daily_signal_scan.py -v --tb=short

  lint:
    name: Lint (ruff + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff and bandit
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run ruff check (gating)
        run: ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quant_fusion.py daily_signal_scan.py

      - name: Run bandit security scan
        run: bandit -r quant_fusion.py daily_signal_scan.py -ll
        continue-on-error: true
