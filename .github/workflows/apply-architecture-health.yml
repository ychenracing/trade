name: Apply architecture health migration

on:
  push:
    branches: [agent/architecture-consistency-refactor]
    paths:
      - .github/workflows/apply-architecture-health.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-consistency-refactor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed health migration
        run: python .github/scripts/apply_architecture_health.py
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify focused health contracts
        run: |
          python -m compileall -q quantfusion tests
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quantfusion tests
          python -m pytest -q \
            tests/contract/test_architecture_consistency_refactor.py::test_health_state_is_domain_owned \
            tests/contract/test_architecture_consistency_refactor.py::test_warmup_uses_unified_invalid_state_for_unusable_inputs \
            tests/contract/test_architecture_consistency_refactor.py::test_allocation_degradation_uses_shared_health_report \
            tests/unit/test_risk_governance.py \
            tests/unit/test_data_health_and_strategy_lifecycle.py \
            tests/unit/test_production_reliability_boundaries.py \
            tests/unit/test_daily_report.py
      - name: Remove migration helpers
        run: rm .github/scripts/apply_architecture_health.py .github/workflows/apply-architecture-health.yml
      - name: Save migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: unify architecture health state'
          git push origin HEAD:agent/architecture-consistency-refactor
# rerun after research-adapter lint cleanup
