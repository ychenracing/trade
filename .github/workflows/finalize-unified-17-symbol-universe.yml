name: Finalize unified 17-symbol universe

on:
  push:
    branches:
      - codex/unify-17-symbol-universe
    paths:
      - .github/workflows/finalize-unified-17-symbol-universe.yml

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-17-symbol-universe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Verify the finalized 17-symbol contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          from quantfusion.application import stress_scenarios
          from quantfusion.config import daily
          from quantfusion.config.universe import SYMBOL_NAMES, VALIDATION_UNIVERSES

          expected = (
              "300308", "300502", "300394", "688256", "603986",
              "688072", "688300", "300054", "688361", "002409",
              "688498", "688120", "002384", "688082", "300604",
              "601869", "300408",
          )
          assert tuple(SYMBOL_NAMES) == expected
          assert tuple(daily.SYMBOLS) == expected
          assert VALIDATION_UNIVERSES == {
              "1_symbol": expected[:1],
              "3_symbols": expected[:3],
              "5_symbols": expected[:5],
              "13_symbols": expected[:13],
              "17_symbols": expected,
          }
          scenarios = stress_scenarios._multi_seed_scenarios(
              random_samples=stress_scenarios.DEFAULT_RANDOM_SAMPLES,
              permutation_samples=stress_scenarios.DEFAULT_PERMUTATION_SAMPLES,
              seeds=stress_scenarios.DEFAULT_SEEDS,
          )
          ids = [str(item["scenario_id"]) for item in scenarios]
          assert len(scenarios) == 958
          assert len(set(ids)) == 958
          assert Counter(item["scenario_type"] for item in scenarios) == {
              "prefix": 17,
              "leave_one_out": 17,
              "add_one": 24,
              "random_subset": 750,
              "permutation": 150,
          }
          artifact = json.loads(
              Path("artifacts/validation/universe_backtest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert {item["universe"] for item in artifact["results"]} == {
              "1_symbol", "3_symbols", "5_symbols", "13_symbols", "17_symbols"
          }
          manifest = json.loads(
              Path("data/market/manifest.json").read_text(encoding="utf-8")
          )
          assert tuple(manifest["symbols"]) == expected
          sums = {}
          for line in Path("data/market/SHA256SUMS").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, filename = line.split(maxsplit=1)
              sums[filename] = digest
          for symbol in expected:
              path = Path("data/market") / f"{symbol}.csv"
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == sums[path.name]
          forbidden = [
              Path("scripts/_apply_unified_universe_task.py"),
              Path("scripts/_patch_unified_sampling.py"),
              Path("scripts/_patch_unified_reference_core.py"),
              Path("scripts/_patch_unified_test_expectations.py"),
              Path(".github/workflows/run-unified-17-symbol-task.yml"),
              Path(".github/workflows/red-reference-separation.yml"),
          ]
          leftovers = [str(path) for path in forbidden if path.exists()]
          assert not leftovers, leftovers
          PY

      - name: Run complete engineering verification
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          pyright quantfusion
          bandit -r quantfusion scripts -ll
          pip-audit --strict -r requirements-lock.txt

      - name: Update PR body from verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(
              Path("artifacts/validation/universe_backtest.json").read_text(
                  encoding="utf-8"
              )
          rows = []
          for item in artifact["results"]:
              if item["indicator_state"] == "warm" and item["end_date"] == "2026-07-20":
                  rows.append(
                      f"| {item['universe']} | {item['total_return']:.6%} | "
                      f"{item['max_drawdown']:.6%} | {item['total_trades']} |"
                  )
          body = """## Objective
Unify daily scan, current formal stress, download defaults, execution priority and fixed validation universes on the user-selected ordered 17-symbol trade pool.

## Current ordered universe
`300308, 300502, 300394, 688256, 603986, 688072, 688300, 300054, 688361, 002409, 688498, 688120, 002384, 688082, 300604, 601869, 300408`

## Scope and invariants
- Fixed validation pools are exact prefixes: 1/3/5/13/17.
- Current formal plan is exactly 958 unique scenarios: 17 prefix, 17 leave-one-out, 24 add-one, 750 random-subset, 150 permutation.
- The signal-only five-symbol market-regime reference remains separate from the tradable pool.
- Frozen market data, manifest and SHA-256 inventory cover exactly the 17 current symbols.
- No alpha, thresholds, fee, slippage, T+1 or execution semantics were tuned to manufacture economic results.

## Rebaselined warm results through 2026-07-20

| Universe | Total return | Max drawdown | Trades |
|---|---:|---:|---:|
""" + "\n".join(rows) + """

## Verification
- Complete pytest suite
- compileall
- Ruff
- Pyright
- Bandit
- strict pip-audit
- frozen-data SHA verification
- exact 958-plan structure verification

## Remaining work
Run the complete 958-scenario formal stress acceptance on the merged `main` SHA. That is intentionally a separate task so its source revision and provenance bind to the actual default branch.
"""
          Path("/tmp/pr-body.md").write_text(body, encoding="utf-8")
          PY
          gh pr edit 22 --body-file /tmp/pr-body.md

      - name: Push final cleanup head
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-unified-17-symbol-universe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize the unified 17-symbol universe"
          git push origin HEAD:codex/unify-17-symbol-universe
          remote="$(git ls-remote origin refs/heads/codex/unify-17-symbol-universe | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"

      - name: Wait for final PR CI and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 90); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch codex/unify-17-symbol-universe --json databaseId,headSha,status,conclusion --limit 20 --jq ".[] | select(.headSha == \"$final_sha\") | @base64" | head -1)"
            if [[ -n "$run" ]]; then
              run_id="$(printf '%s' "$run" | base64 -d | jq -r .databaseId)"
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
              break
            fi
            sleep 10
          done
          test -n "${run_id:-}"
          gh pr ready 22
          gh pr merge 22 --squash --delete-branch=false
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          echo "Merged main SHA: $main_sha"
