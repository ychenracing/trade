name: Verify adaptive unavailable health

on:
  push:
    branches: [agent/architecture-consistency-refactor]
    paths:
      - .github/workflows/verify-adaptive-unavailable-health.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-consistency-refactor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused consistency fix
        run: python .github/scripts/fix_adaptive_unavailable_health.py
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify focused behavior and static checks
        run: |
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 quantfusion tests/unit/test_adaptive_unavailable_health.py tests/contract/test_regime_safety_contracts.py
          pyright quantfusion
          python -m pytest -q tests/unit/test_adaptive_unavailable_health.py tests/contract/test_regime_safety_contracts.py tests/unit/test_production_reliability_boundaries.py
      - name: Remove temporary helpers
        run: rm .github/scripts/fix_adaptive_unavailable_health.py .github/workflows/verify-adaptive-unavailable-health.yml
      - name: Save focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: align unavailable leader health state'
          git push origin HEAD:agent/architecture-consistency-refactor
