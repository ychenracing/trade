name: Publish validated business implementation

on:
  push:
    branches: [agent/publish-business]

permissions:
  contents: write

concurrency:
  group: publish-validated-business
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-business
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Generate the already validated business tree
        run: |
          python -m pip install --upgrade pip uv
          pip install -r requirements-dev.txt
          cp backtest_golden_metrics.json /tmp/bull-baseline.json
          python tools/prepare_migration_templates.py
          python tools/apply_review_fixes.py --apply /tmp/bull-baseline.json
          python tools/post_patch_adjustments.py
          uv pip compile --generate-hashes --python-version 3.12 \
            --output-file requirements-lock.txt requirements-dev.txt
          rm -f pyrightconfig.json
          rm -f tools/apply_review_fixes.py tools/post_patch_adjustments.py
          rm -f tools/prepare_migration_templates.py
          git restore --source=HEAD -- .github/workflows/ci.yml
      - name: Commit non-workflow implementation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git restore --staged .github/workflows || true
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden data contracts routing and account signals'
          git push origin HEAD:agent/publish-business
