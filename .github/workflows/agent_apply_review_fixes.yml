name: Apply full production review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: full-production-review-fixes-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-review-fixes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip uv
          pip install -r requirements-dev.txt

      - name: Load exact pre-change bull baselines
        run: cp backtest_golden_metrics.json /tmp/bull-baseline.json

      - name: Apply audited fixes
        run: |
          python tools/prepare_migration_templates.py
          python tools/apply_review_fixes.py --apply /tmp/bull-baseline.json
          python tools/post_patch_adjustments.py

      - name: Resolve hash-locked dependencies
        run: |
          uv pip compile --generate-hashes --python-version 3.12 \
            --output-file requirements-lock.txt requirements-dev.txt
          pip install -r requirements-lock.txt

      - name: Compile and lint
        run: |
          set +e
          python -m compileall -q . > /tmp/compile.log 2>&1
          compile_status=$?
          ruff check --fix --select=E,F,W --ignore=E501,E402,E731,E741 \
            quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py \
            regime_adaptive.py account_signal_engine.py market_data_contracts.py \
            benchmark_validation.py run_regime_validation.py test_review_fixes.py \
            > /tmp/ruff-fix.log 2>&1
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 \
            quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py \
            regime_adaptive.py account_signal_engine.py market_data_contracts.py \
            benchmark_validation.py run_regime_validation.py test_review_fixes.py \
            > /tmp/ruff.log 2>&1
          ruff_status=$?
          cat /tmp/compile.log /tmp/ruff-fix.log /tmp/ruff.log
          if [ "$compile_status" -ne 0 ] || [ "$ruff_status" -ne 0 ]; then
            {
              echo '### Generated implementation compile/lint failure'
              echo
              echo '**Exact frozen baseline:**'
              echo '```json'
              cat /tmp/bull-baseline.json
              echo '```'
              echo
              echo '**compileall:**'
              echo '```text'
              head -c 30000 /tmp/compile.log
              echo
              echo '```'
              echo
              echo '**Ruff auto-fix:**'
              echo '```text'
              head -c 30000 /tmp/ruff-fix.log
              echo
              echo '```'
              echo
              echo '**Remaining Ruff errors:**'
              echo '```text'
              head -c 30000 /tmp/ruff.log
              echo
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
            exit 1
          fi

      - name: Run complete test suite
        run: |
          set +e
          python -m pytest -v --tb=short > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### Generated implementation test failure'
              echo
              echo '```text'
              head -c 60000 /tmp/pytest.log
              echo
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
            exit "$status"
          fi

      - name: Verify exact frozen bull invariants
        run: python tools/apply_review_fixes.py --verify /tmp/bull-baseline.json

      - name: Verify weak-regime acceptance window
        run: |
          python - <<'PY'
          import regime_adaptive as ra
          symbols = {
              '002409': '雅克科技',
              '300054': '鼎龙股份',
              '300308': '中际旭创',
              '300394': '天孚通信',
              '300502': '新易盛',
          }
          result = ra.RegimeAdaptiveBacktestEngine().run(
              symbols, '2024-01-02', '2024-12-31',
              data_dir='historical_data', indicator_state='warm')
          assert result['total_return'] >= 0.45, result['total_return']
          assert result['max_drawdown'] >= -0.20, result['max_drawdown']
          assert result['total_trades'] <= 8, result['total_trades']
          PY

      - name: Run simple benchmark attribution smoke test
        run: |
          python benchmark_validation.py \
            --symbols 300308,300502,300394,002409,300054 \
            --data-dir historical_data \
            --regime-data-dir historical_data \
            --start 2024-01-02 --end 2024-12-31 \
            --output /tmp/benchmark-validation.json
          python -m json.tool /tmp/benchmark-validation.json >/dev/null

      - name: Core type and security checks
        run: |
          set +e
          {
            pyright --project pyrightconfig.json
            pyright_status=$?
            bandit -r quant_fusion.py quant_fusion_optimizer.py daily_signal_scan.py \
              regime_adaptive.py account_signal_engine.py market_data_contracts.py \
              benchmark_validation.py run_regime_validation.py -ll
            bandit_status=$?
            pip-audit --strict -r requirements-lock.txt
            audit_status=$?
            exit $((pyright_status || bandit_status || audit_status))
          } > /tmp/static.log 2>&1
          status=$?
          cat /tmp/static.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### Generated implementation static/security failure'
              echo
              echo '```text'
              head -c 60000 /tmp/static.log
              echo
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
            exit "$status"
          fi

      - name: Remove one-shot migration machinery
        run: |
          rm -f tools/apply_review_fixes.py tools/post_patch_adjustments.py
          rm -f tools/prepare_migration_templates.py
          rm -f .github/workflows/agent_apply_review_fixes.yml
          rm -f .agent_lint_failure.log .agent_pytest_failure.log

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden data contracts routing and account signals'
          git push origin HEAD:agent/full-review-fixes
