name: C6 v23 Aggregate Targeted

on:
  push:
    branches: [codex/c6-v23-aggregate-single-pass-red-20260908]
    paths:
      - tests/c6_non_economic/test_c6_parallel_l1_single_pass.py
      - tests/c6_non_economic/test_c6_parallel_l1_attestation.py
      - tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
      - quantfusion/application/c6_parallel_l1.py
      - quantfusion/application/c6_parallel_l1_validate_cli.py
      - quantfusion/application/c6_diagnostics.py
      - .github/workflows/c6-v23-single-pass-red.yml

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run aggregate and recovered-shard regressions
        run: >-
          python -m pytest -q
          tests/c6_non_economic/test_c6_parallel_l1_single_pass.py
          tests/c6_non_economic/test_c6_parallel_l1_attestation.py
          tests/c6_non_economic/test_c6_parallel_l1_recovery_cli.py
      - name: Verify validation CLI surface
        run: python -m quantfusion.application.c6_parallel_l1_validate_cli --help
