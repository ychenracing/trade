name: Account risk coverage Pool A-J rerun

on:
  push:
    branches:
      - agent/core17-account-risk-coverage
    paths:
      - .github/workflows/account-risk-coverage-pools-rerun.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: account-risk-coverage-pools-rerun
  cancel-in-progress: false

jobs:
  pools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen acceptance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Download frozen Pool input artifact
        uses: actions/download-artifact@v4
        with:
          name: account-risk-coverage-pool-input-4fae001c6db8c88ac90d4c80d683275cfcbf8e45
          path: ${{ runner.temp }}/pool-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ychenracing/trade
          run-id: 35201549781

      - name: Execute preregistered Pool acceptance with corrected import binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import yaml

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          source_path = workspace / ".github/workflows/account-risk-coverage-pools.yml"
          workflow = yaml.safe_load(source_path.read_text(encoding="utf-8"))
          source_steps = {
              step["name"]: step["run"]
              for step in workflow["jobs"]["pools"]["steps"]
              if "run" in step
          }
          ordered = (
              "Verify inputs and reconstruct exact candidate",
              "Validate frozen data through production loaders",
              "Run paired Pool A-J replays",
              "Assess frozen Pool A-J contract",
          )
          if not all(name in source_steps for name in ordered):
              raise SystemExit("preregistered Pool acceptance steps are incomplete")

          env = os.environ.copy()
          env_file = Path(env["RUNNER_TEMP"]) / "pool-rerun.env"
          env_file.write_text("", encoding="utf-8")
          env["GITHUB_ENV"] = str(env_file)

          for name in ordered:
              script = source_steps[name]
              if name == "Run paired Pool A-J replays":
                  old = 'python "$RUNNER" ' + "\\"
                  new = 'PYTHONPATH="$root" python "$RUNNER" ' + "\\"
                  if script.count(old) != 1:
                      raise SystemExit("unexpected preregistered Pool runner invocation")
                  script = script.replace(old, new, 1)
              print(f"::group::{name}", flush=True)
              completed = subprocess.run(
                  [
                      "bash",
                      "--noprofile",
                      "--norc",
                      "-e",
                      "-o",
                      "pipefail",
                      "-c",
                      script,
                  ],
                  cwd=workspace,
                  env=env,
                  check=False,
              )
              print("::endgroup::", flush=True)
              if completed.returncode != 0:
                  raise SystemExit(completed.returncode)
              for line in env_file.read_text(encoding="utf-8").splitlines():
                  if line and "=" in line:
                      key, value = line.split("=", 1)
                      env[key] = value
          PY

      - name: Build evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/pool-acceptance"
          if [[ -d "$EVIDENCE_DIR" ]]; then
            cd "$EVIDENCE_DIR"
            find . -type f ! -name SHA256SUMS -printf '%P\n' \
              | sort \
              | while read -r path; do sha256sum "$path"; done > SHA256SUMS
          fi

      - name: Upload Pool A-J evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-risk-coverage-pools-rerun-${{ github.sha }}
          path: ${{ runner.temp }}/pool-acceptance
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
