name: C6 v25 Central Only Proof

on:
  push:
    branches: [codex/c6-v25-attested-central-hash-fix-20260908]
    paths:
      - .github/workflows/c6-v25-central-only-proof.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: c6-v25-central-only-proof
  cancel-in-progress: false

env:
  P24: f7400c0fff0718a0ac083f32f99b2fe96054647e
  IB24: f6aeb467b2aa70703a69a8b4053ec13aae90e2bc
  R24: 5204e90924533558a546f13a9c2f93b017898eb5
  IB22: addb5c8ebf98ac43e08676cbc6ffe81a2627d9d7
  PRODUCTION_FIX: 81c9efdaa2ea1e5afc3a55b25cf8ebbdbe0e9b3b
  ATTESTATION_RUN: '34149676167'

jobs:
  central-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout patched candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: patched
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout frozen validator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IB24 }}
          path: frozen
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout frozen run bindings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.R24 }}
          path: bindings
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: patched/requirements-lock.txt
      - name: Verify exact identities
        run: |
          set -euo pipefail
          test "$(git -C patched rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C frozen rev-parse HEAD)" = "$IB24"
          test "$(git -C bindings rev-parse HEAD)" = "$R24"
          git -C patched merge-base --is-ancestor "$PRODUCTION_FIX" "$GITHUB_SHA"
          test "$(git -C patched diff --name-only "$PRODUCTION_FIX" "$GITHUB_SHA")" = '.github/workflows/c6-v25-central-only-proof.yml'
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.12.14'
      - name: Install frozen dependencies
        run: python -m pip install --require-hashes -r patched/requirements-lock.txt
      - name: Download already-attested v24 shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: c6-v24-attested-shard-*
          path: parallel-evaluations
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 34149676167
          repository: ychenracing/trade
      - name: Prove patched central merge on exact attested bytes
        env:
          PATCHED_SOURCE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import resource
          import sys
          import time
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          patched = workspace / 'patched'
          frozen = workspace / 'frozen'
          sys.path.insert(0, str(patched))

          from quantfusion.application.c6_contract import load_preregistration, load_run_bindings
          from quantfusion.application.c6_parallel_l1 import load_parallel_evaluations
          from quantfusion.io.c6_stream import MultiFileArray

          prereg_path = frozen / 'artifacts/diagnostics/c6-preregistration.json'
          prereg = load_preregistration(prereg_path, repository=frozen)
          bindings = load_run_bindings(workspace / 'bindings/artifacts/diagnostics/c6-run-bindings.json')
          binding = next(row for row in bindings['binding_records'] if row['record_id'] == 'c6.base.l1')
          assert binding['source_revision'] == os.environ['IB24']
          assert len(list((workspace / 'parallel-evaluations').rglob('shard.json.gz'))) == 12
          assert len(list((workspace / 'parallel-evaluations').rglob('validation.json'))) == 12

          old_cwd = Path.cwd()
          started = time.perf_counter()
          try:
              os.chdir(frozen)
              evaluations = load_parallel_evaluations(
                  workspace / 'parallel-evaluations',
                  prereg=prereg,
                  binding=binding,
                  source_revision=os.environ['IB22'],
                  shard_count=12,
                  attestations_required=True,
                  validator_source_revision=os.environ['IB24'],
                  preregistration_sha256=hashlib.sha256(prereg_path.read_bytes()).hexdigest(),
              )
          finally:
              os.chdir(old_cwd)
          elapsed = time.perf_counter() - started
          assert isinstance(evaluations, MultiFileArray)
          assert len(evaluations) == 3825
          receipt = {
              'kind': 'c6_v25_attested_central_only_proof',
              'economic_replay': False,
              'sealed_results_created': 0,
              'source_attestation_run_id': 34149676167,
              'recovered_core_evaluations': len(evaluations),
              'attestations_verified': 12,
              'storage_mode': 'disk_backed_multi_file_array',
              'shard_source_revision': os.environ['IB22'],
              'validator_source_revision': os.environ['IB24'],
              'run_bindings_revision': os.environ['R24'],
              'production_fix_revision': os.environ['PRODUCTION_FIX'],
              'patched_source_revision': os.environ['PATCHED_SOURCE'],
              'elapsed_seconds': elapsed,
              'max_rss_kib': resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
          }
          (workspace / 'central-proof.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload read-only proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c6-v25-central-only-proof
          path: central-proof.json
          if-no-files-found: error
          retention-days: 30
