name: Align architecture documentation

on:
  push:
    branches: [agent/architecture-consistency-refactor]
    paths:
      - .github/workflows/align-architecture-docs.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-consistency-refactor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align current architecture documentation
        run: python .github/scripts/align_architecture_docs.py
      - name: Verify documentation state
        run: |
          ! grep -nE 'warmup_not_ready|warmup_status=NOT_READY|warmup_health[^\n]*NOT_READY' README.md docs/*.md data/README.md
          grep -n 'ReplayRuntimePolicy' docs/ARCHITECTURE.md
          grep -n 'research/c6_runtime.py' docs/ARCHITECTURE.md
          git diff --check
      - name: Remove migration helpers
        run: rm .github/scripts/align_architecture_docs.py .github/workflows/align-architecture-docs.yml
      - name: Save aligned documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'docs: align architecture boundary terminology'
          git push origin HEAD:agent/architecture-consistency-refactor
