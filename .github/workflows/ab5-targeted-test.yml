name: AB5 targeted test

on:
  push:
    branches:
      - agent/ab5-recovery-cleanup-20260917
    paths:
      - tests/unit/test_account_recovery.py
      - quantfusion/risk/exposure_recovery.py
      - quantfusion/risk/account_budget.py
      - .github/workflows/ab5-targeted-test.yml

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q tests/unit/test_account_recovery.py
