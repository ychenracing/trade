name: Finalize complete 958-scenario stress acceptance

on:
  push:
    branches:
      - codex/full-958-stress-acceptance
    paths:
      - .github/workflows/finalize-full-958-stress-acceptance.yml

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_NAME: codex/full-958-stress-acceptance

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify complete result and aligned documentation
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from quantfusion.application import stress_scenarios
          from quantfusion.config.universe import SYMBOL_NAMES

          summary_path = Path(
              "artifacts/diagnostics/full-958-acceptance-summary.json"
          )
          if not summary_path.is_file():
              raise SystemExit(
                  "full 958 acceptance summary is missing; the execution workflow "
                  "did not reach a coherent final checkpoint"
              )
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          artifact_path = Path(str(summary["artifact_path"]))
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          scenarios = stress_scenarios._multi_seed_scenarios(
              random_samples=stress_scenarios.DEFAULT_RANDOM_SAMPLES,
              permutation_samples=stress_scenarios.DEFAULT_PERMUTATION_SAMPLES,
              seeds=stress_scenarios.DEFAULT_SEEDS,
          )
          expected_ids = {str(item["scenario_id"]) for item in scenarios}
          actual_ids = {str(item["scenario_id"]) for item in artifact["results"]}

          assert len(SYMBOL_NAMES) == 17
          assert len(scenarios) == 958
          assert len(expected_ids) == 958
          assert artifact["scenario_count"] == 958
          assert len(artifact["results"]) == 958
          assert actual_ids == expected_ids
          assert artifact["source_revision"] == summary["source_revision"]
          assert summary["scenario_count"] == 958
          assert summary["unique_scenario_ids"] == 958
          assert summary["acceptance_status"] in {"accepted", "rejected"}
          if summary["acceptance_status"] == "accepted":
              assert summary["canonical"] is True
              assert summary["orchestrator_exit_code"] == 0
          else:
              assert summary["canonical"] is False
              assert summary["orchestrator_exit_code"] == 2

          readme = Path("README.md").read_text(encoding="utf-8")
          validation = Path("docs/VALIDATION.md").read_text(encoding="utf-8")
          assert "正式计划固定为 958 个唯一场景" in readme
          assert "17 股 / 958 场景" in validation
          assert "历史 22 股 / 983 场景" in readme
          assert "历史 22 股 / 983 场景" in validation
          assert "共 983 次生产逐日回放" not in readme
          assert "全部 983 个正式场景" not in readme
          PY
          python -m pytest -q
          python -m compileall -q .
          ruff check --select=E,F,W --ignore=E501,E402,E731,E741 .
          git diff --check
      - name: Remove temporary task machinery and push final checkpoint
        id: checkpoint
        run: |
          remote_before="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)"
          if [ "$remote_before" != "${{ github.sha }}" ]; then
            echo "remote branch advanced before final verification checkpoint" >&2
            exit 1
          fi
          rm -f \
            .github/workflows/finalize-full-958-stress-acceptance.yml \
            .github/workflows/run-full-958-stress-acceptance.yml \
            .github/task-bootstrap/full-958-stress-acceptance.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize complete 958 stress verification"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$BRANCH_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)"
          if [ "$remote_after" != "$final_sha" ]; then
            echo "remote final verification SHA mismatch" >&2
            exit 1
          fi
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
      - name: Refresh pull request with actual result and mark ready
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.checkpoint.outputs.final_sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path("artifacts/diagnostics/full-958-acceptance-summary.json")
              .read_text(encoding="utf-8")
          )
          gate_fields = (
              "absolute_hard_gates",
              "retained_robustness_hard_gates",
              "promotion_gates",
              "initial_baseline_gates",
          )
          lines = [
              "## Goal",
              "",
              "Run the complete current 17-symbol / 958-scenario formal stress plan exactly once, preserve the truthful product-gate result, and align comments and documentation with the observed evidence.",
              "",
              "## Actual result",
              "",
              f"- Acceptance status: `{summary['acceptance_status']}`",
              f"- Canonical: `{str(summary['canonical']).lower()}`",
              f"- Production orchestrator exit code: `{summary['orchestrator_exit_code']}`",
              "- Completed scenarios: `958 / 958`",
              "- Unique scenario IDs: `958`",
              f"- Source revision used for every replay: `{summary['source_revision']}`",
              f"- Final branch checkpoint: `{os.environ['FINAL_SHA']}`",
              f"- Formal artifact: `{summary['artifact_path']}`",
              f"- Stress contract: `{summary.get('stress_contract_version')}`",
              f"- Source fingerprint: `{summary.get('source_fingerprint')}`",
              f"- Data fingerprint: `{summary.get('data_fingerprint')}`",
              f"- Scenario signature: `{summary.get('scenario_signature')}`",
              f"- Run signature: `{summary.get('run_signature')}`",
              "",
              "## Gate families",
              "",
              "| Gate family | passed | status |",
              "|---|---:|---|",
          ]
          gates = summary.get("gates", {})
          for name in gate_fields:
              gate = gates.get(name)
              if not isinstance(gate, dict):
                  continue
              lines.append(
                  f"| `{name}` | `{gate.get('passed')}` | "
                  f"`{gate.get('status', '')}` |"
              )
          lines.extend(
              [
                  "",
                  "## Scope and constraints",
                  "",
                  "No strategy economics, thresholds, seeds, scenario definitions, frozen data, or metrics were changed to obtain a green result. Historical 22-symbol / 983-scenario evidence remains historical and was not overwritten.",
                  "",
                  "## Verification",
                  "",
                  "- Exact 17-symbol / 958-unique-scenario contract: passed",
                  "- Full merged checkpoint accepted by the production checkpoint validator: passed",
                  "- Formal publication semantics (`accepted/canonical` or truthful `rejected/non-canonical`): passed",
                  "- Full `pytest`: passed",
                  "- `compileall`: passed",
                  "- Ruff E/F/W: passed",
                  "- Documentation consistency contract: passed",
                  "- Temporary execution/bootstrap machinery: removed",
                  "",
                  "## Remaining work",
                  "",
                  "Only repository CI and normal review/merge governance remain. This PR does not claim that a rejected product artifact is accepted.",
                  "",
                  "## Merge readiness",
                  "",
                  "Ready for review once required CI checks on the final SHA complete.",
              ]
          )
          Path("/tmp/full-958-pr-body.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          pr_number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH_NAME" \
            --jq '.[0].number')"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "matching pull request was not found" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
            --raw-field body="$(cat /tmp/full-958-pr-body.md)"
          gh pr ready "$pr_number"
