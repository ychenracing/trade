name: Dynamic universe research

on:
  push:
    branches:
      - agent/dynamic-candidate-universe-research

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Download source-attested Pool G research market data
        run: |
          python -m scripts.download_eastmoney_qfq \
            --pool pool_g \
            --start-date 2023-01-01 \
            --end-date 2026-09-15 \
            --output "$RUNNER_TEMP/research_market"
      - name: Evaluate low-churn causal candidate promotion
        run: |
          python -m scripts.research_dynamic_universe \
            --data-dir "$RUNNER_TEMP/research_market" \
            --start-date 2023-01-01 \
            --end-date 2026-09-15 \
            --source-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/dynamic-universe-research.json"
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-universe-research-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dynamic-universe-research.json
            ${{ runner.temp }}/research_market/manifest.json
          retention-days: 30
