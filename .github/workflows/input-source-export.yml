name: Input audit source export
on:
  push:
    branches: [audit/input-source-export-20260913]
    paths: [.github/workflows/input-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d5a5728f9035f2fa8386fdc826b9140ff2247b23
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact source and original historical contracts
        run: |
          git fetch --no-tags origin acf4cccf4117edb35e6beb57aa2f9004476c8b93
          git update-ref refs/audit/retained acf4cccf4117edb35e6beb57aa2f9004476c8b93
          git fetch --no-tags origin 4659a2b6d265f45256777da6a2fc25d1369308bd
          git update-ref refs/audit/preregistration 4659a2b6d265f45256777da6a2fc25d1369308bd
          mkdir -p audit-export
          git bundle create audit-export/trade.bundle HEAD refs/audit/retained refs/audit/preregistration
          git rev-parse HEAD > audit-export/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: input-audit-final-source-and-contracts
          path: audit-export/
          if-no-files-found: error
          retention-days: 7
