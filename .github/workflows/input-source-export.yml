name: Input audit source export
on:
  push:
    branches: [audit/input-source-export-20260913]
    paths: [.github/workflows/input-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be849701f7e4dbcbc19fd698676e844257e25980
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact integration sources
        run: |
          git fetch --no-tags origin acf4cccf4117edb35e6beb57aa2f9004476c8b93
          git update-ref refs/audit/retained acf4cccf4117edb35e6beb57aa2f9004476c8b93
          git fetch --no-tags origin 6ecdf498460b3d6c2fd5166d268704a550dc2497
          git update-ref refs/audit/current-main 6ecdf498460b3d6c2fd5166d268704a550dc2497
          mkdir -p audit-export
          git bundle create audit-export/trade.bundle HEAD refs/audit/retained refs/audit/current-main
          git rev-parse HEAD > audit-export/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: input-audit-integration-source
          path: audit-export/
          if-no-files-found: error
          retention-days: 7
