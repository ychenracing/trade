name: Source-bound decision checks

on:
  push:
    branches: [feat/no-waiver-joint-optimization]
    paths: [.github/workflows/actionable-boundary-research.yml]

permissions:
  contents: read

concurrency:
  group: actionable-boundary-research
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        study: [research, selection]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install repository-locked runtime
        run: python -m pip install -r requirements-lock.txt
      - name: Restore and check the exact rejected research candidate
        env:
          STUDY: ${{ matrix.study }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/decision-evidence"
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          repo = Path.cwd()
          study = os.environ['STUDY']
          assert study in {'research', 'selection'}
          record = repo / f'artifacts/diagnostics/no_waiver/actionable-boundary-{study}.json'
          item = json.loads(record.read_text())
          out = Path(os.environ['RUNNER_TEMP']) / 'decision-evidence'
          work = Path(os.environ['RUNNER_TEMP']) / 'isolated-decision-source'
          bundle = repo / 'artifacts/diagnostics/no_waiver/decision-preservation/research-source.bundle'
          def command(args, cwd=repo):
              result = subprocess.run(args, cwd=cwd, text=True, capture_output=True)
              with (out / 'commands.log').open('a') as log:
                  log.write(repr(args) + '\n' + result.stdout + result.stderr + '\n')
              result.check_returncode()
              return result.stdout
          assert command(['git', 'hash-object', str(bundle)]).strip() == '293c08e630e92ee9afc3ab20e5c5b62e185ba7eb'
          command(['git', 'bundle', 'verify', str(bundle)])
          command(['git', 'fetch', str(bundle), 'HEAD'])
          command(['git', 'worktree', 'add', '--detach', str(work), '4e33931bfdfaa0b11c7cdbe076c89eabe2535b76'])
          reversal = repo / 'artifacts/diagnostics/no_waiver/decision-preservation/rejected-confirmation-removal.patch'
          command(['git', 'apply', '--check', str(reversal)], cwd=work)
          command(['git', 'apply', str(reversal)], cwd=work)
          patch = out / 'candidate.patch'
          patch.write_text(item['patch'])
          command(['git', 'apply', '--check', str(patch)], cwd=work)
          command(['git', 'apply', str(patch)], cwd=work)
          tests = ['tests/unit/test_observed_shock_budget.py', 'tests/unit/test_event_transition_selection.py',
                   'tests/unit/test_atr_trend_readmission.py', 'tests/unit/test_risk_sell_strategy_state.py',
                   'tests/c6_non_economic/test_account_risk_budget.py',
                   'tests/c6_non_economic/test_c6_fixed_reference_admission.py']
          if study == 'research':
              assert item['tests_path'] == 'tests/unit/test_actionable_pyramid_evidence.py'
              (work / item['tests_path']).write_text(item['tests_source'])
              tests.append(item['tests_path'])
          identity_code = 'from quantfusion.application.stress_artifacts import _tree_fingerprint,_source_files; print(_tree_fingerprint(_source_files()))'
          assert command([sys.executable, '-c', identity_code], cwd=work).strip() == item['identity']['source_fingerprint']
          (out / 'record.json').write_text(json.dumps(item, indent=2) + '\n')
          (out / 'source.patch').write_text(command(['git', 'diff', '--', 'quantfusion', 'tests'], cwd=work))
          (out / 'runtime.txt').write_text(sys.version + '\n' + command([sys.executable, '-m', 'pip', 'freeze']))
          (out / 'test-results.txt').write_text(command([sys.executable, '-m', 'pytest', '-q', *tests], cwd=work))
          command(['git', 'diff', '--check'], cwd=work)
          result = command([sys.executable, str(work / 'artifacts/diagnostics/no_waiver/replay_batch.py'),
                            '--root', str(work), '--out', str(out / 'paired'), '--workers', '2',
                            '--ids', 'prefix-13', 'prefix-15'], cwd=work)
          (out / 'replay.log').write_text(result)
          rows = json.loads((out / 'paired/results.json').read_text())
          assert rows['identity']['data_fingerprint'] == item['identity']['data_fingerprint']
          expected = {row[0]: row[1:] for row in item['rows']}
          comparisons = []
          for row in rows['results']:
              actual = [1 + row['total_return'], row['max_drawdown'], row['date_symbol_side_count']]
              comparisons.append({'scenario': row['scenario_id'], 'locked_runtime': actual,
                                  'local_runtime': expected[row['scenario_id']],
                                  'exact_metrics_match': actual == expected[row['scenario_id']]})
          (out / 'replication.json').write_text(json.dumps({
              'status': 'NOT_MET', 'canonical': False, 'default_promoted': False,
              'evidence_kind': 'new locked-runtime paired reproduction, not transferred local originals',
              'source_record_sha256': hashlib.sha256(record.read_bytes()).hexdigest(),
              'host_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'comparisons': comparisons}, indent=2) + '\n')
          entries = {str(p.relative_to(out)): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(out.rglob('*')) if p.is_file()}
          (out / 'SHA256.json').write_text(json.dumps(entries, indent=2) + '\n')
          print(json.dumps(comparisons, indent=2))
          assert all(row['exact_metrics_match'] for row in comparisons), 'Runtime drift needs investigation'
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actionable-boundary-${{ matrix.study }}-${{ github.run_id }}
          path: ${{ runner.temp }}/decision-evidence/
          retention-days: 90
          if-no-files-found: error
